<!-- 返回主页（全站统一入口）。默认 30% 透明，鼠标动一下才显形并停留 2 秒，尽量不打扰场景本身 -->
<style>
  #back-home{
    position:fixed;left:14px;top:14px;z-index:2147483000;
    display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;border-radius:6px;text-decoration:none;
    font:600 13px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    letter-spacing:.02em;color:#e8eef5;background:rgba(18,24,32,.55);

    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
    opacity:.30;transition:opacity .25s ease,background .2s,color .2s,transform .2s;
  }
  #back-home:hover{opacity:1;background:rgba(30,40,52,.85);border-color:rgba(255,255,255,.35);transform:translateY(-1px)}
  @media (prefers-reduced-motion:reduce){#back-home{transition:none}}
</style>
<a id="back-home" href="../../index.html">← 返回主页</a>
<script>
  (function () {
    var b = document.getElementById('back-home');
    if (!b) return;
    var timer = null;
    document.addEventListener('mousemove', function () {
      b.style.opacity = '1';
      clearTimeout(timer);
      timer = setTimeout(function () { b.style.opacity = '.30'; }, 2200);
    }, { passive: true });
  })();
</script>
