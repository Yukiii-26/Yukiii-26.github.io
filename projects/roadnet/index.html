<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#faf8f4" />

<title>城市路网生成器 · Yukishiro</title>
<meta name="description" content="按一个种子生成架空城市的路网：块状、辐射状、条状三种肌理，城市核心密集、外围乡村稀疏，带国道编号与地名。纯前端单文件，零依赖。" />

<script>
  // 主题要在页面画出来之前就读出来，否则会先闪一下白底
  (function () {
    try {
      var saved = localStorage.getItem('theme');
      var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', saved || (sysDark ? 'dark' : 'light'));
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
  })();
</script>

<style>
  /* ===================== 和主页同一套颜色 ===================== */
  :root{
    --paper:#faf8f4;
    --surface:#ffffff;
    --ink:#16130f;
    --muted:#6f675c;
    --line:#e2dbd0;
    --accent:#c2410c;
    --max:1240px;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#100e0d;
    --surface:#1a1714;
    --ink:#f0ece8;
    --muted:#a29c95;
    --line:rgba(255,255,255,.11);
    --accent:#fb923c;
  }
  :root[data-theme="light"]{color-scheme:light}

  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);line-height:1.8;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background-color .35s ease,color .35s ease;
    padding:0 0 60px;
  }
  a{color:inherit;text-decoration:none}
  h1,h2{margin:0;line-height:1.15;letter-spacing:-.03em}
  p{margin:0}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 26px}

  /* ===================== 返回主页 + 主题按钮 ===================== */
  .back-home,.theme-btn{
    position:fixed;top:14px;z-index:20;display:inline-flex;align-items:center;gap:6px;
    padding:7px 13px;font-size:13px;font-weight:600;letter-spacing:.02em;
    background:var(--surface);border:1px solid var(--line);border-radius:2px;
    cursor:pointer;color:var(--ink);
    transition:border-color .18s,color .18s,transform .18s,background .18s;
  }
  .back-home{left:14px}
  .theme-btn{right:14px;padding:7px 11px}
  .back-home:hover,.theme-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
  .back-home:active,.theme-btn:active{transform:none}

  /* ===================== 标题区 ===================== */
  .head{padding:78px 0 24px}
  .kicker{
    font-size:11px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);margin-bottom:12px;
  }
  h1{font-size:clamp(34px,6vw,64px);font-weight:800}
  .lede{margin-top:16px;max-width:660px;color:var(--muted);font-size:15px}
  .lede b{color:var(--ink);font-weight:600}

  /* ===================== 参数面板 ===================== */
  .panel{
    margin-top:24px;border:1px solid var(--line);background:var(--surface);
    padding:18px 20px;display:flex;flex-direction:column;gap:14px;
  }
  .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .row + .row{padding-top:14px;border-top:1px solid var(--line)}
  .field{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
  .field input[type=text]{
    width:150px;padding:6px 9px;font:inherit;font-size:13px;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);border-radius:2px;outline:none;
  }
  .field input[type=text]:focus{border-color:var(--accent)}
  .field input[type=range]{width:120px;accent-color:var(--accent)}
  .num{font-variant-numeric:tabular-nums;color:var(--ink);min-width:2.2em;display:inline-block;text-align:right}
  .chk{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
  .chk input{accent-color:var(--accent);width:15px;height:15px}

  button{
    font:inherit;font-size:13px;font-weight:600;letter-spacing:.02em;
    padding:7px 14px;border-radius:2px;cursor:pointer;color:var(--ink);
    background:var(--paper);border:1px solid var(--line);
    transition:border-color .18s,color .18s,background .18s;
  }
  button:hover{border-color:var(--accent);color:var(--accent)}
  button.primary{background:var(--ink);border-color:var(--ink);color:var(--paper)}
  button.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
  .spacer{flex:1 1 auto}

  /* 三种肌理：分段按钮 */
  .modes{display:inline-flex;border:1px solid var(--line);border-radius:2px;overflow:hidden}
  .modes button{
    border:0;border-radius:0;padding:7px 16px;background:transparent;
    border-right:1px solid var(--line);
  }
  .modes button:last-child{border-right:0}
  .modes button.on{background:var(--ink);color:var(--paper)}
  .modes button.on:hover{color:#fff;background:var(--accent)}
  .mode-hint{font-size:12px;color:var(--muted)}

  /* ===================== 画布 ===================== */
  .stage{margin:22px 0 0}
  .canvas-wrap{position:relative;border:1px solid var(--line);background:var(--paper);overflow:hidden}
  canvas{display:block;width:100%;height:auto}

  /* ===================== 数据条 ===================== */
  .stats{
    display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:14px;
    font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
  }
  .stats b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:0;font-size:14px;margin-left:6px;text-transform:none}
  .hint{margin-top:10px;font-size:12px;color:var(--muted)}
  kbd{
    font-family:ui-monospace,Consolas,monospace;font-size:11px;
    border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;
    padding:1px 5px;color:var(--ink);background:var(--surface);
  }
  .foot{margin-top:44px;padding-top:18px;border-top:2px solid var(--ink);font-size:12px;color:var(--muted)}

  @media (max-width:640px){
    .head{padding-top:70px}
    .field input[type=text]{width:110px}
    .panel{padding:15px 14px}
    .back-home,.theme-btn{font-size:12px;padding:6px 10px}
    .modes button{padding:7px 11px}
  }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important} }
</style>
</head>
<body>

<a class="back-home" href="../../index.html">← 返回主页</a>
<button class="theme-btn" id="themeBtn" title="切换深色 / 浅色">☾ 深色</button>

<div class="wrap">

  <header class="head">
    <p class="kicker">作品 · 生成器</p>
    <h1>城市路网</h1>
    <p class="lede">
      给一个种子，生成一张架空城市的路网图：<b>块状、辐射状、条状</b>三种肌理可选，
      城市核心街区细密，外围散着村庄、乡村路和国道——像真实城市的地图那样分布。
    </p>
  </header>

  <section class="panel" aria-label="生成参数">
    <div class="row">
      <span class="field">城市肌理</span>
      <div class="modes" id="modes">
        <button data-mode="grid" class="on">块状</button>
        <button data-mode="radial">辐射状</button>
        <button data-mode="strip">条状</button>
      </div>
      <span class="mode-hint" id="modeHint">正交网格：规划新城、平原城市</span>
    </div>

    <div class="row">
      <label class="field">种子
        <input type="text" id="seed" value="yulin" spellcheck="false" autocomplete="off" />
      </label>
      <button id="dice" title="换一个随机种子">🎲 随机种子</button>
      <button id="gen" class="primary">重新生成</button>
      <span class="spacer"></span>
      <button id="save" title="把当前画面存成图片">⬇ 存成 PNG</button>
    </div>

    <div class="row">
      <label class="field">细密度
        <input type="range" id="detail" min="1" max="5" step="1" value="3" />
        <span class="num" id="detailVal">3</span>
      </label>
      <label class="field">弯曲度
        <input type="range" id="warp" min="0" max="100" step="5" value="45" />
        <span class="num" id="warpVal">45</span>
      </label>
      <label class="chk"><input type="checkbox" id="river" checked /> 河流</label>
      <label class="chk"><input type="checkbox" id="blockFill" checked /> 街区填充</label>
      <label class="chk"><input type="checkbox" id="park" checked /> 公园</label>
      <label class="chk"><input type="checkbox" id="rural" checked /> 乡村</label>
      <label class="chk"><input type="checkbox" id="labels" checked /> 地名</label>
    </div>
  </section>

  <figure class="stage">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>
  </figure>

  <div class="stats" id="stats">
    <span>街区<b id="statBlocks">—</b></span>
    <span>道路总长<b id="statLength">—</b></span>
    <span>村庄<b id="statVillages">—</b></span>
  </div>
  <p class="hint">
    城市核心之外是乡村：村庄、乡道和国道。画面没有边界，路网只是被画框切断了。<br />
    快捷键：<kbd>R</kbd> 重新生成 · <kbd>S</kbd> 存图 · 链接 <code>#肌理/种子</code> 可分享同一张图。
  </p>

  <footer class="foot">
    纯前端 · 单文件 · 零依赖。块状＝平原新城，辐射状＝老城与丘陵，条状＝河谷与交通轴；种子相同，城市就相同。
  </footer>

</div>

<script>
(function () {
  'use strict';

  /* =====================================================================
     可改参数区 —— 想换手感就改这里
     ===================================================================== */
  var DEFAULTS = {
    mode: 'grid',      // grid=块状 / radial=辐射状 / strip=条状
    seed: 'yulin',
    detail: 3,         // 1..5：街区细密度
    warp: 45,          // 0..100：道路弯曲度
    river: true,
    blocks: true,
    parks: true,
    rural: true,
    labels: true
  };

  var KM_ACROSS = 8;   // 整张图横向按 8 公里估算（只影响统计数字）

  var MODE_HINT = {
    grid: '正交网格：规划新城、平原城市',
    radial: '放射路 + 环路：老城、丘陵城市',
    strip: '沿河谷或交通轴发展：带状城市'
  };

  /* 名字词库：架空地名用，可随意增删 */
  var CITY_A = ['榆', '清', '云', '柳', '石', '南', '北', '安', '平', '怀', '河', '山', '林', '阳', '川', '沙', '岚', '靖', '定', '绥'];
  var CITY_B = ['林', '川', '阳', '城', '源', '安', '宁', '化', '德', '州', '谷', '原', '泉', '堡', '关', '陵'];
  var VILL_A = ['前', '后', '上', '下', '大', '小', '刘', '李', '张', '王', '郭', '贺', '白', '高', '石', '杨', '党', '薛'];
  var VILL_B = ['家', '树', '柳', '河', '沟', '坡', '台', '湾', '梁', '渠', '峁', '畔'];
  var VILL_SUF = ['村', '庄', '堡', '沟', '湾', '梁', '塬', '店', '岔', '窑', '塔'];

  /* =====================================================================
     工具：随机、噪声、命名
     ===================================================================== */
  function $id(id) { return document.getElementById(id); }

  function hash32(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a = (a + 0x6D2B79F5) >>> 0;
      var t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function pick(rnd, arr) { return arr[Math.floor(rnd() * arr.length)]; }

  function makeNoise(rnd) {
    var perm = new Uint8Array(512), vals = new Float32Array(256), order = [], i, j, tmp;
    for (i = 0; i < 256; i++) order.push(i);
    for (i = 255; i > 0; i--) { j = Math.floor(rnd() * (i + 1)); tmp = order[i]; order[i] = order[j]; order[j] = tmp; }
    for (i = 0; i < 512; i++) perm[i] = order[i & 255];
    for (i = 0; i < 256; i++) vals[i] = rnd() * 2 - 1;
    function fade(t) { return t * t * t * (t * (t * 6 - 15) + 10); }
    function at(ix, iy) { return vals[perm[(ix & 255) + perm[iy & 255]]]; }
    return function (x, y) {
      var xi = Math.floor(x), yi = Math.floor(y);
      var u = fade(x - xi), v = fade(y - yi);
      var a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
      return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
    };
  }

  function cityName(rnd) { return pick(rnd, CITY_A) + pick(rnd, CITY_B); }
  function villageName(rnd) {
    var core = rnd() < 0.68 ? pick(rnd, VILL_A) + pick(rnd, VILL_B) : pick(rnd, CITY_A) + pick(rnd, CITY_B);
    return core + pick(rnd, VILL_SUF);
  }

  /* =====================================================================
     生成模型
     ===================================================================== */
  function buildModel(opt, width, height) {
    var rnd = mulberry32(hash32(opt.seed + '|' + opt.mode));

    // ---- 坐标扭曲：让笔直的路像长在地形上 ----
    var warpAmp = opt.warp / 100 * 26;
    var warpK = 1 / 340;
    var warpFn = null;
    if (warpAmp > 0.01) {
      var n1 = makeNoise(rnd), n2 = makeNoise(rnd), n3 = makeNoise(rnd), n4 = makeNoise(rnd);
      warpFn = function (x, y) {
        var dx = n1(x * warpK, y * warpK) * warpAmp + n3(x * warpK * 2.7, y * warpK * 2.7) * warpAmp * 0.35;
        var dy = n2(x * warpK, y * warpK) * warpAmp + n4(x * warpK * 2.7, y * warpK * 2.7) * warpAmp * 0.35;
        return [x + dx, y + dy];
      };
    }
    function sample(pts, step) {
      var out = [], s = step || 8, i, j, n, t, ax, ay, bx, by, seg;
      for (i = 0; i < pts.length - 1; i++) {
        ax = pts[i][0]; ay = pts[i][1]; bx = pts[i + 1][0]; by = pts[i + 1][1];
        seg = Math.hypot(bx - ax, by - ay);
        n = Math.max(1, Math.ceil(seg / s));
        for (j = 0; j < n; j++) { t = j / n; out.push([ax + (bx - ax) * t, ay + (by - ay) * t]); }
      }
      out.push([pts[pts.length - 1][0], pts[pts.length - 1][1]]);
      return out;
    }
    function warpPath(pts, step) {
      var s = sample(pts, step);
      if (!warpFn) return s;
      return s.map(function (p) { return warpFn(p[0], p[1]); });
    }

    var roads = [];    // {pts, level, kind}  level 0=主干道 1=次干道 2=支路 3=小巷
    var blocks = [];   // 原始多边形
    var parks = [];
    var fields = [];   // 城外田野
    var villages = [];
    var shields = [];  // 国道 / 省道编号
    var cx = width * (0.42 + rnd() * 0.14);
    var cy = height * (0.45 + rnd() * 0.10);

    function addRoad(pts, level, kind) { roads.push({ pts: pts, level: level, kind: kind || 'core' }); }

    // 通用正交切分：块状城市的主体、飞地、以及辐射状城市的中心小格网都用它
    function bspGrid(rect, minFn, jitter, maxDepth) {
      (function split(r, depth) {
        var m = minFn(r);
        var canV = r.w > m * 2, canH = r.h > m * 2;
        if ((!canV && !canH) || depth >= maxDepth) {
          if (r.w > 5 && r.h > 5) blocks.push(rectPoly(r, 2));
          return;
        }
        var vertical;
        if (canV && !canH) vertical = true;
        else if (canH && !canV) vertical = false;
        else if (r.w > r.h * 1.2) vertical = true;
        else if (r.h > r.w * 1.2) vertical = false;
        else vertical = rnd() < 0.5;
        var t = 0.5 + (rnd() - 0.5) * jitter;
        if (vertical) {
          var x = r.x + r.w * t;
          addRoad([[x, r.y], [x, r.y + r.h]], Math.min(depth + 1, 3));
          split({ x: r.x, y: r.y, w: x - r.x, h: r.h }, depth + 1);
          split({ x: x, y: r.y, w: r.x + r.w - x, h: r.h }, depth + 1);
        } else {
          var y = r.y + r.h * t;
          addRoad([[r.x, y], [r.x + r.w, y]], Math.min(depth + 1, 3));
          split({ x: r.x, y: r.y, w: r.w, h: y - r.y }, depth + 1);
          split({ x: r.x, y: y, w: r.w, h: r.y + r.h - y }, depth + 1);
        }
      })(rect, 0);
    }

    /* ---------------------------------------------------------------
       一、城市核心：按肌理生成街区
       --------------------------------------------------------------- */
    if (opt.mode === 'grid') {
      var cityW = width * 0.52, cityH = height * 0.56;
      var fx = cx - cityW / 2, fy = cy - cityH / 2;
      var baseMin = 36 - opt.detail * 4;   // 32 / 28 / 24 / 20 / 16

      function localMin(r) {
        var d = Math.hypot(r.x + r.w / 2 - cx, r.y + r.h / 2 - cy) / (cityW * 0.5);
        d = Math.min(1, d);
        return baseMin * (1 + 1.8 * d * d);
      }
      bspGrid({ x: fx, y: fy, w: cityW, h: cityH }, localMin, 0.34, 11);

      // 城边两块「飞地」：让城市轮廓不是规矩的矩形，而是像摊开的面团
      for (var lb = 0; lb < 2; lb++) {
        var side = Math.floor(rnd() * 4);
        var lw = cityW * (0.20 + rnd() * 0.16), lh = cityH * (0.18 + rnd() * 0.16);
        var lx = fx, ly = fy;
        if (side === 0) { lx = fx + (rnd() - 0.3) * cityW; ly = fy - lh * 0.55; }
        else if (side === 1) { lx = fx + (rnd() - 0.3) * cityW; ly = fy + cityH - lh * 0.45; }
        else if (side === 2) { lx = fx - lw * 0.45; ly = fy + rnd() * cityH * 0.8; }
        else { lx = fx + cityW - lw * 0.55; ly = fy + rnd() * cityH * 0.8; }
        bspGrid({ x: lx, y: ly, w: lw, h: lh }, function () { return baseMin * 1.15; }, 0.46, 8);
      }

      // 贯穿全图的几条主干道（一直伸到画面外）
      for (var i = 0; i < 3; i++) {
        var vx = fx + cityW * (0.18 + i * 0.32) + (rnd() - 0.5) * 30;
        addRoad([[vx, -20], [vx + (rnd() - 0.5) * 40, height * 0.5], [vx, height + 20]], 0);
      }
      for (var j = 0; j < 2; j++) {
        var hy = fy + cityH * (0.3 + j * 0.4) + (rnd() - 0.5) * 24;
        addRoad([[-20, hy], [width * 0.5, hy + (rnd() - 0.5) * 30], [width + 20, hy]], 0);
      }
    }

    /* ---------------------------------------------------------------
       辐射状：环路 + 放射路 + 同心扇区街区
       --------------------------------------------------------------- */
    if (opt.mode === 'radial') {
      var R = Math.min(width, height) * 0.30;
      var rings = 4 + Math.round(opt.detail * 0.8);        // 5..8
      var spokes = 12 + opt.detail * 2;                    // 14..22
      var wob = makeNoise(rnd);

      function ringPts(radius) {
        var pts = [];
        for (var a = 0; a <= 360; a += 5) {
          var ang = a * Math.PI / 180;
          var k = 1 + wob(ang * 2.2, radius * 0.01) * 0.10;
          pts.push([cx + Math.cos(ang) * radius * k, cy + Math.sin(ang) * radius * k]);
        }
        return pts;
      }
      for (var ri = 1; ri <= rings; ri++) {
        addRoad(ringPts(R * ri / rings), ri === rings ? 0 : (ri === 1 ? 2 : 1), 'ring');
      }
      for (var si = 0; si < spokes; si++) {
        var ang2 = si * Math.PI * 2 / spokes + (rnd() - 0.5) * 0.10;
        var pts2 = [];
        var reach = Math.hypot(width, height) * 0.62;
        for (var tt = 0; tt <= 1.0001; tt += 0.08) {
          var rr = R * 0.05 + tt * reach;
          var bend = Math.sin(tt * 3 + si) * 0.035;
          pts2.push([cx + Math.cos(ang2 + bend) * rr, cy + Math.sin(ang2 + bend) * rr]);
        }
        addRoad(pts2, si % 3 === 0 ? 0 : 1, 'spoke');
      }
      // 老城核心：一小块正交街巷，免得所有路掐在一个点上
      var coreW = R * 0.34;
      bspGrid({ x: cx - coreW / 2, y: cy - coreW / 2, w: coreW, h: coreW },
        function () { return R * 0.055; }, 0.3, 6);

      // 沿放射路的郊区组团：城市是顺着干道一圈圈往外长的
      for (var sub = 0; sub < 7; sub++) {
        var si3 = Math.floor(rnd() * spokes);
        var a4 = si3 * Math.PI * 2 / spokes + (rnd() - 0.5) * 0.06;
        var rr4 = R * (1.12 + rnd() * 0.9);
        var bx4 = cx + Math.cos(a4) * rr4, by4 = cy + Math.sin(a4) * rr4;
        var spurLen = 30 + rnd() * 50;
        var sx4 = bx4 - Math.sin(a4) * spurLen, sy4 = by4 + Math.cos(a4) * spurLen;
        addRoad([[bx4, by4], [sx4, sy4]], 3, 'spur');
        var lots = 2 + Math.floor(rnd() * 3);
        for (var lo = 0; lo < lots; lo++) {
          var tt4 = (lo + 0.6) / (lots + 0.2);
          var lx4 = bx4 + (sx4 - bx4) * tt4, ly4 = by4 + (sy4 - by4) * tt4;
          var bw4 = 12 + rnd() * 14, bh4 = 10 + rnd() * 12;
          blocks.push(rectPoly({ x: lx4 - bw4 / 2, y: ly4 - bh4 / 2, w: bw4, h: bh4 }, 1));
        }
      }

      // 同心扇区：内三环之间填成街区
      var fillRings = Math.min(3, rings);
      for (var fri = 0; fri < fillRings; fri++) {
        for (var fs = 0; fs < spokes; fs++) {
          var a0 = fs * Math.PI * 2 / spokes, a1 = (fs + 1) * Math.PI * 2 / spokes;
          var r0 = R * fri / rings, r1 = R * (fri + 1) / rings;
          var quad = [
            [cx + Math.cos(a0) * r0, cy + Math.sin(a0) * r0],
            [cx + Math.cos(a1) * r0, cy + Math.sin(a1) * r0],
            [cx + Math.cos(a1) * r1, cy + Math.sin(a1) * r1],
            [cx + Math.cos(a0) * r1, cy + Math.sin(a0) * r1]
          ];
          blocks.push(insetPoly(quad, 2.5));
        }
      }
    }

    /* ---------------------------------------------------------------
       条状：沿一条主轴平行的长街 + 频繁的横街
       --------------------------------------------------------------- */
    if (opt.mode === 'strip') {
      var tilt = (rnd() - 0.5) * 0.28;
      var ux = Math.cos(tilt), uy = Math.sin(tilt);
      var px = -uy, py = ux;
      var along = width * 0.62;     // 主轴半长
      var halfW = 70 + opt.detail * 14;  // 带子半宽
      var parallels = 5 + opt.detail;    // 6..10
      var axisPts = [[cx - ux * along, cy - uy * along], [cx + ux * along, cy + uy * along]];

      // 主轴（贯穿画面）
      addRoad([[cx - ux * width, cy - uy * width], [cx + ux * width, cy + uy * width]], 0, 'axis');

      // 平行街
      for (var pi = 0; pi < parallels; pi++) {
        var off = -halfW + (pi / (parallels - 1)) * halfW * 2;
        if (Math.abs(off) < 6) continue;
        var aLen = along * (0.72 + rnd() * 0.36);   // 每条街长短不一，带子两端就不整齐
        var p0 = [cx - ux * aLen + px * off, cy - uy * aLen + py * off];
        var p1 = [cx + ux * aLen + px * off, cy + uy * aLen + py * off];
        addRoad([p0, p1], pi === 0 || pi === parallels - 1 ? 0 : 2, 'parallel');
      }
      // 横街 + 街区
      var crossGap = 52 - opt.detail * 5;   // 47..27
      var rows = [];
      for (var s = -along; s <= along; s += crossGap) {
        var c0 = [cx + ux * s - px * halfW, cy + uy * s - py * halfW];
        var c1 = [cx + ux * s + px * halfW, cy + uy * s + py * halfW];
        addRoad([c0, c1], 2, 'cross');
        rows.push(s);
      }
      for (var r2 = 0; r2 < rows.length - 1; r2++) {
        for (var pi2 = 0; pi2 < parallels - 1; pi2++) {
          var o0 = -halfW + (pi2 / (parallels - 1)) * halfW * 2;
          var o1 = -halfW + ((pi2 + 1) / (parallels - 1)) * halfW * 2;
          if (Math.abs(o1 - o0) < 8) continue;
          var s0 = rows[r2] + 2, s1 = rows[r2 + 1] - 2;
          blocks.push(insetPoly([
            [cx + ux * s0 + px * o0, cy + uy * s0 + py * o0],
            [cx + ux * s1 + px * o0, cy + uy * s1 + py * o0],
            [cx + ux * s1 + px * o1, cy + uy * s1 + py * o1],
            [cx + ux * s0 + px * o1, cy + uy * s0 + py * o1]
          ], 2));
        }
      }
    }

    /* ---------------------------------------------------------------
       二、国道：贯穿画面的两条长途公路（带编号）
       --------------------------------------------------------------- */
    var highwayCount = 2;
    var shieldPool = ['G210', 'G242', 'G65', 'G6521', 'S302', 'S12', 'G1812', 'S551'];
    for (var hi = 0; hi < highwayCount; hi++) {
      var vertical = rnd() < 0.5;
      var lane = (vertical ? width : height) * (0.15 + rnd() * 0.7);
      var pts3 = [];
      for (var q = 0; q <= 4; q++) {
        var t3 = q / 4;
        var jitter = (rnd() - 0.5) * 90;
        pts3.push(vertical
          ? [lane + jitter + Math.sin(t3 * 2.4 + hi) * 26, -30 + t3 * (height + 60)]
          : [-30 + t3 * (width + 60), lane + jitter + Math.sin(t3 * 2.4 + hi) * 26]);
      }
      addRoad(pts3, 0, 'highway');
      shields.push({ x: pts3[1][0], y: pts3[1][1], text: pick(rnd, shieldPool), highway: true });
    }

    /* ---------------------------------------------------------------
       三、乡村：村庄 + 乡道 + 田野
       --------------------------------------------------------------- */
    if (opt.rural) {
      var villageCount = 7 + Math.round(rnd() * 6);

      // 城市边缘的「出口」：乡道都从这里接出去，而不是全部扎向市中心
      var anchors = [];
      if (opt.mode === 'grid') {
        for (var ax2 = fx; ax2 <= fx + cityW; ax2 += 75) {
          anchors.push({ x: ax2, y: fy }, { x: ax2, y: fy + cityH });
        }
        for (var ay2 = fy; ay2 <= fy + cityH; ay2 += 75) {
          anchors.push({ x: fx, y: ay2 }, { x: fx + cityW, y: ay2 });
        }
      } else if (opt.mode === 'radial') {
        for (var aa2 = 0; aa2 < 360; aa2 += 14) {
          var ar = aa2 * Math.PI / 180;
          anchors.push({ x: cx + Math.cos(ar) * R * 1.08, y: cy + Math.sin(ar) * R * 1.08 });
        }
      } else {
        for (var as2 = -along; as2 <= along; as2 += 75) {
          anchors.push(
            { x: cx + ux * as2 - px * halfW, y: cy + uy * as2 - py * halfW },
            { x: cx + ux * as2 + px * halfW, y: cy + uy * as2 + py * halfW }
          );
        }
      }

      var inCity = function (x, y) {
        if (opt.mode === 'radial') return Math.hypot(x - cx, y - cy) < R * 1.12;
        if (opt.mode === 'strip') {
          var du = (x - cx) * ux + (y - cy) * uy;
          var dv = -(x - cx) * uy + (y - cy) * ux;
          return Math.abs(du) < along * 1.05 && Math.abs(dv) < halfW * 1.15;
        }
        return Math.abs(x - cx) < cityW * 0.54 + 24 && Math.abs(y - cy) < cityH * 0.54 + 24;
      };
      var guard = 0;
      while (villages.length < villageCount && guard++ < 400) {
        var vx2 = 30 + rnd() * (width - 60), vy2 = 30 + rnd() * (height - 60);
        if (inCity(vx2, vy2)) continue;
        var tooClose = villages.some(function (v) { return Math.hypot(v.x - vx2, v.y - vy2) < 110; });
        if (tooClose) continue;
        villages.push({ x: vx2, y: vy2, name: villageName(rnd), size: 3 + Math.round(rnd() * 3) });
      }

      // 村庄：一条主街 + 一两条巷子（不是放射状的星形）
      villages.forEach(function (v) {
        var a = rnd() * Math.PI, L = 34 + rnd() * 44;
        var dxv = Math.cos(a), dyv = Math.sin(a);
        addRoad([[v.x - dxv * L, v.y - dyv * L], [v.x + dxv * L, v.y + dyv * L]], 3, 'village');
        var lanes = 1 + Math.round(rnd() * 2);
        for (var k = 0; k < lanes; k++) {
          var tt = (rnd() - 0.5) * L * 1.1;
          var sign = rnd() < 0.5 ? -1 : 1;
          var laneLen = 14 + rnd() * 24;
          var bx0 = v.x + dxv * tt, by0 = v.y + dyv * tt;
          addRoad([[bx0, by0], [bx0 - dyv * laneLen * sign, by0 + dxv * laneLen * sign]], 3, 'village');
        }
      });

      // 乡道：接到最近的城市出口，中途顺着地形弯两下
      var buds = anchors.slice();
      villages.forEach(function (v) {
        var best = null, bestD = Infinity;
        buds.forEach(function (p) {
          var d = Math.hypot(p.x - v.x, p.y - v.y);
          if (d < bestD) { bestD = d; best = p; }
        });
        if (!best) return;
        var dxv2 = v.x - best.x, dyv2 = v.y - best.y;
        var span = Math.hypot(dxv2, dyv2) || 1;
        var bends = 2 + Math.floor(rnd() * 2);
        var pts4 = [[best.x, best.y]];
        for (var b2 = 1; b2 < bends; b2++) {
          var t5 = b2 / bends;
          var off = (rnd() - 0.5) * span * 0.32;
          pts4.push([
            best.x + dxv2 * t5 - dyv2 / span * off,
            best.y + dyv2 * t5 + dxv2 / span * off
          ]);
        }
        pts4.push([v.x, v.y]);
        addRoad(pts4, 3, 'rural');
        buds.push(v);
      });

      // 田野：城外几块浅绿色地块
      for (var f = 0; f < 4; f++) {
        var fxp = 40 + rnd() * (width - 80), fyp = 40 + rnd() * (height - 80);
        if (inCity(fxp, fyp)) continue;
        var poly = [];
        var sides = 5 + Math.floor(rnd() * 4);
        for (var s2 = 0; s2 < sides; s2++) {
          var ang3 = (s2 / sides) * Math.PI * 2;
          var rad = 40 + rnd() * 60;
          poly.push([fxp + Math.cos(ang3) * rad * (1 + rnd() * 0.3), fyp + Math.sin(ang3) * rad * 0.7 * (1 + rnd() * 0.3)]);
        }
        fields.push(poly);
      }
    }

    /* ---------------------------------------------------------------
       四、河流与公园
       --------------------------------------------------------------- */
    var river = null;
    if (opt.river) {
      var horizontal = opt.mode === 'strip' ? true : rnd() < 0.5;
      var base = horizontal ? cy + (rnd() - 0.5) * height * 0.35 : cx + (rnd() - 0.5) * width * 0.35;
      var phase = rnd() * 10, amp = (horizontal ? height : width) * 0.06;
      var rp = [];
      for (var t4 = -60; t4 <= (horizontal ? width : height) + 60; t4 += 14) {
        var wobble = Math.sin(t4 / 190 + phase) * amp * 0.7 + Math.sin(t4 / 61 + phase * 2) * amp * 0.3;
        rp.push(horizontal ? [t4, base + wobble] : [base + wobble, t4]);
      }
      river = rp;
    }

    // 公园：城里随机挑几个街区
    if (opt.parks && blocks.length) {
      var want = Math.max(2, Math.round(blocks.length * 0.05));
      for (var pk = 0; pk < want; pk++) {
        var bi = Math.floor(rnd() * blocks.length);
        parks.push(blocks[bi]);
      }
    }

    /* ---------------------------------------------------------------
       五、输出（统一扭曲）
       --------------------------------------------------------------- */
    var outRoads = roads.map(function (r) {
      return { pts: warpPath(r.pts, 8), level: r.level, kind: r.kind };
    });
    var outBlocks = blocks.map(function (p) { return warpPath(p.concat([p[0]]), 9); });
    var outParks = parks.map(function (p) { return warpPath(p.concat([p[0]]), 9); });
    var outFields = fields.map(function (p) { return warpPath(p.concat([p[0]]), 12); });
    var outRiver = river ? warpPath(river, 10) : null;

    var totalPx = 0;
    outRoads.forEach(function (r) {
      for (var i = 0; i < r.pts.length - 1; i++) {
        totalPx += clipLen(r.pts[i][0], r.pts[i][1], r.pts[i + 1][0], r.pts[i + 1][1], width, height);
      }
    });

    var visBlocks = 0;
    outBlocks.forEach(function (p) {
      var sx = 0, sy = 0;
      p.forEach(function (pt) { sx += pt[0]; sy += pt[1]; });
      sx /= p.length; sy /= p.length;
      if (sx >= 0 && sx <= width && sy >= 0 && sy <= height) visBlocks++;
    });

    function warped(x, y) { return warpFn ? warpFn(x, y) : [x, y]; }

    return {
      roads: outRoads, blocks: outBlocks, parks: outParks, fields: outFields,
      river: outRiver,
      villages: villages.map(function (v) {
        var p = warped(v.x, v.y);
        return { x: p[0], y: p[1], name: v.name };
      }),
      cityLabel: (function () {
        var p = warped(cx, cy);
        return { x: p[0], y: p[1], name: cityName(rnd) };
      })(),
      shields: shields.map(function (sh) {
        var p = warped(sh.x, sh.y);
        return { x: p[0], y: p[1], text: sh.text };
      }),
      stats: { blocks: visBlocks, lengthPx: totalPx, villages: villages.length }
    };
  }

  /* ---- 几何小工具 ---- */
  function rectPoly(r, inset) {
    return [
      [r.x + inset, r.y + inset], [r.x + r.w - inset, r.y + inset],
      [r.x + r.w - inset, r.y + r.h - inset], [r.x + inset, r.y + r.h - inset]
    ];
  }
  function insetPoly(poly, inset) {
    var cx = 0, cy = 0, i;
    for (i = 0; i < poly.length; i++) { cx += poly[i][0]; cy += poly[i][1]; }
    cx /= poly.length; cy /= poly.length;
    return poly.map(function (p) {
      var dx = p[0] - cx, dy = p[1] - cy, len = Math.hypot(dx, dy) || 1;
      return [p[0] - dx / len * inset, p[1] - dy / len * inset];
    });
  }
  function clipLen(x1, y1, x2, y2, w, h) {
    var t0 = 0, t1 = 1, dx = x2 - x1, dy = y2 - y1;
    var p = [-dx, dx, -dy, dy], q = [x1, w - x1, y1, h - y1];
    for (var i = 0; i < 4; i++) {
      if (Math.abs(p[i]) < 1e-9) { if (q[i] < 0) return 0; continue; }
      var t = q[i] / p[i];
      if (p[i] < 0) { if (t > t1) return 0; if (t > t0) t0 = t; }
      else { if (t < t0) return 0; if (t < t1) t1 = t; }
    }
    return Math.hypot(dx, dy) * Math.max(0, t1 - t0);
  }

  /* =====================================================================
     绘制
     ===================================================================== */
  var canvas = $id('canvas');
  var ctx = canvas.getContext('2d');
  var wrap = $id('canvasWrap');
  var model = null;
  var W = 960, H = 640;
  var opts = {
    mode: DEFAULTS.mode, seed: DEFAULTS.seed, detail: DEFAULTS.detail, warp: DEFAULTS.warp,
    river: DEFAULTS.river, blocks: DEFAULTS.blocks, parks: DEFAULTS.parks,
    rural: DEFAULTS.rural, labels: DEFAULTS.labels
  };

  function cssVar(name, fallback) {
    var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    return v || fallback;
  }
  function path(pts) {
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
  }

  function draw() {
    if (!model) return;
    var dpr = window.devicePixelRatio || 1;
    var ink = cssVar('--ink', '#16130f');
    var paper = cssVar('--paper', '#faf8f4');
    var accent = cssVar('--accent', '#c2410c');
    var s = Math.max(0.72, Math.min(1.3, W / 1150));

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = paper;
    ctx.fillRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 田野
    if (opts.rural && model.fields.length) {
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = 'rgb(126,158,96)';
      model.fields.forEach(function (p) { path(p); ctx.closePath(); ctx.fill(); });
    }

    // 街区
    if (opts.blocks) {
      ctx.globalAlpha = 0.07;
      ctx.fillStyle = ink;
      model.blocks.forEach(function (p) { path(p); ctx.closePath(); ctx.fill(); });
      // 街区描边：让街巷的「两侧路缘」连起来，城市的肌理才读得出来
      ctx.globalAlpha = 0.3;
      ctx.strokeStyle = ink;
      ctx.lineWidth = 0.9 * s;
      model.blocks.forEach(function (p) { path(p); ctx.closePath(); ctx.stroke(); });
    }

    // 公园
    if (opts.parks) {
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = 'rgb(96,132,82)';
      model.parks.forEach(function (p) { path(p); ctx.closePath(); ctx.fill(); });
    }

    // 河流
    if (opts.river && model.river) {
      ctx.globalAlpha = 0.18;
      ctx.strokeStyle = 'rgb(96,132,166)';
      ctx.lineWidth = 22 * s;
      path(model.river); ctx.stroke();
      ctx.globalAlpha = 0.4;
      ctx.lineWidth = 8 * s;
      path(model.river); ctx.stroke();
    }

    // 道路：先乡村，再城市，最后国道
    var byLevel = { 3: { w: 1.3, a: 0.46 }, 2: { w: 1.85, a: 0.62 }, 1: { w: 2.7, a: 0.78 }, 0: { w: 4.4, a: 0.9 } };
    ctx.strokeStyle = ink;
    [3, 2, 1, 0].forEach(function (lv) {
      ctx.globalAlpha = byLevel[lv].a;
      ctx.lineWidth = byLevel[lv].w * s;
      model.roads.forEach(function (r) {
        if (r.level !== lv || r.kind === 'highway') return;
        path(r.pts); ctx.stroke();
      });
    });

    // 国道（最粗，画在最上层）
    ctx.globalAlpha = 0.92;
    ctx.lineWidth = 5.2 * s;
    model.roads.forEach(function (r) {
      if (r.kind !== 'highway') return;
      path(r.pts); ctx.stroke();
    });

    // 比例尺 + 指北针
    ctx.globalAlpha = 1;
    var pxPerKm = W / KM_ACROSS;
    var barLen = Math.min(pxPerKm, W * 0.28);
    var bx = 22, by = H - 26;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx, by); ctx.lineTo(bx + barLen, by);
    ctx.moveTo(bx, by - 4); ctx.lineTo(bx, by + 4);
    ctx.moveTo(bx + barLen, by - 4); ctx.lineTo(bx + barLen, by + 4);
    ctx.stroke();
    ctx.globalAlpha = 0.75;
    ctx.fillStyle = ink;
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.fillText('1 km', bx + barLen + 8, by + 4);

    ctx.globalAlpha = 0.8;
    ctx.strokeStyle = accent;
    ctx.fillStyle = accent;
    ctx.lineWidth = 1.5;
    var nx = W - 34, ny = 34;
    ctx.beginPath(); ctx.moveTo(nx, ny - 12); ctx.lineTo(nx, ny + 8); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(nx, ny - 14); ctx.lineTo(nx - 4, ny - 6); ctx.lineTo(nx + 4, ny - 6); ctx.closePath(); ctx.fill();
    ctx.font = '11px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('N', nx, ny + 22);
    ctx.textAlign = 'start';
    ctx.globalAlpha = 1;

    // 标注：地名 + 国道编号
    if (opts.labels) drawLabels(ink, paper, accent, s);
  }

  function drawLabels(ink, paper, accent, s) {
    // 城市名（带描边，压在线条上也看得清）
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(21 * s) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = paper;
    ctx.strokeText(model.cityLabel.name + '市', model.cityLabel.x, model.cityLabel.y - 26);
    ctx.fillStyle = ink;
    ctx.fillText(model.cityLabel.name + '市', model.cityLabel.x, model.cityLabel.y - 26);
    ctx.font = '600 ' + Math.round(10 * s) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = ink;
    ctx.globalAlpha = 0.6;
    ctx.fillText('CITY', model.cityLabel.x, model.cityLabel.y - 26 + 18 * s);
    ctx.globalAlpha = 1;

    // 村名
    if (opts.rural) {
      ctx.font = '500 ' + Math.round(11 * s) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
      model.villages.forEach(function (v) {
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = paper;
        ctx.strokeText(v.name, v.x + 9, v.y - 9);
        ctx.fillStyle = ink;
        ctx.globalAlpha = 0.85;
        ctx.fillText(v.name, v.x + 9, v.y - 9);
        ctx.globalAlpha = 1;
      });
    }

    // 国道编号牌
    model.shields.forEach(function (sh) {
      var label = sh.text;
      ctx.font = '700 ' + Math.round(10.5 * s) + 'px ui-monospace, Consolas, monospace';
      var w = ctx.measureText(label).width + 10;
      var h = 16 * s;
      var x = sh.x - w / 2, y = sh.y - h / 2;
      var fill = label.charAt(0) === 'S' ? '#e2b13c' : '#3f7d4f';
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = fill;
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, w, h, 3 * s); else ctx.rect(x, y, w, h);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, sh.x, sh.y + 0.5);
      ctx.textAlign = 'start';
      ctx.globalAlpha = 1;
    });

    ctx.textBaseline = 'alphabetic';
  }

  /* =====================================================================
     尺寸 / 生成 / 统计
     ===================================================================== */
  function resizeCanvas() {
    var dpr = window.devicePixelRatio || 1;
    var cssW = Math.max(300, Math.floor(wrap.getBoundingClientRect().width));
    var cssH = Math.round(Math.min(940, Math.max(420, cssW * 0.68)));
    W = cssW; H = cssH;
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = '100%';
    canvas.style.height = cssH + 'px';
  }

  function readControls() {
    opts.mode = currentMode;
    opts.seed = ($id('seed').value || 'seed').trim() || 'seed';
    opts.detail = +$id('detail').value;
    opts.warp = +$id('warp').value;
    opts.river = $id('river').checked;
    opts.blocks = $id('blockFill').checked;
    opts.parks = $id('park').checked;
    opts.rural = $id('rural').checked;
    opts.labels = $id('labels').checked;
  }

  function syncLabels() {
    $id('detailVal').textContent = opts.detail;
    $id('warpVal').textContent = opts.warp;
    $id('modeHint').textContent = MODE_HINT[opts.mode];
    Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-mode') === opts.mode);
    });
  }

  function updateStats() {
    var km = model.stats.lengthPx * (KM_ACROSS / W);
    $id('statBlocks').textContent = model.stats.blocks;
    $id('statLength').textContent = km.toFixed(1) + ' km';
    $id('statVillages').textContent = model.stats.villages;
  }

  function regenerate() {
    readControls();
    syncLabels();
    model = buildModel(opts, W, H);
    draw();
    updateStats();
    try { history.replaceState(null, '', '#' + opts.mode + '/' + encodeURIComponent(opts.seed)); } catch (e) {}
  }

  function fullRegenerate() { resizeCanvas(); regenerate(); }

  /* =====================================================================
     事件
     ===================================================================== */
  var currentMode = DEFAULTS.mode;

  Array.prototype.forEach.call(document.querySelectorAll('.modes button'), function (btn) {
    btn.addEventListener('click', function () {
      currentMode = btn.getAttribute('data-mode');
      fullRegenerate();
    });
  });

  $id('gen').addEventListener('click', fullRegenerate);
  $id('dice').addEventListener('click', function () {
    var pool = 'abcdefghijkmnpqrstuvwxyz23456789';
    var s = '';
    for (var i = 0; i < 6; i++) s += pool[Math.floor(Math.random() * pool.length)];
    $id('seed').value = s;
    fullRegenerate();
  });
  $id('save').addEventListener('click', function () {
    canvas.toBlob(function (blob) {
      if (!blob) return;
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'city-' + opts.mode + '-' + opts.seed.replace(/[^\w\u4e00-\u9fa5-]+/g, '_') + '.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    }, 'image/png');
  });

  ['river', 'blockFill', 'park', 'rural', 'labels'].forEach(function (id) {
    $id(id).addEventListener('change', function () { readControls(); draw(); updateStats(); });
  });

  var sliderTimer = null;
  ['detail', 'warp'].forEach(function (id) {
    $id(id).addEventListener('input', function () {
      readControls(); syncLabels();
      clearTimeout(sliderTimer);
      sliderTimer = setTimeout(function () { model = buildModel(opts, W, H); draw(); updateStats(); }, 130);
    });
  });

  $id('seed').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') fullRegenerate();
  });

  var themeBtn = $id('themeBtn');
  function paintThemeLabel() {
    themeBtn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀ 浅色' : '☾ 深色';
  }
  themeBtn.addEventListener('click', function () {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    paintThemeLabel();
    draw();
  });
  paintThemeLabel();

  document.addEventListener('keydown', function (e) {
    if (/input|textarea|select/i.test(e.target.tagName || '')) return;
    if (e.key === 'r' || e.key === 'R') fullRegenerate();
    if (e.key === 's' || e.key === 'S') $id('save').click();
  });

  var resizeTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resizeCanvas(); regenerate(); }, 220);
  });

  /* =====================================================================
     启动：#肌理/种子
     ===================================================================== */
  (function init() {
    var hash = '';
    try { hash = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (e) {}
    if (hash) {
      var parts = hash.split('/');
      if (parts.length > 1 && MODE_HINT[parts[0]]) {
        currentMode = parts[0];
        $id('seed').value = parts.slice(1).join('/');
      } else {
        $id('seed').value = hash;
      }
    }
    $id('detail').value = String(DEFAULTS.detail);
    $id('warp').value = String(DEFAULTS.warp);
    fullRegenerate();
  })();

})();
</script>
</body>
</html>
