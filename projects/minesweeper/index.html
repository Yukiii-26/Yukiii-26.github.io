<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>扫雷 Minesweeper</title>
<meta name="theme-color" id="themeColor" content="#e9f1f8" />

<script>
  // 这段必须放在样式之前，否则会先闪一下别的底色。
  // 默认浅色；用户按过右上角的 ☾ / ☀ 就记住他的选择（和主页共用 localStorage 的 theme）
  (function () {
    document.documentElement.classList.add('js');
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (e) {}
    document.documentElement.setAttribute('data-theme', (saved === 'light' || saved === 'dark') ? saved : 'light');
  })();
</script>

<style>
  /* ===================== 配色 =====================
     :root              = 原来那套深色（夜空深蓝 + 天蓝强调色），深色模式下保持原样
     [data-theme=light] = 与个人主页完全一致的浅色（雾蓝白）
     扫雷棋盘本身是经典 Windows 灰，两套主题下都不动，只把「外面那一层」做成主题色。 */
  :root {
    color-scheme: dark;
    --paper: #0b1220;
    --ink: #f4efe8;
    --muted: #bcb5ab;
    --line: rgba(255, 255, 255, .14);
    --accent: #6ec1f2;
    --accent-hi: #9ad6ff;
    --accent-ink: #06121e;
    --panel: rgba(255, 255, 255, .06);
    --panel-hi: rgba(255, 255, 255, .12);
    --panel-line: rgba(255, 255, 255, .16);
    --back-bg: rgba(9, 14, 24, .72);
    --back-bg-hi: rgba(20, 30, 46, .92);
    --h1-shadow: 0 2px 10px rgba(0, 0, 0, .6);
    --frame-shadow: 0 26px 60px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .10);
    --bg-img: url("../../assets/bg-dusk.jpg");
    --bg-veil: linear-gradient(180deg, rgba(8, 12, 20, .80), rgba(8, 12, 20, .90));

    /* 棋盘：经典 Windows 灰（两套主题共用，不要跟着变） */
    --face: #c0c0c0;
    --hi: #ffffff;
    --lo: #808080;
    --grid: #c6c6c6;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --paper: #e9f1f8;
    --ink: #101a24;
    --muted: #4c5a68;
    --line: rgba(16, 26, 36, .14);
    --accent: #1d6fa5;
    --accent-hi: #2a86c2;
    --accent-ink: #ffffff;
    --panel: rgba(255, 255, 255, .72);
    --panel-hi: rgba(255, 255, 255, .96);
    --panel-line: rgba(16, 26, 36, .16);
    --back-bg: rgba(255, 255, 255, .78);
    --back-bg-hi: rgba(255, 255, 255, .96);
    --h1-shadow: 0 1px 0 rgba(255, 255, 255, .72);
    --frame-shadow: 0 18px 40px rgba(16, 26, 36, .18), 0 0 0 1px rgba(16, 26, 36, .10);
    --bg-img: url("../../assets/bg-light.jpg");
    --bg-veil: linear-gradient(180deg, rgba(233, 241, 248, .78), rgba(233, 241, 248, .92));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: var(--paper);
    font-family: "Segoe UI", Tahoma, "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink);
    transition: background-color .3s ease, color .3s ease;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    padding: 20px;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .18em;
    color: var(--ink);
    text-shadow: var(--h1-shadow);
    transition: color .3s ease, text-shadow .3s ease;
  }
  .frame {
    /* 棋盘外框：颜色一律不跟主题走（保持复古灰），只有阴影/圆角是「页面外观」 */
    background: var(--face);
    padding: 8px;
    border-top: 4px solid var(--hi);
    border-left: 4px solid var(--hi);
    border-right: 4px solid #404040;
    border-bottom: 4px solid #404040;
    border-radius: 20px;
    box-shadow: var(--frame-shadow);
    transition: box-shadow .3s ease;
  }
  .panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 6px 8px;
    margin-bottom: 8px;
    border-top: 3px solid #808080;
    border-left: 3px solid #808080;
    border-right: 3px solid #ffffff;
    border-bottom: 3px solid #ffffff;
  }
  .led {
    display: flex;
    gap: 2px;
    background: #000;
    padding: 2px;
    border-width: 2px;
    border-style: solid;
    border-color: #808080 #ffffff #ffffff #808080;
  }
  .led i {
    width: 15px;
    text-align: center;
    font-family: Consolas, "Courier New", monospace;
    font-size: 22px;
    line-height: 26px;
    font-weight: 700;
    color: #ff2d2d;
    text-shadow: 0 0 8px #ff2d2d;
    font-style: normal;
  }
  .smiley {
    width: 40px;
    height: 40px;
    padding: 0;
    font-size: 22px;
    line-height: 30px;
    background: var(--face);
    border-width: 3px;
    border-style: solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    cursor: pointer;
  }
  .smiley:active {
    border-color: #808080 #ffffff #ffffff #808080;
  }
  .board {
    display: grid;
    gap: 0;
    background: #404040;
    border-width: 3px;
    border-style: solid;
    border-color: #808080 #ffffff #ffffff #808080;
  }
  .cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    border-width: 3px;
    border-style: solid;
    border-color: #ffffff #808080 #808080 #ffffff;
    background: var(--face);
    cursor: pointer;
    overflow: hidden;
  }
  .cell.revealed {
    border-width: 1px;
    border-color: var(--grid);
    background: #d2d2d2;
    cursor: default;
  }
  .cell.pressed {
    border-width: 1px;
    border-color: var(--grid);
  }
  .cell.mine { background: #d2d2d2; }
  .cell.boom { background: #ff3b3b; }
  .cell.err { background: #ffb3b3; }
  .cell.flag { font-size: .72em; }
  .n1 { color: #0000ff; } .n2 { color: #008200; } .n3 { color: #d40000; }
  .n4 { color: #000080; } .n5 { color: #800000; } .n6 { color: #008080; }
  .n7 { color: #000000; } .n8 { color: #6b6b6b; }
  .cell.boom { animation: boom .35s ease-out; }
  @keyframes boom { from { transform: scale(1.5); filter: brightness(2.2); } to { transform: scale(1); } }
  .levels { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .levels button {
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    background: var(--panel);
    color: var(--ink);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    transition: background-color .18s, border-color .18s, color .18s;
  }
  .levels button:hover { background: var(--panel-hi); border-color: var(--accent); }
  .levels button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .msg { height: 22px; font-size: 14px; color: var(--accent); }
  .help { font-size: 12px; line-height: 1.9; color: var(--muted); text-align: center; max-width: 620px; }
  kbd {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 8px;
    padding: 1px 5px; font-family: Consolas, monospace; font-size: 11px; color: var(--ink);
  }
  /* 返回主页：固定在左上角。用 fixed 定位就不参与上面那套垂直居中布局，不会把游戏挤歪 */
  .back-home {
    position: fixed;
    top: 14px;
    left: 14px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 13px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: .02em;
    text-decoration: none;
    color: var(--ink);
    background: var(--back-bg);
    border: 1px solid var(--panel-line);
    border-radius: 12px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    transition: background .18s, color .18s, border-color .18s, transform .18s;
  }
  .back-home:hover {
    background: var(--back-bg-hi);
    border-color: var(--accent);
    color: var(--ink);
    transform: translateY(-1px);
  }
  .back-home:active { transform: none; }

/* ===================== 与主页统一的外观（2026-10-21；2026-10-30 统一为「默认浅色 + 右上角切换」） ===================== */
/* 背景图：浅色 bg-light.jpg / 深色 bg-dusk.jpg，由上面的 --bg-img、--bg-veil 切换 */
.site-bg{position:fixed;inset:0;z-index:-2;pointer-events:none;
  background-color:var(--paper);
  background-image:var(--bg-img);
  background-position:center 42%;
  background-size:cover;
  background-repeat:no-repeat;
  transition:background-color .3s ease}
.site-bg::after{content:"";position:absolute;inset:0;background:var(--bg-veil)}

/* ☾ / ☀ 深浅色切换按钮（与主页同款），固定右上角，不参与游戏布局 */
.theme-toggle{
  position:fixed;top:14px;right:14px;z-index:11;
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:32px;border-radius:10px;cursor:pointer;padding:0;
  background:transparent;border:1px solid var(--line);color:var(--ink);
  transition:border-color .18s,color .18s,background .18s;
}
.theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round}
.theme-toggle .i-sun{display:none}
:root[data-theme="dark"] .theme-toggle .i-moon{display:none}
:root[data-theme="dark"] .theme-toggle .i-sun{display:block}
</style>

<body>
<div class="site-bg" aria-hidden="true"></div>

<!-- 返回主页。../../ 就是往上两层：minesweeper → projects → 网站根目录 -->
<a class="back-home" href="../../index.html">← 返回主页</a>

<!-- 深浅色切换：浅色时显示月亮（点了切深色），深色时显示太阳 -->
<button class="theme-toggle" id="themeToggle" type="button" aria-label="切换深色 / 浅色模式" title="切换深色 / 浅色模式">
  <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13.2A8.6 8.6 0 1 1 10.8 3.5a6.8 6.8 0 0 0 9.7 9.7z"/></svg>
  <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.2v2.4M12 19.4v2.4M2.2 12h2.4M19.4 12h2.4M5.1 5.1l1.7 1.7M17.2 17.2l1.7 1.7M18.9 5.1l-1.7 1.7M6.8 17.2l-1.7 1.7"/></svg>

<h1>扫 雷</h1>

<div class="frame">
  <div class="panel">
    <div class="led" id="ledMines"><i>0</i><i>0</i><i>0</i></div>
    <button class="smiley" id="smiley" title="重新开始">🙂</button>
    <div class="led" id="ledTime"><i>0</i><i>0</i><i>0</i></div>
  </div>
  <div class="board" id="board"></div>
</div>

<div class="levels" id="levels">
  <button data-level="beginner">初级 9×9 / 10</button>
  <button data-level="intermediate">中级 16×16 / 40</button>
  <button data-level="expert">高级 30×16 / 99</button>
</div>

<div class="msg" id="msg">点第一下绝不会踩雷，放心点。</div>

<div class="help">
  左键翻开 · 右键插旗 🚩 · 手机：轻触翻开、长按约 0.3 秒插旗<br>
  快捷键 <kbd>R</kbd> 重开 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切难度 · <kbd>空格</kbd> 一键清掉已确定安全的格子
</div>

<script>
(function () {
  'use strict';

  var LEVELS = {
    beginner:     { cols: 9,  rows: 9,  mines: 10, size: 32 },
    intermediate: { cols: 16, rows: 16, mines: 40, size: 28 },
    expert:       { cols: 30, rows: 16, mines: 99, size: 25 }
  };

  var boardEl = document.getElementById('board');
  var ledMinesEl = document.getElementById('ledMines');
  var ledTimeEl = document.getElementById('ledTime');
  var faceEl = document.getElementById('smiley');
  var levelsEl = document.getElementById('levels');
  var msgEl = document.getElementById('msg');

  // 兼容常见的 jQuery 风格选择器（本文件不依赖任何库）
  function $$(sel, root) {
    return Array.prototype.slice.call((root || document).querySelectorAll(sel));
  }

  var S = {
    level: 'beginner',
    cols: 9, rows: 9, mines: 10, size: 32,
    mine: null, num: null, state: null, el: null,
    first: true, finished: false,
    flags: 0, revealed: 0,
    time: 0, timer: null,
    pressTimer: null, suppressClick: false
  };

  function idx(r, c) { return r * S.cols + c; }

  function fmt(n) {
    var neg = n < 0;
    n = Math.abs(n);
    var s = String(n);
    while (s.length < 3) s = '0' + s;
    if (neg) s = '-' + s.slice(1);
    return s.slice(-3);
  }

  function setLed(el, val) {
    var t = fmt(val);
    for (var i = 0; i < 3; i++) el.children[i].textContent = t.charAt(i);
  }

  function renderTime() {
    setLed(ledTimeEl, Math.min(S.time, 999));
  }

  function stopTimer() {
    if (S.timer) { clearInterval(S.timer); S.timer = null; }
  }

  function startTimer() {
    stopTimer();
    S.time = 0;
    renderTime();
    S.timer = setInterval(function () {
      S.time++;
      if (S.time > 999) { S.time = 999; renderTime(); stopTimer(); return; }
      renderTime();
    }, 1000);
  }

  function placeMines(safe) {
    var total = S.cols * S.rows;
    var forbidden = {};
    var r0 = Math.floor(safe / S.cols), c0 = safe % S.cols;
    for (var i = 0; i < 8; i++) {
      var rr = r0 + [1, 1, 1, 0, 0, -1, -1, -1][i];
      var cc = c0 + [-1, 0, 1, -1, 1, -1, 0, 1][i];
      if (rr >= 0 && rr < S.rows && cc >= 0 && cc < S.cols) forbidden[rr * S.cols + cc] = 1;
    }
    forbidden[safe] = 1;

    var pool = [];
    for (var k = 0; k < total; k++) if (!forbidden[k]) pool.push(k);

    var count = Math.min(S.mines, pool.length);
    for (var j = 0; j < count; j++) {
      var pick = j + Math.floor(Math.random() * (pool.length - j));
      var tmp = pool[j]; pool[j] = pool[pick]; pool[pick] = tmp;
      S.mine[pool[j]] = true;
    }

    for (var p = 0; p < total; p++) {
      if (S.mine[p]) continue;
      var n = 0;
      var row = Math.floor(p / S.cols), col = p % S.cols;
      for (var d = 0; d < 8; d++) {
        var nr = row + [-1, -1, -1, 0, 0, 1, 1, 1][d];
        var nc = col + [-1, 0, 1, -1, 1, -1, 0, 1][d];
        if (nr < 0 || nr >= S.rows || nc < 0 || nc >= S.cols) continue;
        if (S.mine[nr * S.cols + nc]) n++;
      }
      S.num[p] = n;
    }
  }

  function build() {
    stopTimer();
    clearTimeout(S.pressTimer);
    S.pressTimer = null;
    S.suppressClick = false;

    var total = S.cols * S.rows;
    S.mine = new Array(total);
    S.num = new Array(total);
    S.state = new Array(total);
    for (var i = 0; i < total; i++) { S.mine[i] = false; S.num[i] = 0; S.state[i] = 0; }

    S.first = true;
    S.finished = false;
    S.flags = 0;
    S.revealed = 0;
    S.time = 0;
    faceEl.textContent = '🙂';
    setLed(ledMinesEl, S.mines);
    renderTime();

    boardEl.style.gridTemplateColumns = 'repeat(' + S.cols + ', ' + S.size + 'px)';
    boardEl.innerHTML = '';
    S.el = new Array(total);

    var frag = document.createDocumentFragment();
    for (var r = 0; r < S.rows; r++) {
      for (var c = 0; c < S.cols; c++) {
        var cell = document.createElement('div');
        cell.className = 'cell';
        cell.style.width = cell.style.height = S.size + 'px';
        cell.style.fontSize = Math.round(S.size * 0.56) + 'px';
        cell.dataset.i = idx(r, c);
        frag.appendChild(cell);
        S.el[idx(r, c)] = cell;
      }
    }
    boardEl.appendChild(frag);

    $$('#levels button').forEach(function (b) {
      b.classList.toggle('on', b.dataset.level === S.level);
    });
    msgEl.textContent = '点第一下绝不会踩雷，放心点。';
  }

  function startGame(level) {
    if (level && LEVELS[level]) {
      S.level = level;
      S.cols = LEVELS[level].cols;
      S.rows = LEVELS[level].rows;
      S.mines = LEVELS[level].mines;
      S.size = LEVELS[level].size;
    }
    build();
  }

  function bumpFlags(delta) {
    S.flags += delta;
    setLed(ledMinesEl, S.mines - S.flags);
  }

  function neighbors(i) {
    var out = [];
    var r = Math.floor(i / S.cols), c = i % S.cols;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        var nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= S.rows || nc < 0 || nc >= S.cols) continue;
        out.push(nr * S.cols + nc);
      }
    }
    return out;
  }

  function revealCell(i) {
    if (S.state[i] === 1) return;
    S.state[i] = 1;
    S.el[i].classList.add('revealed');
    S.revealed++;
    if (S.num[i] > 0) {
      S.el[i].textContent = S.num[i];
      S.el[i].classList.add('n' + S.num[i]);
    }
    if (S.revealed === S.cols * S.rows - S.mines) checkWin();
  }

  function reveal(i) {
    S.state[i] = 1;
    S.el[i].classList.add('revealed');
    S.revealed++;
    if (S.num[i] > 0) {
      S.el[i].textContent = S.num[i];
      S.el[i].classList.add('n' + S.num[i]);
    } else {
      // 空白格：用显式栈做泛洪展开，避免递归爆栈
      var stack = [i], pushed = {};
      pushed[i] = 1;
      while (stack.length) {
        var cur = stack.pop();
        var nb = neighbors(cur);
        for (var k = 0; k < nb.length; k++) {
          var j = nb[k];
          if (S.state[j] === 1 || pushed[j]) continue;
          pushed[j] = 1;
          if (S.state[j] === 2) { // 误插的旗子被空白区推翻
            S.state[j] = 0;
            S.el[j].classList.remove('flag');
            S.el[j].textContent = '';
            bumpFlags(-1);
          }
          S.state[j] = 1;
          S.el[j].classList.add('revealed');
          S.revealed++;
          if (S.num[j] > 0) {
            S.el[j].textContent = S.num[j];
            S.el[j].classList.add('n' + S.num[j]);
          } else {
            stack.push(j);
          }
        }
      }
    }
    if (S.revealed === S.cols * S.rows - S.mines) checkWin();
  }

  function boom(i) {
    for (var p = 0; p < S.state.length; p++) {
      if (S.mine[p] && S.state[p] === 2) S.el[p].classList.remove('flag');
      if (S.mine[p] && S.state[p] !== 1) {
        S.state[p] = 1;
        S.el[p].classList.add('revealed', 'mine');
        S.el[p].textContent = '💣';
      }
    }
    S.el[i].classList.add('boom');
    S.el[i].textContent = '💥';
    S.el[i].classList.remove('mine');
    for (var q = 0; q < S.state.length; q++) {
      if (S.state[q] === 2 && !S.mine[q]) {
        S.el[q].textContent = '❌';
        S.el[q].classList.add('revealed', 'err');
      }
    }
  }

  function checkWin() {
    S.finished = true;
    stopTimer();
    for (var p = 0; p < S.state.length; p++) {
      if (S.mine[p] && S.state[p] !== 2) {
        S.state[p] = 2;
        S.el[p].textContent = '🚩';
        S.el[p].classList.add('flag');
      }
    }
    S.flags = S.mines;
    setLed(ledMinesEl, 0);
    faceEl.textContent = '😎';
    msgEl.textContent = '🎉 通关！用时 ' + S.time + ' 秒。按 R 或点笑脸再来一局。';
  }

  function lose(i) {
    S.finished = true;
    stopTimer();
    boom(i);
    faceEl.textContent = '😵';
    msgEl.textContent = '💥 踩雷了……按 R 或点笑脸重来。';
  }

  // 空格键：把周围雷数已全部插旗的格子一键翻开
  function chord(i) {
    if (S.state[i] !== 1 || S.num[i] <= 0) return;
    var nb = neighbors(i), flags = 0, k;
    for (k = 0; k < nb.length; k++) if (S.state[nb[k]] === 2) flags++;
    if (flags !== S.num[i]) return;
    for (k = 0; k < nb.length; k++) {
      var j = nb[k];
      if (S.state[j] !== 0) continue;
      if (S.mine[j]) { lose(j); return; }
      reveal(j);
      if (S.finished) return;
    }
  }

  function handleClick(i) {
    if (S.finished) return;
    if (S.suppressClick) { S.suppressClick = false; return; }
    if (S.state[i] === 1) { chord(i); return; }
    if (S.state[i] === 2) return;
    if (S.first) {
      S.first = false;
      placeMines(i);
      startTimer();
      msgEl.textContent = '';
    }
    if (S.mine[i]) { lose(i); return; }
    reveal(i);
    if (!S.finished) faceEl.textContent = '🙂';
  }

  function toggleFlag(i) {
    if (S.finished || S.state[i] === 1) return;
    if (S.state[i] === 2) {
      S.state[i] = 0;
      S.el[i].textContent = '';
      S.el[i].classList.remove('flag');
      bumpFlags(-1);
      return;
    }
    if (S.flags >= S.mines) return;
    S.state[i] = 2;
    S.el[i].textContent = '🚩';
    S.el[i].classList.add('flag');
    bumpFlags(1);
  }

  function clearPressed() {
    if (!S.el) return;
    for (var i = 0; i < S.el.length; i++) S.el[i].classList.remove('pressed');
  }

  boardEl.addEventListener('mousedown', function (e) {
    var i = cellIndex(e.target);
    if (i < 0 || S.finished) return;
    e.preventDefault();
    if (e.button === 0 && S.state[i] !== 1) S.el[i].classList.add('pressed');
  });

  document.addEventListener('mouseup', clearPressed);

  boardEl.addEventListener('click', function (e) {
    var i = cellIndex(e.target);
    if (i < 0) return;
    e.preventDefault();
    handleClick(i);
  });

  boardEl.addEventListener('contextmenu', function (e) {
    e.preventDefault();
    var i = cellIndex(e.target);
    if (i >= 0) toggleFlag(i);
  });

  // 触屏：轻触翻开，长按约 0.3 秒插旗
  boardEl.addEventListener('touchstart', function (e) {
    var t = e.target;
    var i = cellIndex(t);
    if (i < 0 || S.finished) return;
    clearTimeout(S.pressTimer);
    S.pressTimer = setTimeout(function () {
      S.suppressClick = true;
      toggleFlag(i);
      if (navigator.vibrate) navigator.vibrate(25);
    }, 300);
  }, { passive: true });

  boardEl.addEventListener('touchend', function (e) {
    clearTimeout(S.pressTimer);
    if (S.suppressClick) e.preventDefault();
  });

  boardEl.addEventListener('touchmove', function () {
    clearTimeout(S.pressTimer);
    S.suppressClick = false;
  }, { passive: true });

  function cellIndex(node) {
    if (!node || !node.dataset || node.dataset.i === undefined) return -1;
    return Number(node.dataset.i);
  }

  faceEl.addEventListener('click', function () { startGame(); });

  levelsEl.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('button[data-level]') : null;
    if (btn) startGame(btn.dataset.level);
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'r' || e.key === 'R') { startGame(); return; }
    if (e.key === '1') { startGame('beginner'); return; }
    if (e.key === '2') { startGame('intermediate'); return; }
    if (e.key === '3') { startGame('expert'); return; }
    if (e.key === ' ' || e.key === 'Spacebar') {
      e.preventDefault();
      if (S.finished) return;
      for (var i = 0; i < S.state.length; i++) {
        if (S.state[i] === 1) { chord(i); if (S.finished) return; }
      }
    }
  });

  startGame('beginner');
})();
</script>

<script>
  // 深浅色切换：选择写进 localStorage 的 theme（和主页共用同一个键），刷新后记得住
  (function () {
    var themeToggle = document.getElementById('themeToggle');
    var themeColorMeta = document.getElementById('themeColor');
    function applyTheme(theme, persist) {
      document.documentElement.setAttribute('data-theme', theme);
      if (themeColorMeta) themeColorMeta.setAttribute('content', theme === 'dark' ? '#0b1220' : '#e9f1f8');
      if (persist) { try { localStorage.setItem('theme', theme); } catch (e) {} }
    }
    applyTheme(document.documentElement.getAttribute('data-theme') || 'light', false);
    if (themeToggle) themeToggle.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      applyTheme(next, true);
    });
  })();
</script>
</body>
</html>
