/* ---------------- 12.7.3 通用小工具 ---------------- */

/** 圆柱（r 可上下不同），默认沿 Y 轴 */
function cyl(parent, mat, r0, r1, h, x, y, z, seg = 12) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r0, r1, h, seg), mat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
}

/**
 * 沿折线铺一条贴地条带（碎石路 / 车辙 / 拖曳痕）。
 * 逐点按地形高度抬起来，所以不会插进沙丘里。
 */
function makeRibbonMesh(points, halfW, mat, lift) {
  const pos = [], uv = [], idx = [];
  let run = 0;
  for (let i = 0; i < points.length; i++) {
    const a = points[Math.max(0, i - 1)];
    const b = points[Math.min(points.length - 1, i + 1)];
    let dx = b[0] - a[0], dz = b[1] - a[1];
    const L = Math.hypot(dx, dz) || 1;
    dx /= L; dz /= L;
    const nx = -dz, nz = dx;
    for (let s = 0; s < 2; s++) {
      const sign = s === 0 ? -1 : 1;
      const x = points[i][0] + nx * halfW * sign;
      const z = points[i][1] + nz * halfW * sign;
      pos.push(x, terrainHeight(x, z) + lift, z);
      uv.push(s, run * 0.22);
    }
    if (i > 0) {
      const v0 = (i - 1) * 2, v1 = v0 + 1, v2 = i * 2, v3 = v2 + 1;
      idx.push(v0, v2, v3, v0, v3, v1);
    }
    const nx2 = points[Math.min(points.length - 1, i + 1)];
    run += Math.hypot(nx2[0] - points[i][0], nx2[1] - points[i][1]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, mat);
  m.receiveShadow = true;
  return m;
}

/** 用四个角点拼一块布（帐篷坡面用，绕序/UV 都写死，不会歪） */
function clothQuad(ridgeBack, eaveBack, eaveFront, ridgeFront) {
  const pos = [], uv = [], idx = [];
  const pts = [ridgeBack, eaveBack, eaveFront, ridgeFront];
  for (let i = 0; i < 4; i++) {
    pos.push(pts[i][0], pts[i][1], pts[i][2]);
    uv.push(i === 0 || i === 3 ? 0 : 1, i < 2 ? 0 : 1);
  }
  idx.push(0, 1, 2, 0, 2, 3);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* ---------------- 12.7.4 野战火炮 ---------------- */

/**
 * 一门野战炮（Pak / 25 磅炮风格）：
 * 防盾 + 炮管 + 大架 + 驻锄 + 两个大轮 + 瞄准具 + 弹药箱
 * 炮口朝 +Z（朝海）。
 */
function createFieldGun(site) {
  const g = new THREE.Group();
  const y0 = terrainHeight(site.x, site.z);
  g.position.set(site.x, y0, site.z);
  g.rotation.y = site.yaw;

  const steel = LM.gunSteel;
  const olive = LM.olive;

  // ---- 大架（两条向后张开的大梁）----
  for (const s of [-1, 1]) {
    const leg = bx(g, olive, 0.17, 0.14, 2.5, s * 0.34, 0.62, -1.42);
    leg.rotation.y = s * 0.10;
    leg.rotation.x = -0.10;
  }
  bx(g, olive, 1.10, 0.13, 0.16, 0, 0.48, -2.56);
  for (const s of [-1, 1]) {
    const spade = bx(g, steel, 0.46, 0.42, 0.09, s * 0.44, 0.30, -2.66);
    spade.rotation.x = 0.34;
  }

  // ---- 炮架立柱 / 摇架 ----
  bx(g, olive, 0.72, 0.30, 0.86, 0, 0.86, 0.18);
  bx(g, steel, 0.34, 0.26, 1.20, 0, 1.06, 0.60);

  // ---- 炮管 ----
  const barrel = cyl(g, steel, 0.078, 0.098, 2.75, 0, 1.12, 1.55, 14);
  barrel.rotation.x = Math.PI / 2;
  const muzz = cyl(g, steel, 0.105, 0.105, 0.30, 0, 1.12, 2.96, 14);
  muzz.rotation.x = Math.PI / 2;
  bx(g, steel, 0.30, 0.30, 0.42, 0, 1.12, 0.02);      // 炮尾

  // ---- 防盾 ----
  for (const s of [-1, 1]) {
    const plate = bx(g, olive, 1.24, 0.96, 0.07, s * 0.60, 1.16, 0.52);
    plate.rotation.y = s * -0.20;
    plate.rotation.z = s * -0.06;
  }
  bx(g, olive, 0.68, 0.52, 0.07, 0, 1.52, 0.40);
  for (const yy of [0.82, 1.16, 1.50]) bx(g, steel, 2.28, 0.05, 0.10, 0, yy, 0.60);

  // ---- 轮子（胎 + 轮毂 + 6 根辐条）----
  for (const s of [-1, 1]) {
    const wheel = new THREE.Group();
    wheel.position.set(s * 0.92, 0.62, 0.10);
    const tyre = new THREE.Mesh(new THREE.TorusGeometry(0.60, 0.15, 8, 18), LM.rubber);
    tyre.rotation.y = Math.PI / 2;
    wheel.add(tyre);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.20, 10), steel);
    hub.rotation.z = Math.PI / 2;
    wheel.add(hub);
    for (let k = 0; k < 6; k++) {
      const a = (k / 6) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.50, 0.05), steel);
      spoke.position.set(0, Math.cos(a) * 0.30, Math.sin(a) * 0.30);
      spoke.rotation.x = -a;
      wheel.add(spoke);
    }
    g.add(wheel);
  }

  // ---- 瞄准具 + 手轮 ----
  bx(g, steel, 0.14, 0.30, 0.16, 0.52, 1.62, -0.10);
  const sight = cyl(g, steel, 0.05, 0.05, 0.26, 0.52, 1.82, -0.10, 8);
  sight.rotation.z = 0.2;
  const handwheel = new THREE.Mesh(new THREE.TorusGeometry(0.16, 0.035, 6, 12), steel);
  handwheel.position.set(-0.62, 1.02, -0.10);
  handwheel.rotation.y = Math.PI / 2;
  g.add(handwheel);

  // ---- 炮位旁的弹箱 ----
  for (let i = 0; i < 3; i++) {
    const box = bx(g, RM.crate, 0.52, 0.30, 0.36, -1.55 + i * 0.10, 0.16, -0.90 + i * 0.55);
    box.rotation.y = 0.12 * i;
  }

  // ---- 伪装网支架（第二门炮）----
  if (site.net) {
    for (const s of [-1, 1]) {
      const pole = cyl(g, LM.rust, 0.05, 0.05, 2.3, s * 2.0, 1.15, -0.4, 6);
      pole.rotation.z = s * 0.10;
    }
    // 伪装网：拉在两根杆之间，中间下垂一点，边缘用绳拉住
    const net = new THREE.Mesh(new THREE.PlaneGeometry(5.0, 4.2, 8, 7), MAT.camo);
    const np = net.geometry.attributes.position;
    for (let i = 0; i < np.count; i++) {
      const nx = np.getX(i), ny = np.getY(i);
      const drop = (1 - Math.cos(nx * 0.62)) * (1 - Math.cos(ny * 0.72)) * 0.9;
      np.setZ(i, -drop);
    }
    np.needsUpdate = true;
    net.geometry.computeVertexNormals();
    net.rotation.x = -Math.PI / 2;
    net.position.set(0, 2.02, -0.35);
    net.material.side = THREE.DoubleSide;
    g.add(net);
    // 四角拉绳
    for (const sx of [-1, 1]) {
      for (const sz of [-1, 1]) {
        const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 2.0, 4), LM.woodDark);
        rope.position.set(sx * 2.2, 1.35, -0.35 + sz * 1.9);
        rope.rotation.z = sx * 0.5;
        rope.rotation.x = sz * 0.35;
        g.add(rope);
      }
    }
  }

  g.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  return g;
}

/** 炮位沙袋围护（U 形，三层）+ 拖曳痕迹 */
function createGunEmplacement(site, index, bagGeo, dummy) {
  const g = new THREE.Group();
  const x0 = site.x, z0 = site.z;
  const pts = [];
  const R = 6.2;
  for (let i = 0; i < 22; i++) {
    const a = Math.PI * 0.86 + (i / 21) * Math.PI * 1.28;
    pts.push([x0 + Math.cos(a) * R, z0 + Math.sin(a) * R * 0.82]);
  }
  const rnd = mulberry32(6100 + index);
  const bags = new THREE.InstancedMesh(bagGeo, MAT.sandbag, pts.length * 3);
  bags.castShadow = true;
  bags.receiveShadow = true;
  let k = 0;
  for (let layer = 0; layer < 3; layer++) {
    for (let i = 0; i < pts.length; i++) {
      const p = pts[(i + layer) % pts.length];
      const h = terrainHeight(p[0], p[1]);
      dummy.position.set(p[0] + (rnd() - 0.5) * 0.12, h + 0.16 + layer * 0.30, p[1] + (rnd() - 0.5) * 0.12);
      dummy.rotation.set((rnd() - 0.5) * 0.12, rnd() * Math.PI, (rnd() - 0.5) * 0.08);
      dummy.scale.set(0.96, 0.96, 0.96);
      dummy.updateMatrix();
      bags.setMatrixAt(k++, dummy.matrix);
    }
  }
  bags.instanceMatrix.needsUpdate = true;
  bags.frustumCulled = false;
  g.add(bags);

  // 拖曳痕迹：两条压进沙里的暗痕
  for (const s of [-1, 1]) {
    g.add(makeRibbonMesh([
      [x0 + s * 0.95, z0 + 10], [x0 + s * 1.05, z0 + 3],
      [x0 + s * 1.00, z0 - 2], [x0 + s * 0.90, z0 - 7]
    ], 0.26, RM.rut, 0.035));
  }
  return g;
}

/* ---------------- 12.7.5 补给营地 ---------------- */

/** 帐篷：两坡帆布 + 山脊杆 + 拉绳 + 地钉，+Z 端开门 */
function createTent(site) {
  const g = new THREE.Group();
  const y0 = terrainHeight(site.x, site.z);
  g.position.set(site.x, y0, site.z);
  g.rotation.y = site.yaw;

  const W = site.w, L = site.len, H = 1.95;
  const hw = W / 2;

  // 两坡帆布：直接给四个角点，不用旋转拼
  for (const s of [-1, 1]) {
    const geo = clothQuad(
      [0, H, -L / 2], [s * hw, 0.02, -L / 2],
      [s * hw, 0.02, L / 2], [0, H, L / 2]
    );
    const m = new THREE.Mesh(geo, RM.canvas);
    g.add(m);
  }

  // 后头封板（三角）
  const shape = new THREE.Shape();
  shape.moveTo(-hw, 0); shape.lineTo(hw, 0); shape.lineTo(0, H); shape.lineTo(-hw, 0);
  const back = new THREE.Mesh(new THREE.ShapeGeometry(shape), RM.canvas);
  back.position.set(0, 0.02, -L / 2);
  g.add(back);

  // 门帘（挂在 +Z 端一侧，露出半截开口）
  const flap = new THREE.Mesh(new THREE.PlaneGeometry(hw * 0.94, H * 0.9), RM.canvas);
  flap.position.set(hw * 0.44, H * 0.46, L / 2 - 0.02);
  flap.rotation.y = 0.14;
  g.add(flap);

  // 山脊杆 + 两端立柱
  const ridge = cyl(g, LM.wood, 0.045, 0.045, L + 0.4, 0, H, 0, 6);
  ridge.rotation.x = Math.PI / 2;
  for (const end of [-1, 1]) cyl(g, LM.wood, 0.045, 0.045, H, 0, H * 0.5, end * (L * 0.5 - 0.1), 6);

  // 拉绳 + 地钉
  for (const s of [-1, 1]) {
    for (const end of [-1, 1]) {
      const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 2.6, 4), LM.woodDark);
      rope.position.set(s * hw * 1.72, 0.42, end * L * 0.46);
      rope.rotation.z = s * 1.16;
      rope.rotation.x = end * 0.10;
      g.add(rope);
      const peg = cyl(g, LM.woodDark, 0.03, 0.03, 0.34, s * hw * 2.75, 0.1, end * L * 0.48, 5);
      peg.rotation.z = s * 0.18;
    }
  }

  // 帐篷内部灯（夜里点亮，从门缝和布面透出来）
  registerLamp(site.x, y0 + 1.35, site.z, 0xffb46a, 13.0, 9.5, true);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.085, 8, 6), RM.bulb);
  bulb.position.set(0, H - 0.28, 0);
  g.add(bulb);

  g.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  return g;
}

/** 木箱堆 + 油桶堆 + 弹药箱（重复物件全部 InstancedMesh） */
function createSupplyProps(parent) {
  const rnd = mulberry32(3377);

  const crateGeo = boxGeo(0.66, 0.44, 0.46, 0.5);
  const crateCount = 46;
  const crates = new THREE.InstancedMesh(crateGeo, RM.crate, crateCount);
  crates.castShadow = true; crates.receiveShadow = true;

  const barrelGeo = new THREE.CylinderGeometry(0.29, 0.29, 0.88, 12);
  const barrelCount = 26;
  const barrels = new THREE.InstancedMesh(barrelGeo, RM.barrel, barrelCount);
  barrels.castShadow = true; barrels.receiveShadow = true;

  const dummy = new THREE.Object3D();
  const clusters = [[19.5, -72.5], [22.0, -74.0], [12.5, -73.5], [27.5, -72.0], [17.0, -76.5]];
  let ci = 0;
  for (const c of clusters) {
    const rows = 2 + Math.floor(rnd() * 2), cols = 2 + Math.floor(rnd() * 2), layers = 1 + Math.floor(rnd() * 3);
    for (let ly = 0; ly < layers; ly++) {
      for (let r = 0; r < rows; r++) {
        for (let cc = 0; cc < cols; cc++) {
          if (ci >= crateCount) break;
          const x = c[0] + (cc - cols / 2) * 0.70 + (rnd() - 0.5) * 0.08;
          const z = c[1] + (r - rows / 2) * 0.52 + (rnd() - 0.5) * 0.08;
          dummy.position.set(x, terrainHeight(x, z) + 0.22 + ly * 0.455, z);
          dummy.rotation.set(0, (rnd() - 0.5) * 0.24, 0);
          dummy.scale.set(1, 1, 1);
          dummy.updateMatrix();
          crates.setMatrixAt(ci++, dummy.matrix);
        }
      }
    }
  }
  crates.count = ci;
  crates.instanceMatrix.needsUpdate = true;
  crates.frustumCulled = false;
  parent.add(crates);

  let bi = 0;
  const barrelSpots = [[27.0, -74.5], [28.2, -75.6], [26.0, -76.4], [11.0, -76.0], [9.8, -75.0]];
  for (const s of barrelSpots) {
    const n = 3 + Math.floor(rnd() * 3);
    for (let i = 0; i < n && bi < barrelCount; i++) {
      const lying = rnd() > 0.78;
      const x = s[0] + (rnd() - 0.5) * 1.5;
      const z = s[1] + (rnd() - 0.5) * 1.5;
      dummy.position.set(x, terrainHeight(x, z) + (lying ? 0.30 : 0.45), z);
      dummy.rotation.set(lying ? Math.PI / 2 : 0, rnd() * Math.PI, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      barrels.setMatrixAt(bi++, dummy.matrix);
    }
  }
  barrels.count = bi;
  barrels.instanceMatrix.needsUpdate = true;
  barrels.frustumCulled = false;
  parent.add(barrels);

  // 弹药堆 + 散落弹壳
  for (let i = 0; i < 9; i++) {
    const x = 13.0 + (rnd() - 0.5) * 3.6, z = -70.0 + (rnd() - 0.5) * 2.6;
    const box = bx(parent, LM.oliveDark, 0.84, 0.30, 0.34, x,
      terrainHeight(x, z) + 0.15 + (i % 3) * 0.31, z);
    box.rotation.y = (rnd() - 0.5) * 0.4;
  }
  for (let i = 0; i < 14; i++) {
    const x = 14.6 + (rnd() - 0.5) * 4.0, z = -68.2 + (rnd() - 0.5) * 2.2;
    const sh = cyl(parent, LM.gunSteel, 0.035, 0.04, 0.26, x, terrainHeight(x, z) + 0.05, z, 6);
    sh.rotation.z = Math.PI / 2;
    sh.rotation.y = rnd() * Math.PI;
  }

  return { crates, barrels };
}

/** 碎石小路 + 车辙 */
function createSupplyRoad() {
  const g = new THREE.Group();
  g.add(makeRibbonMesh(REAR.road, 2.05, RM.gravel, 0.05));

  for (const s of [-1, 1]) {
    const pts = REAR.road.map((p, i) => {
      const a = REAR.road[Math.max(0, i - 1)], b = REAR.road[Math.min(REAR.road.length - 1, i + 1)];
      let dx = b[0] - a[0], dz = b[1] - a[1];
      const L = Math.hypot(dx, dz) || 1;
      return [p[0] + (-dz / L) * s * 0.62, p[1] + (dx / L) * s * 0.62];
    });
    g.add(makeRibbonMesh(pts, 0.20, RM.rut, 0.075));
  }
  return g;
}

/** 后勤卡车（GMC 风格，形体简化）*/
function createTruck(site) {
  const g = new THREE.Group();
  const y0 = terrainHeight(site.x, site.z);
  g.position.set(site.x, y0, site.z);
  g.rotation.y = site.yaw;

  const olive = LM.olive, dark = LM.oliveDark;

  bx(g, dark, 2.10, 0.24, 5.60, 0, 0.66, 0);
  bx(g, olive, 2.00, 1.30, 1.70, 0, 1.42, 1.85);      // 驾驶室
  bx(g, olive, 1.92, 0.20, 1.74, 0, 2.10, 1.85);
  bx(g, olive, 1.80, 0.62, 1.10, 0, 1.06, 3.20);      // 引擎盖

  const glass = new THREE.Mesh(new THREE.PlaneGeometry(1.66, 0.66), new THREE.MeshStandardMaterial({
    color: 0x2f3a44, roughness: 0.25, metalness: 0.35
  }));
  glass.position.set(0, 1.72, 2.70);
  g.add(glass);

  bx(g, dark, 1.70, 0.36, 0.10, 0, 0.92, 3.76);       // 格栅
  for (const s of [-1, 1]) {
    const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.13, 8, 6), RM.lampFace);
    lamp.position.set(s * 0.66, 1.12, 3.78);
    g.add(lamp);
    bx(g, dark, 0.30, 0.06, 0.16, s * 0.66, 0.98, 3.80);
  }

  // 货箱 + 篷布
  bx(g, olive, 2.16, 0.14, 3.30, 0, 0.86, -1.05);
  for (const s of [-1, 1]) bx(g, olive, 0.12, 0.86, 3.30, s * 1.02, 1.30, -1.05);
  bx(g, olive, 2.16, 0.86, 0.12, 0, 1.30, -2.62);
  const tarp = new THREE.Mesh(
    new THREE.CylinderGeometry(1.06, 1.06, 3.34, 14, 1, false, 0, Math.PI),
    RM.canvas
  );
  tarp.rotation.z = Math.PI / 2;
  tarp.rotation.y = Math.PI / 2;
  tarp.position.set(0, 1.72, -1.05);
  g.add(tarp);

  // 6 个轮子
  const tyreGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.30, 14);
  const rimGeo = new THREE.CylinderGeometry(0.26, 0.26, 0.32, 10);
  for (const zz of [2.55, -0.50, -1.85]) {
    for (const s of [-1, 1]) {
      const w = new THREE.Mesh(tyreGeo, LM.rubber);
      w.rotation.z = Math.PI / 2;
      w.position.set(s * 1.06, 0.52, zz);
      g.add(w);
      const rim = new THREE.Mesh(rimGeo, LM.gunSteel);
      rim.rotation.z = Math.PI / 2;
      rim.position.set(s * 1.06, 0.52, zz);
      g.add(rim);
    }
  }

  // 车灯（夜里两盏暖光）
  registerLamp(
    site.x + Math.sin(site.yaw) * 3.9, y0 + 1.15, site.z + Math.cos(site.yaw) * 3.9,
    0xffd7a0, 9.0, 11, true
  );

  g.traverse((o) => {
    if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
  });
  return g;
}

/** 营地灯：三脚杆 + 灯罩 + 灯泡 */
function createCampLamp(x, z, color, intensity, dist) {

    leg.rotation.z = -Math.cos(a) * 0.16;
    leg.rotation.x = Math.sin(a) * 0.16;
  }
  cyl(g, LM.rust, 0.035, 0.035, 0.6, 0, 2.7, 0, 6);
  cyl(g, LM.rust, 0.16, 0.30, 0.26, 0, 3.02, 0, 12);

/**
 * 探照灯：塔架 + 灯头 + 可见光锥，夜里缓慢左右扫动。
 * 光锥是加色混合的半透明锥体，不额外占用点光源名额。
 */
function createSearchlight(x, z) {
  const g = new THREE.Group();
  const y0 = terrainHeight(x, z);
  g.position.set(x, y0, z);

  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
    const leg = cyl(g, LM.rust, 0.05, 0.05, 4.2, Math.cos(a) * 0.95, 2.1, Math.sin(a) * 0.95, 5);
    leg.rotation.z = -Math.cos(a) * 0.16;
    leg.rotation.x = Math.sin(a) * 0.16;
  }
  for (const yy of [1.6, 3.0]) bx(g, LM.rust, 2.0, 0.07, 0.07, 0, yy, 0);
  cyl(g, LM.rust, 0.09, 0.09, 0.7, 0, 3.95, 0, 6);

  const yoke = new THREE.Group();
  yoke.position.set(0, 4.30, 0);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.52, 0.055, 6, 14), LM.rust);
  ring.rotation.y = Math.PI / 2;
  yoke.add(ring);

  const head = new THREE.Group();
  const shell = cyl(head, LM.rust, 0.46, 0.42, 0.85, 0, 0, 0, 16);
  shell.rotation.x = Math.PI / 2;
  const face = cyl(head, RM.lampFace, 0.44, 0.44, 0.06, 0, 0, 0.44, 16);
  face.rotation.x = Math.PI / 2;
  yoke.add(head);
  g.add(yoke);

  const beamGeo = new THREE.ConeGeometry(7.0, 44, 18, 1, true);
  const beamMat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    uniforms: { uNight: { value: 0 }, uColor: { value: new THREE.Color(0xa8c6ff) } },
    vertexShader: `
      varying vec2 vUvB;
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        vUvB = uv;
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vN = normalize(mat3(modelMatrix) * normal);
        vV = normalize(cameraPosition - wp.xyz);
        gl_Position = projectionMatrix * viewMatrix * wp;
      }`,
    fragmentShader: `
      uniform float uNight;
      uniform vec3 uColor;
      varying vec2 vUvB;
      varying vec3 vN;
      varying vec3 vV;
      void main() {
        // vUv.y：0 = 锥底（远处），1 = 锥尖（灯口）→ 越靠灯口越亮
        float along = smoothstep(0.0, 0.62, vUvB.y) * (1.0 - smoothstep(0.94, 1.0, vUvB.y));
        // 壳法线与视线越垂直 = 越靠光柱中心 → 亮；边缘衰减
        float edge = pow(clamp(1.0 - abs(dot(normalize(vN), normalize(vV))), 0.0, 1.0), 1.6);
        gl_FragColor = vec4(uColor, along * edge * 0.30 * uNight);
      }`
  });
  // 光锥：锥尖必须落在灯口（z=0），锥底朝前伸出去。
  // ConeGeometry 的尖在 +Y，绕 X 转 -90° 后 +Y → -Z，再整体前移 22m，
  // 于是锥尖回到灯口、锥底落在 z = +44（44m 长光束）。
  const beam = new THREE.Mesh(beamGeo, beamMat);
  beam.rotation.x = -Math.PI / 2;
  beam.position.set(0, 0, 22.0);
  beam.renderOrder = 3;
  head.add(beam);

  yoke.rotation.x = -0.28;

  state.updaters.push((dt, t) => {
    yoke.rotation.y = Math.sin(t * 0.22) * 0.75;
    beamMat.uniforms.uNight.value = state.time.current;
  });

  return g;
}

    color: 0x8f9464, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide
  });
  const tufts = new THREE.InstancedMesh(tuftGeo, tuftMat, tuftCount);
  let ti = 0;
  for (let i = 0; i < tuftCount * 4 && ti < tuftCount; i++) {
    const x = -62 + rnd() * 104, z = -88 + rnd() * 38;
    const h = terrainHeight(x, z);
    const masks = terrainMasks(x, z, h);
    if (masks.grass < 0.3) continue;
    dummy.position.set(x, h, z);
    dummy.rotation.set(0, rnd() * Math.PI, 0);
    const s = 0.7 + rnd() * 0.7;
    dummy.scale.set(s, s * (0.8 + rnd() * 0.5), s);
    dummy.updateMatrix();
    tufts.setMatrixAt(ti++, dummy.matrix);
  }
  tufts.count = ti;
  tufts.instanceMatrix.needsUpdate = true;
  tufts.frustumCulled = false;
  root.add(tufts);

  // 夜里需要点亮的材质（由 applyTimeOfDay 统一驱动 emissive）
  state.nightGlowMats = state.nightGlowMats || [];
  state.nightGlowMats.push(RM.canvas, RM.bulb, RM.lampFace);

  state.rear = { guns, tents, truck, supply, searchlight, group: root };
  return root;
}


/* =========================================================================
 * 13. 相机系统 —— SingleCameraRig（全场唯一相机 + 统一控制）
 *
 *  设计要点
 *  ---------------------------------------------------------------------
 *  · 全程只有一台 PerspectiveCamera，所有机位共用同一个 rig 实例；
 *  · 相机的朝向永远由 rig 自己维护的 yaw / pitch 组合成四元数，
 *    不使用 lookAt，也没有用 PointerLockControls；
 *  · 预设机位的新语义：只负责「把镜头平滑搬运到起始位置与朝向」，
 *    落地后立刻把控制权交还用户 —— 没有哪个视角是锁死的；
 *  · 所有运动都由 deltaTime 驱动，帧率无关。
 * ========================================================================= */

/* -------------------------------------------------------------------------
 * 13.0 地面高度查询
 * 地下坑道是"空腔"：这些位置的最低允许高度按坑道底板算，
 * 否则在洞里一按 W 就会被地面约束顶回地表。
 * ----------------------------------------------------------------------- */
function tunnelFloorAt(x, z) {
  const path = DEF.tunnelPath;
  const half = DEF.tunnelW * 0.5 + 0.4;
  for (let i = 0; i < path.length - 1; i++) {
    const ax = path[i][0], az = path[i][1];
    const bx = path[i + 1][0], bz = path[i + 1][1];
    const vx = bx - ax, vz = bz - az;
    const L2 = vx * vx + vz * vz || 1;
    let t = ((x - ax) * vx + (z - az) * vz) / L2;
    t = clamp(t, 0, 1);
    const px = ax + vx * t, pz = az + vz * t;
    if (Math.hypot(x - px, z - pz) <= half) {
      return terrainBase(x, z) - DEF.tunnelDepth;
    }
  }
  return null;
}

/** 相机允许的最低"地面"：正常情况下是地表，坑道范围内是坑道底板 */
function groundHeightAt(x, z) {
  const surface = terrainHeight(x, z);
  const floor = tunnelFloorAt(x, z);
  return floor === null ? surface : Math.min(surface, floor);
}

/**
 * 该点允许的最低相机高度。
 * 洞外：max(全局最低 1.5m, 地表 + 净空)；
 * 坑道内：按洞底算 —— 坑道底板本身就低于地台最低高度，
 *         若仍套全局 1.5m 会把洞里机位顶到拱顶之上（等于钻进土里）。
 */
function minCameraY(x, z) {
  const B = RIG.BOUNDS;
  const floor = tunnelFloorAt(x, z);
  if (floor !== null) return floor + B.clearance;
  return Math.max(B.minY, terrainHeight(x, z) + B.clearance);
}

/* -------------------------------------------------------------------------
 * 13.1 控制器参数（集中放在这里，方便调）
 * ----------------------------------------------------------------------- */
const RIG = {
  /* ---------------- 飞行模式（fly）---------------- */
  SENSITIVITY: 0.0022,                  // 鼠标灵敏度（rad / px）
  PITCH_LIMIT: Math.PI / 2 - 0.0873,    // ±85°
  FOV_DEFAULT: 50,
  FOV_MIN: 15,
  FOV_MAX: 85,
  ZOOM_STEP: 4,                         // 滚轮每格改变多少度 FOV
  FOV_DAMP: 12,                         // FOV 目标值的逼近速度（越大越快）
  MOVE_SPEED: 8,                        // 基础平移速度 m/s
  SPRINT_MUL: 3,                        // Shift 加速倍率
  BOUNDS: {
    minX: -130, maxX: 130,
    minZ: -100, maxZ: 100,
    minY: 1.5, maxY: 120,
    clearance: 1.5                      // 离地最小净空
  },

  /* ---------------- 环绕模式（orbit）---------------- */
  ORBIT: {
    SENS_YAW: 0.005,                    // 水平拖拽灵敏度（rad / px）
    SENS_PITCH: 0.004,                  // 垂直拖拽灵敏度（rad / px）
    PITCH_MIN: 5 * Math.PI / 180,       // 5°
    PITCH_MAX: 88 * Math.PI / 180,      // 88°
    R_MIN: 12,                          // 最近 12m
    R_MAX: 320,                         // 最远 320m
    R_START: 180,                       // 「环绕视角」初始距离
    YAW_START: 0,
    PITCH_START: 32 * Math.PI / 180,    // 初始俯角 32°
    STEP_IN: 0.9,                       // 滚轮拉近系数
    STEP_OUT: 1.1,                      // 滚轮拉远系数
    DAMP: 0.15,                         // 每帧向目标值逼近的比例（60fps 基准）
    KEY_RATE: 1.2,                      // Q/E 缩放速度（相对每秒）
    MOVE_SPEED: 8,                      // 平移观察中心的基础速度 m/s
    CENTER_BOUNDS: { minX: -130, maxX: 130, minZ: -100, maxZ: 100 },
    NEAR_R: 40,                         // 小于这个距离开始抬高最低俯角
    NEAR_PITCH: 15 * Math.PI / 180      // 贴到中心（R→0）时允许的最低俯角 15°
  },

  TRANSITION: 1.4                       // 机位飞行时长（秒）
};

/* -------------------------------------------------------------------------
 * 13.2 SingleCameraRig
 * ----------------------------------------------------------------------- */
/** 最短弧角度差：把 to 折到 from 的 ±π 之内（用于重置时不要绕远路） */
function shortestDelta(from, to) {
  let d = (to - from) % (Math.PI * 2);
  if (d > Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}

/**
 * 环绕模式的最低俯角：R 越近，越要抬起头，否则相机贴着地皮看会很难受。
 * R >= NEAR_R 时就是常规的 5°；R → 0 时抬到 15°。
 */
function orbitPitchFloor(R) {
  const O = RIG.ORBIT;
  const k = 1 - clamp(R / O.NEAR_R, 0, 1);
  return O.PITCH_MIN + k * (O.NEAR_PITCH - O.PITCH_MIN);
}

class SingleCameraRig {
  /**
   * 全程只有一台相机、一份状态：
   *   mode      —— 'orbit' 环绕 / 'fly' 飞行
   *   position  —— 相机世界坐标（两种模式都写这一份）
   *   yaw/pitch —— 相机朝向（fly 直接用它；orbit 由中心反算后同步到这里）
   *   fov       —— 视野角（只有 fly 的滚轮会改）
   *   orbit     —— 环绕参数 { center, R, yaw, pitch } + 各自的目标值
   */
  constructor(camera, presets) {
    this.camera = camera;
    this.presets = presets;

    const O = RIG.ORBIT;

    this.mode = 'orbit';
    this.position = new THREE.Vector3(0, 0, 0);   // 唯一位置
    this.yaw = O.YAW_START + Math.PI;             // 朝向：先指向地图中心
    this.pitch = -O.PITCH_START;
    this.fov = RIG.FOV_DEFAULT;
    this.fovTarget = RIG.FOV_DEFAULT;

    // 环绕状态：实际值 + 目标值（拖拽/滚轮只改目标，每帧收敛 → 惯性收尾）
    this.orbit = {
      center: new THREE.Vector3(0, 0, 0),
      R: O.R_START,
      yaw: O.YAW_START,
      pitch: O.PITCH_START,
      tCenter: new THREE.Vector3(0, 0, 0),
      tR: O.R_START,
      tYaw: O.YAW_START,
      tPitch: O.PITCH_START
    };

    this.index = 0;
    this.transition = null;
    this.keys = new Set();
    this.dragging = false;
    this.lastX = 0;
    this.lastY = 0;
    this.onChange = null;        // 机位变化（UI 高亮）
    this.onModeChange = null;    // 模式变化（UI 操作提示）

    this._euler = new THREE.Euler(0, 0, 0, 'YXZ');
    this._tmpA = new THREE.Vector3();
    this._tmpB = new THREE.Vector3();
    this._tmpC = new THREE.Vector3();
  }

  /* ===================== 朝向 / 位置的基本换算 ===================== */

  /** fly：yaw + pitch → 相机四元数（three 相机默认看 -Z，所以 yaw 要 +π） */
  applyOrientation() {
    this._euler.set(this.pitch, this.yaw + Math.PI, 0, 'YXZ');
    this.camera.quaternion.setFromEuler(this._euler);
  }

  getForward(out) {
    const cp = Math.cos(this.pitch);
    const v = out || this._tmpA;
    return v.set(Math.sin(this.yaw) * cp, Math.sin(this.pitch), Math.cos(this.yaw) * cp);
  }

  setPoseFromLookAt(pos, target) {
    const dx = target.x - pos.x;
    const dy = target.y - pos.y;
    const dz = target.z - pos.z;
    const len = Math.hypot(dx, dy, dz) || 1;
    this.yaw = Math.atan2(dx, dz);
    this.pitch = Math.asin(clamp(dy / len, -1, 1));
  }

  yawFrom(pos, target) { return Math.atan2(target.x - pos.x, target.z - pos.z); }
  pitchFrom(pos, target) {
    const dx = target.x - pos.x, dy = target.y - pos.y, dz = target.z - pos.z;
    const len = Math.hypot(dx, dy, dz) || 1;
    return Math.asin(clamp(dy / len, -1, 1));
  }

  /** 由「相机位置 + 环绕中心」反算 orbit 的三个参数 */
  orbitFromPosition(pos, center) {
    const dx = pos.x - center.x;
    const dy = pos.y - center.y;
    const dz = pos.z - center.z;
    const R = Math.max(0.001, Math.hypot(dx, dy, dz));
    return {
      R,
      yaw: Math.atan2(dx, dz),
      pitch: clamp(Math.asin(clamp(dy / R, -1, 1)),
                   RIG.ORBIT.PITCH_MIN, RIG.ORBIT.PITCH_MAX)
    };
  }

  /**
   * orbit 模式每帧的核心：
   * 目标值 → 阻尼收敛 → 由 R/yaw/pitch/center 算出位置 → 写回唯一状态 → lookAt(中心)
   */
  applyOrbit(dt) {
    const o = this.orbit;
    const O = RIG.ORBIT;
    const d = Math.max(dt, 1e-4);

    // 1) 收敛：把「每帧 0.15」折算成与帧率无关的指数逼近
    const k = 1 - Math.pow(1 - O.DAMP, d * 60);
    o.yaw = lerp(o.yaw, o.tYaw, k);
    o.pitch = lerp(o.pitch, o.tPitch, k);
    o.R = lerp(o.R, o.tR, k);
    o.center.lerp(o.tCenter, k);

    // 2) 球坐标 → 世界坐标，写回唯一的位置状态
    //    近距时把俯角抬到最低线以上（只影响这一帧的取位，不回写用户的目标值）
    const pitchEff = Math.max(o.pitch, orbitPitchFloor(o.R));
    const cp = Math.cos(pitchEff);
    this.position.set(
      o.center.x + o.R * cp * Math.sin(o.yaw),
      o.center.y + o.R * Math.sin(pitchEff),
      o.center.z + o.R * cp * Math.cos(o.yaw)
    );

    // 3) 应用到相机
    this.camera.position.copy(this.position);
    this.camera.up.set(0, 1, 0);
    this.camera.lookAt(o.center);

    // 4) 把朝向同步回通用状态，切到 fly 时能无缝接着走
    this.yaw = o.yaw + Math.PI;
    this.pitch = -o.pitch;
  }

  /** orbit：WASD 平移观察中心（Y 恒为 0），Q/E 拉远拉近 */
  moveOrbit(dt) {
    const o = this.orbit;
    const O = RIG.ORBIT;
    const k = this.keys;

    // ---- Q / E：缩放环绕距离 ----
    let rz = 0;
    if (k.has('KeyQ')) rz += 1;
    if (k.has('KeyE')) rz -= 1;
    if (rz !== 0) {
      const speed = O.KEY_RATE * (k.has('ShiftLeft') || k.has('ShiftRight') ? 2.4 : 1);
      o.tR = clamp(o.tR * Math.pow(Math.E, rz * speed * dt), O.R_MIN, O.R_MAX);
    }

    // ---- WASD：平移观察中心 ----
    let mx = 0, mz = 0;
    if (k.has('KeyW')) mz += 1;
    if (k.has('KeyS')) mz -= 1;
    if (k.has('KeyD')) mx += 1;
    if (k.has('KeyA')) mx -= 1;
    if (mx === 0 && mz === 0) return;

    const sprint = k.has('ShiftLeft') || k.has('ShiftRight');
    // 视野越远，平移越快，手感才跟得上
    const speed = O.MOVE_SPEED * clamp(o.R / 40, 1, 6) * (sprint ? RIG.SPRINT_MUL : 1);
    const step = speed * dt;

    const hlen = Math.hypot(mx, mz);
    mx /= hlen; mz /= hlen;

    // 以相机当前朝向为基准（centered 平移：W 把中心推远）
    const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    const rx = -Math.cos(this.yaw), rz2 = Math.sin(this.yaw);

    const C = O.CENTER_BOUNDS;
    o.tCenter.x = clamp(o.tCenter.x + (fx * mz + rx * mx) * step, C.minX, C.maxX);
    o.tCenter.z = clamp(o.tCenter.z + (fz * mz + rz2 * mx) * step, C.minZ, C.maxZ);
    o.tCenter.y = 0;
  }

  /* ===================== 机位切换 ===================== */

  selectPreset(index, instant = false) {
    const preset = this.presets[index];
    if (!preset) return;

    this.index = index;
    const toMode = preset.mode || 'fly';
    const start = resolvePresetStart(preset);
    const cam = this.camera;
    const O = RIG.ORBIT;

    // ---- 目标 orbit 参数（朝地图中心 (0,0,0)）----
    const tgt = preset.orbit || {};
    const orbitTo = {
      center: new THREE.Vector3(0, 0, 0),
      R: tgt.R !== undefined ? tgt.R : O.R_START,
      yaw: tgt.yaw !== undefined ? tgt.yaw : O.YAW_START,
      pitch: tgt.pitch !== undefined ? tgt.pitch : O.PITCH_START
    };

    // ---- 起点：一律用"相机此刻的真实位姿"，绝不回退到机位默认值 ----
    const fromMode = this.mode;
    const fromOrbit = fromMode === 'orbit'
      ? {
          center: this.orbit.center.clone(),
          R: this.orbit.R,
          yaw: this.orbit.yaw,
          pitch: this.orbit.pitch
        }
      : Object.assign({ center: new THREE.Vector3(0, 0, 0) },
                      this.orbitFromPosition(cam.position, new THREE.Vector3(0, 0, 0)));

    if (instant) {
      this.finishTransition(toMode, start, orbitTo);
      this.transition = null;
      this.applyMode(toMode);
      if (toMode === 'orbit') this.applyOrbit(0.016);
      else this.applyOrientation();
      if (this.onChange) this.onChange(index);
      return;
    }

    // ---- 构造过渡 ----
    const toYawFly = this.yawFrom(start.pos, start.target);
    let dYaw = (toYawFly - this.yaw) % (Math.PI * 2);
    if (dYaw > Math.PI) dYaw -= Math.PI * 2;
    if (dYaw < -Math.PI) dYaw += Math.PI * 2;

    // orbit 的 yaw 同样走最短弧
    let dOYaw = (orbitTo.yaw - fromOrbit.yaw) % (Math.PI * 2);
    if (dOYaw > Math.PI) dOYaw -= Math.PI * 2;
    if (dOYaw < -Math.PI) dOYaw += Math.PI * 2;

    const dist = cam.position.distanceTo(toMode === 'orbit'
      ? this._orbitToPos(orbitTo)
      : start.pos);

    this.transition = {
      t: 0,
      duration: RIG.TRANSITION,
      fromMode,
      toMode,
      // fly 侧
      fromPos: cam.position.clone(),
      toPos: start.pos.clone(),
      fromYaw: this.yaw,
      toYaw: this.yaw + dYaw,
      fromPitch: this.pitch,
      toPitch: this.pitchFrom(start.pos, start.target),
      fromFov: this.fov,
      toFov: preset.fov,
      // orbit 侧
      fromOrbit,
      toOrbit: {
        center: orbitTo.center.clone(),
        R: orbitTo.R,
        yaw: fromOrbit.yaw + dOYaw,
        pitch: orbitTo.pitch
      },
      lift: Math.min(14, dist * 0.06)
    };

    if (this.onChange) this.onChange(index);
  }

  /** orbit 参数对应的世界坐标（算飞行距离用） */
  _orbitToPos(o) {
    const cp = Math.cos(o.pitch);
    return this._tmpC.set(
      o.center.x + o.R * cp * Math.sin(o.yaw),
      o.center.y + o.R * Math.sin(o.pitch),
      o.center.z + o.R * cp * Math.cos(o.yaw)
    );
  }

  /** 过渡结束时把目标状态一次性落到唯一状态里 */
  finishTransition(toMode, start, orbitTo) {
    if (toMode === 'orbit') {
      const o = this.orbit;
      o.center.copy(orbitTo.center);
      o.R = orbitTo.R;
      o.yaw = orbitTo.yaw;
      o.pitch = orbitTo.pitch;
      o.tCenter.copy(orbitTo.center);
      o.tR = orbitTo.R;
      o.tYaw = orbitTo.yaw;
      o.tPitch = orbitTo.pitch;
      this.fov = this.fovTarget = RIG.FOV_DEFAULT;
      this.applyFov(this.fov);
    } else {
      this.camera.position.copy(start.pos);
      this.position.copy(start.pos);
      this.setPoseFromLookAt(start.pos, start.target);
    }
  }

  /** 切换模式并通知 UI 换提示文案 */
  applyMode(mode) {
    if (this.mode === mode) return;
    this.mode = mode;
    if (this.onModeChange) this.onModeChange(mode);
  }

  resetCurrent() {
    const preset = this.presets[this.index];
    if (!preset) return;
    if ((preset.mode || 'fly') === 'orbit') {
      // 环绕视角重置：R=180 / yaw=0 / pitch=32° / 中心回到原点
      const O = RIG.ORBIT;
      const o = this.orbit;
      o.tCenter.set(0, 0, 0);
      o.tR = O.R_START;
      // 用户可能已经绕了好几圈，重置时按最短弧回去，别倒着转好几圈
      o.tYaw = o.yaw + shortestDelta(o.yaw, O.YAW_START);
      o.tPitch = O.PITCH_START;
      this.applyMode('orbit');
      return;
    }
    this.selectPreset(this.index, false);
  }

  isTransitioning() { return this.transition !== null; }

  /* ===================== 每帧更新 ===================== */

  update(dt) {
    const cam = this.camera;

    // ---- 1) 机位过渡 ----
    if (this.transition) {
      const tr = this.transition;
      tr.t += dt;
      const raw = clamp(tr.t / tr.duration, 0, 1);
      const k = easeInOutCubic(raw);

      if (tr.toMode === 'orbit') {
        // orbit 目标：直接插值 R / yaw / pitch / center
        const o = this.orbit;
        o.R = lerp(tr.fromOrbit.R, tr.toOrbit.R, k);
        o.yaw = lerp(tr.fromOrbit.yaw, tr.toOrbit.yaw, k);
        o.pitch = lerp(tr.fromOrbit.pitch, tr.toOrbit.pitch, k);
        o.center.lerpVectors(tr.fromOrbit.center, tr.toOrbit.center, k);
        this.applyOrbit(1e-4);
        // 过渡中给一点离地抬升，避免贴着沙丘扫过去
        const lift = Math.sin(raw * Math.PI) * tr.lift;
        cam.position.y += lift * 0.35;
        this.fov = this.fovTarget = lerp(tr.fromFov, tr.toFov, k);
        this.applyFov(this.fov);
      } else {
        // fly 目标：位置 + 朝向 + fov
        cam.position.lerpVectors(tr.fromPos, tr.toPos, k);
        cam.position.y += Math.sin(raw * Math.PI) * tr.lift;
        this.yaw = lerp(tr.fromYaw, tr.toYaw, k);
        this.pitch = lerp(tr.fromPitch, tr.toPitch, k);
        this.fov = this.fovTarget = lerp(tr.fromFov, tr.toFov, k);
        this.applyFov(this.fov);
        this.applyOrientation();
        this.position.copy(cam.position);
      }

      if (raw >= 1) {
        this.transition = null;
        this.applyMode(tr.toMode);
        if (tr.toMode === 'orbit') {
          const o = this.orbit;
          o.center.copy(tr.toOrbit.center);
          o.R = o.tR = tr.toOrbit.R;
          o.yaw = o.tYaw = tr.toOrbit.yaw;
          o.pitch = o.tPitch = tr.toOrbit.pitch;
          o.tCenter.copy(tr.toOrbit.center);
          this.applyOrbit(0.016);
        } else {
          this.constrainFly();
          this.position.copy(cam.position);
          this.applyOrientation();
        }
      }
      return;
    }

    // ---- 2) 正常操作 ----
    if (this.mode === 'orbit') {
      this.moveOrbit(dt);
      this.applyOrbit(dt);
    } else {
      if (Math.abs(this.fov - this.fovTarget) > 0.002) {
        this.fov = damp(this.fov, this.fovTarget, RIG.FOV_DAMP, dt);
        if (Math.abs(this.fov - this.fovTarget) < 0.002) this.fov = this.fovTarget;
        this.applyFov(this.fov);
      }
      this.moveFly(dt);
      this.constrainFly();
      this.position.copy(this.camera.position);
      this.applyOrientation();
    }
  }

  applyFov(fov) {
    const cam = this.camera;
    if (Math.abs(cam.fov - fov) > 0.0005) {
      cam.fov = fov;
      cam.updateProjectionMatrix();
    }
  }

  /** fly：WASD 平面移动 + Q/E 升降，方向只取 yaw 的水平投影 */
  moveFly(dt) {
    const k = this.keys;
    let mx = 0, mz = 0, my = 0;
    if (k.has('KeyW')) mz += 1;
    if (k.has('KeyS')) mz -= 1;
    if (k.has('KeyD')) mx += 1;
    if (k.has('KeyA')) mx -= 1;
    if (k.has('KeyQ')) my += 1;
    if (k.has('KeyE')) my -= 1;
    if (mx === 0 && mz === 0 && my === 0) return;

    const sprint = k.has('ShiftLeft') || k.has('ShiftRight');
    const speed = RIG.MOVE_SPEED * (sprint ? RIG.SPRINT_MUL : 1);
    const step = speed * dt;

    const hlen = Math.hypot(mx, mz);
    if (hlen > 0) { mx /= hlen; mz /= hlen; }

    const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    const rx = -Math.cos(this.yaw), rz = Math.sin(this.yaw);

    const cam = this.camera;
    cam.position.x += (fx * mz + rx * mx) * step;
    cam.position.z += (fz * mz + rz * mx) * step;
    cam.position.y += my * step;
  }

  /** fly：夹在地台内、不穿地、不出上下限 */
  constrainFly() {
    const p = this.camera.position;
    const B = RIG.BOUNDS;
    p.x = clamp(p.x, B.minX, B.maxX);
    p.z = clamp(p.z, B.minZ, B.maxZ);
    p.y = clamp(p.y, minCameraY(p.x, p.z), B.maxY);
  }

  /* ===================== 输入 ===================== */

  bindInput(dom) {
    this.dom = dom;

    // ---- 左键拖拽 ----
    dom.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || this.transition) return;
      this.dragging = true;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      try { dom.setPointerCapture(e.pointerId); } catch (err) { /* 合成事件没有真实指针 */ }
      dom.style.cursor = 'grabbing';
      e.preventDefault();
    });

    dom.addEventListener('pointermove', (e) => {
      if (!this.dragging || this.transition) return;
      const dx = e.clientX - this.lastX;
      const dy = e.clientY - this.lastY;
      this.lastX = e.clientX;
      this.lastY = e.clientY;

      if (this.mode === 'orbit') {
        // 只改目标值，每帧向目标收敛 → 有惯性收尾
        const o = this.orbit;
        const O = RIG.ORBIT;
        // 「转沙盘」手感：鼠标往右拖 → 沙盘跟着往右转、相机绕中心向左走。
        // 说明：orbit.yaw 是"相机站位角"，sin/cos 决定相机在中心哪一侧，
        // 所以"相机向左走"对应 yaw 减小（-=），别被 this.yaw（视线方向）绕晕。
        // 只动 dx 这一项，dy（俯仰）保持原手感。
        o.tYaw -= dx * O.SENS_YAW;
        // 俯角下限随距离变化：贴太近时不允许贴地看
        o.tPitch = clamp(o.tPitch - dy * O.SENS_PITCH,
                         orbitPitchFloor(o.tR), O.PITCH_MAX);
      } else {
        this.yaw -= dx * RIG.SENSITIVITY;
        this.pitch = clamp(this.pitch - dy * RIG.SENSITIVITY, -RIG.PITCH_LIMIT, RIG.PITCH_LIMIT);
      }
    });

    const endDrag = (e) => {
      if (!this.dragging) return;
      this.dragging = false;
      dom.style.cursor = 'grab';
      try {
        if (dom.hasPointerCapture && dom.hasPointerCapture(e.pointerId)) {
          dom.releasePointerCapture(e.pointerId);
        }
      } catch (err) { /* 同上 */ }
    };
    dom.addEventListener('pointerup', endDrag);
    dom.addEventListener('pointercancel', endDrag);
    dom.addEventListener('contextmenu', (e) => e.preventDefault());
    dom.style.cursor = 'grab';

    // ---- 滚轮：orbit 改距离 / fly 改 FOV ----
    dom.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (this.transition) return;
      if (this.mode === 'orbit') {
        const O = RIG.ORBIT;
        const o = this.orbit;
        const f = e.deltaY < 0 ? O.STEP_IN : O.STEP_OUT;   // 上滚拉近
        o.tR = clamp(o.tR * f, O.R_MIN, O.R_MAX);
      } else {
        const dir = e.deltaY > 0 ? 1 : -1;
        this.fovTarget = clamp(this.fovTarget + dir * RIG.ZOOM_STEP, RIG.FOV_MIN, RIG.FOV_MAX);
      }
    }, { passive: false });

    // ---- 键盘 ----
    window.addEventListener('keydown', (e) => {
      const c = e.code;
      if (c === 'KeyW' || c === 'KeyA' || c === 'KeyS' || c === 'KeyD' ||
          c === 'KeyQ' || c === 'KeyE' || c === 'ShiftLeft' || c === 'ShiftRight') {
        this.keys.add(c);
        if (c === 'KeyQ' || c === 'KeyE') e.preventDefault();
      }
    });
    window.addEventListener('keyup', (e) => this.keys.delete(e.code));
    window.addEventListener('blur', () => this.keys.clear());
  }
}

      startPosition: new THREE.Vector3(
        DEF.bunkers[0].x + ((DEF.bunkers[0].cfg && DEF.bunkers[0].cfg.emb[0][0]) || -2.9),
        bunkerPadY(DEF.bunkers[0]) + ((DEF.bunkers[0].cfg && DEF.bunkers[0].cfg.emb[0][1]) || 1.02) + 0.42,
        DEF.bunkers[0].z + ((DEF.bunkers[0].cfg && DEF.bunkers[0].cfg.d) || 9.0) * 0.5 - 1.75
      ),
      startTarget: new THREE.Vector3(
        DEF.bunkers[0].x + ((DEF.bunkers[0].cfg && DEF.bunkers[0].cfg.emb[0][0]) || -2.9) + 1.5,
        bunkerPadY(DEF.bunkers[0]) + 0.72,
        DEF.bunkers[0].z + 62
      ),
      fov: 68
    },
    {
      name: '坑道内部',
      desc: '地下隧道 · 灯光纵深',
      hint: '地下视角 · 洞内不会穿地',
      icon: 'tunnel',
      group: '阵地',
      startPosition: new THREE.Vector3(-46.2, tunnelYAt(-46.2, -26) + 1.50, -26),
      startTarget: new THREE.Vector3(-46.2, tunnelYAt(-46.2, -42) + 1.25, -42),
      fov: 62
    },
    {
      name: '后方火炮补给',
      desc: '火炮阵地 · 补给营地',
      hint: '营地视角 · 往北飞能看整条防线',
      icon: 'camp',
      group: '后方',
      startPosition: new THREE.Vector3(37.0, 13.6, -60.0),
      startTarget: new THREE.Vector3(-3.0, 3.4, -76.0),
      fov: 58
    }
  ];
}

/**
 * 动态物件的当前"眼位"：登陆艇艇首 / 坦克车长塔。
 * 只用来算机位的起始位姿 —— 落地之后不再跟随，控制权完全交给用户。
 * 返回 null 表示场景还没建完。
 */
function getFollowPose(preset) {
  const L = state.landing;
  if (!L) return null;

  if (preset.follow === 'boat') {
    // [0] = 第一波最靠岸那艘（US 33），艇首低机位
    const b = L.boats && L.boats[0];
    if (!b) return null;
    // 艇首眼位：局部坐标套用艇的姿态（yaw + 随浪起伏），再叠到世界位置
    const pos = b.eyeLocal.clone().applyEuler(b.group.rotation).add(b.group.position);
    // 视线略微上抬，避免画面下半全是水面；正对滩头（拒马 / 坦克 / 碉堡都在框里）
    return { pos, tgt: new THREE.Vector3(b.cfg.x + 1, 4.60, -16) };
  }

  if (preset.follow === 'tank') {
    // [0] = 沙滩上那辆完好的坦克
    const t = L.tanks && L.tanks[0];
    if (!t) return null;
    // 车长指挥塔位置：略微后移抬高，炮管留在画面下缘但不挡视野
    const pos = new THREE.Vector3(0.16, 3.02, -0.92)
      .applyEuler(t.group.rotation)
      .add(t.group.position);
    return { pos, tgt: new THREE.Vector3(46, 4.40, -30) };
  }

  return null;
}

/** 机位顺序：自由 → 总览 → 从海到内陆 */
const CAM_ORDER = [
  '环绕视角', '总览俯瞰', '防线俯瞰', '海滩平视', '水线视角', '登陆艇视角', '坦克视角',
  '碉堡射击孔', '坑道内部', '后方火炮补给'
];

/**
 * 机位的真实起始位姿。
 * 登陆艇 / 坦克是动态物件：按"点开机位的那一刻"的姿态起算，
 * 之后不再跟随（机位只负责搬运，不负责锁定）。
 */
function resolvePresetStart(preset) {
  if (preset.follow) {
    const pose = getFollowPose(preset);
    if (pose) {
      const start = {
        pos: pose.pos.clone(),
        target: pose.tgt.clone()
      };
      // 起点如果嵌在地里/水里，往上抬到安全高度（坑道内按洞底）
      const floor = minCameraY(start.pos.x, start.pos.z);
      if (start.pos.y < floor) start.pos.y = floor;
      return start;
    }
  }
  return { pos: preset.startPosition.clone(), target: preset.startTarget.clone() };
}

/* -------------------------------------------------------------------------
 * 13.4 createCameraSystem —— 建唯一相机控制器
 * ----------------------------------------------------------------------- */
function createCameraSystem() {
  const camera = state.camera;

  const presets = makeCameraPresets();
  presets.sort((a, b) => CAM_ORDER.indexOf(a.name) - CAM_ORDER.indexOf(b.name));
  presets.forEach((p, i) => {
    p.key = String(i + 1);            // 快捷键编号始终等于列表序号
    if (!p.mode) p.mode = 'fly';      // 只有「环绕视角」是 orbit，其余都是 fly
  });

  const rig = new SingleCameraRig(camera, presets);
  rig.bindInput(state.renderer.domElement);
  rig.applyMode('orbit');
  rig.selectPreset(0, true);          // 开场就是「环绕视角」

  state.cam = rig;
  state.rig = rig;
  rig.onChange = () => {
    if (state.ui) syncCamUI();
  };
  rig.onModeChange = (mode) => renderTips(mode);
  renderTips(rig.mode);          // 首屏就把当前模式的操作提示画出来

  bindHotkeys(rig);
  window.__RIG__ = rig;      // init 之后才拿得到，所以在这里挂
  return rig;
}

/** 全局快捷键（机位 / 昼夜 / 边界 / 折叠 / 全屏） */
function bindHotkeys(rig) {
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;

    const code = e.code;
    if (code.startsWith('Digit')) {
      const idx = Number(code.slice(5)) - 1;
      if (idx >= 0 && idx < rig.presets.length) {
        focusCamera(idx);
        e.preventDefault();
      }
      return;
    }

    switch (code) {
      case 'KeyT':
      case 'KeyN': setTimeOfDay(state.time.target > 0.5 ? 0 : 1); break;
      case 'KeyB': toggleBounds(!PLATFORM_BOUNDS.enabled); break;
      case 'KeyH': {
        const panelEl = document.getElementById('panel');
        if (panelEl) panelEl.classList.toggle('is-collapsed');
        break;
      }
      case 'KeyF': toggleFullscreen(); break;
      case 'KeyR': rig.resetCurrent(); break;
    }
  });
}

/* -------------------------------------------------------------------------
 * 13.5 对外 API（保持旧签名，方便脚本 / 控制台调用）
 * ----------------------------------------------------------------------- */
function focusCamera(index, instant = false) {
  if (!state.rig) return;
  state.rig.selectPreset(index, instant);
}
function resetCamera() {
  if (!state.rig) return;
  state.rig.resetCurrent();
}
function updateCamera(dt) {
  if (state.rig) state.rig.update(dt);
}

/* =========================================================================
 * 14. createUI —— 右上角毛玻璃面板 / 提示 / 折叠
 * ========================================================================= */
const CAM_ICONS = {

  gun:

};

/**
 * 左下角操作提示：orbit / fly 两套文案。
 * 由 rig.onModeChange 触发，切机位时自动换。
 */
function renderTips(mode) {
  const el = document.getElementById('tips');
  if (!el) return;
  const orbit = mode === 'orbit';
  const rows = orbit
    ? [
        ['左键拖拽', '环绕旋转'],
        ['滚轮', '拉近拉远'],
        ['W A S D', '平移观察中心'],
        ['Q E', '缩放距离']
      ]
    : [
        ['左键拖拽', '转动视角'],
        ['滚轮', '缩放视野'],
        ['W A S D', '平移'],
        ['Q E', '升降']
      ];
  const common = [
    ['Shift', '加速'],
    ['1–9', '切机位'],
    ['R', '重置'],
    ['N', '昼夜'],
    ['H', '折叠'],
    ['F', '全屏']
  ];
  const span = (label, text) =>
    '<span class="tip"><kbd>' + label.replace(/ /g, '</kbd><kbd>') + '</kbd> ' + text + '</span>';
  el.innerHTML = rows.map((r) => span(r[0], r[1])).join('') +
                 '<span class="tip tip-sep"></span>' +
                 common.map((r) => span(r[0], r[1])).join('');
}

function createUI() {
  const cam = state.cam;
  const listEl = document.getElementById('cam-list');

  // ---- 机位列表（带分组标题）----
  const items = [];
  let lastGroup = null;
  cam.presets.forEach((p, i) => {
    if (p.group !== lastGroup) {
      lastGroup = p.group;
      const gh = document.createElement('li');
      gh.className = 'cam-group';
      gh.textContent = p.group;
      listEl.appendChild(gh);
    }
    const li = document.createElement('li');
    li.className = 'cam-item' + (i === cam.index ? ' is-active' : '');
    li.innerHTML =
      '<span class="cam-icon">' + (CAM_ICONS[p.icon] || CAM_ICONS.overview) + '</span>' +
      '<span class="cam-body">' +
        '<span class="cam-name">' + p.name + '</span>' +
        '<span class="cam-desc">' + p.desc + '</span>' +
        '<span class="cam-hint">' + p.hint + '</span>' +
      '</span>' +
      '<span class="cam-key">' + p.key + '</span>';
    li.addEventListener('click', () => focusCamera(i));
    listEl.appendChild(li);
    items.push(li);
  });

  // ---- 面板折叠 ----
  const panel = document.getElementById('panel');
  document.getElementById('panel-toggle').addEventListener('click', () => {
    panel.classList.toggle('is-collapsed');
  });

  // ---- 昼夜分段控件 ----
  const todSeg = document.getElementById('tod-seg');
  todSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn');
    if (!btn) return;
    setTimeOfDay(Number(btn.dataset.tod));
  });

  // ---- 地台边界开关 ----
  const boundsSeg = document.getElementById('bounds-seg');
  boundsSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('.seg-btn');
    if (!btn) return;
    toggleBounds(btn.dataset.bounds === '1');
  });

  // ---- 重置本视角 ----
  const resetBtn = document.getElementById('rig-reset');
  if (resetBtn) resetBtn.addEventListener('click', () => resetCamera());

  state.ui = {
    panel,
    resetBtn,
    camItems: items,
    fps: document.getElementById('fps'),
    tris: document.getElementById('tris'),
    crosshair: document.getElementById('crosshair'),
    todSeg,
    boundsSeg
  };

  syncTodUI();
  syncCamUI();
}

/** 同步机位列表高亮 + 漫游准星 */
function syncCamUI() {
  const ui = state.ui;
  if (!ui.camItems) return;
  ui.camItems.forEach((el, i) => el.classList.toggle('is-active', i === state.cam.index));
  // 所有视角都是自由视角了，准星常显
  if (ui.crosshair) ui.crosshair.classList.add('is-on');
}

/** 同步昼夜分段控件 */
function syncTodUI() {
  const ui = state.ui;
  if (!ui.todSeg) return;
  const night = state.time.target > 0.5;
  for (const btn of ui.todSeg.querySelectorAll('.seg-btn')) {
    btn.classList.toggle('is-on', (btn.dataset.tod === '1') === night);
  }
}

/* =========================================================================
 * 15. 初始化与主循环
 * ========================================================================= */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  state.camera.aspect = w / h;
  state.camera.updateProjectionMatrix();
  state.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  state.renderer.setSize(w, h);
}

function init() {
  const app = document.getElementById('app');

  // ---- 渲染器 ----
  const renderer = new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: 'high-performance',
    stencil: false
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = PALETTE.day.exposure;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(new THREE.Color(PALETTE.day.fog), 1);
  app.appendChild(renderer.domElement);
  state.renderer = renderer;
  // 纹理各向异性（沙地斜视角下不糊）
  state.maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  // ---- 场景 ----
  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(PALETTE.day.fog, PALETTE.day.fogDensity);
  scene.background = new THREE.Color(PALETTE.day.horizon);
  state.scene = scene;

  // 相机：远平面要覆盖星空球（R=4600）
  // 唯一相机实例：fov 由 SingleCameraRig 接管（默认 50°，滚轮 15°~85°）
  const camera = new THREE.PerspectiveCamera(
    50, window.innerWidth / window.innerHeight, 0.1, 12000
  );
  scene.add(camera);
  state.camera = camera;
  state.clock = new THREE.Clock();

  // ---- 依次构建场景 ----
  scene.add(createSky());
  scene.add(createLights());
  scene.add(createTerrain());
  scene.add(createApron());     // 9.5 外圈裙边地形（消掉沙盘切面）
  scene.add(createOcean());
  scene.add(createProps());
  scene.add(createPuddles());
  // 防御工事：两座碉堡 + 地下坑道 + 战壕 + 后方入口（会参与地形开挖）
  scene.add(createDefenses());
  // 登陆部队：拒马 / 登陆艇 / 坦克 / 滩头杂物（第三轮）
  scene.add(createLandingForce());
  scene.add(createRearPositions());   // 12.7 后方火炮阵地与补给营地
  scene.add(createBoundsDebug());

  // 预留：军事装备组（下一轮所有装备挂到这里）
  const equipment = new THREE.Group();
  equipment.name = 'equipment';
  scene.add(equipment);
  state.groups.equipment = equipment;

  createCameraSystem();
  createUI();

  // 初始昼夜：立即到位（白天）
  applyTimeOfDay(0);

  window.addEventListener('resize', onResize);
  // 切回页面时丢弃累积的时间差，避免昼夜/波浪瞬跳
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.clock) state.clock.getDelta();
  });

  animate();
}

let bootDone = false;
let statsAccum = 0;
let statsFrames = 0;

function animate() {
  requestAnimationFrame(animate);

  // 帧间隔夹住，避免切标签页回来时大跳
  const dt = Math.min(state.clock.getDelta(), 0.05);
  state.elapsed += dt;
  state.frame++;

  // ---- 昼夜：向目标值平滑逼近 ----
  const time = state.time;
  if (Math.abs(time.current - time.target) > 0.0004) {
    time.current = damp(time.current, time.target, time.speed, dt);
    if (Math.abs(time.current - time.target) <= 0.0004) time.current = time.target;
    applyTimeOfDay(time.current);
  }

  // ---- 天空球 / 星空跟随相机（永远罩住视点）----
  if (state.skyMesh) state.skyMesh.position.copy(state.camera.position);
  if (state.starField) state.starField.position.copy(state.camera.position);

  // ---- shader 时间 ----
  if (state.uniforms.ocean) state.uniforms.ocean.uTime.value = state.elapsed;
  if (state.uniforms.sky) state.uniforms.sky.uTime.value = state.elapsed;
  if (state.uniforms.puddle) state.uniforms.puddle.uTime.value = state.elapsed;

  // ---- 相机 ----
  updateCamera(dt);

  // ---- 扩展回调（下一轮：装备动画、部署逻辑等）----
  for (let i = 0; i < state.updaters.length; i++) {
    state.updaters[i](dt, state.elapsed);
  }

  state.renderer.render(state.scene, state.camera);

  // ---- 状态栏 ----
  statsAccum += dt;
  statsFrames++;
  if (statsAccum >= 0.5) {
    state.fps = Math.round(statsFrames / statsAccum);
    if (state.ui.fps) state.ui.fps.textContent = state.fps + ' FPS';
    if (state.ui.tris) {
      const tri = state.renderer.info.render.triangles;
      state.ui.tris.textContent = (tri / 1000).toFixed(0) + 'K TRI';
    }
    statsAccum = 0;
    statsFrames = 0;
  }

  // ---- 首帧渲染完后收起开场遮罩 ----
  if (!bootDone && state.frame > 2) {
    bootDone = true;
    const boot = document.getElementById('boot');
    if (boot) boot.classList.add('is-done');
  }
}

/* =========================================================================
 * 16. 启动
 * ========================================================================= */
// 对外暴露，方便下一轮在控制台调参
window.__COASTAL__ = state;
window.__THREE__ = THREE;          // 调试用：控制台里可以直接 new Raycaster
window.__DEF__ = state.defense;      // 本轮新增：工事对象（碉堡/坑道/战壕）
window.__LAND__ = state.landing;     // 第三轮：登陆部队（拒马/艇/坦克/杂物）
window.__REAR__ = state.rear;        // 第四轮：后方火炮阵地与补给营地
// window.__RIG__ 在 createCameraSystem() 里挂（那时 rig 才存在）
window.setTimeOfDay = setTimeOfDay;
window.focusCamera = focusCamera;
window.resetCamera = resetCamera;
window.toggleBounds = toggleBounds;

try {
  init();
} catch (err) {
  console.error(err);
  showBootError('场景初始化失败：' + (err && err.message ? err.message : String(err)));
}
</script>
