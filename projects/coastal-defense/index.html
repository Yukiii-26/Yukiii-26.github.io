<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>海岸防线 · Coastal Defense</title>
<style>
/* =========================================================
   基础
   ========================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #0b1118; }
body {
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  color: #e8f0f8;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}
#app { position: fixed; inset: 0; }
#app canvas { display: block; width: 100%; height: 100%; outline: none; }

/* 轻微暗角，让画面更聚焦 */
#vignette {
  position: fixed; inset: 0; z-index: 5; pointer-events: none;
  background: radial-gradient(125% 105% at 50% 45%, transparent 52%, rgba(0, 0, 0, 0.34) 100%);
}

/* =========================================================
   HUD 容器（整体不拦截鼠标，交互元素单独放开）
   ========================================================= */
#hud { position: fixed; inset: 0; z-index: 10; pointer-events: none; }

/* ---------------- 右上角面板 ---------------- */
#panel {
  position: absolute; top: 24px; right: 24px; width: 304px;
  pointer-events: auto;
  background: rgba(10, 16, 24, 0.55);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid rgba(160, 205, 255, 0.16);
  border-radius: 16px;
  box-shadow: 0 20px 50px -12px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  overflow: hidden;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}
#panel:hover { border-color: rgba(160, 205, 255, 0.26); }

.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 14px 12px 16px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-dot {
  width: 8px; height: 8px; border-radius: 50%; background: #4fd6e3;
  box-shadow: 0 0 12px #4fd6e3; animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 0.55; box-shadow: 0 0 6px rgba(79, 214, 227, 0.5); }
  50%      { opacity: 1;    box-shadow: 0 0 14px rgba(79, 214, 227, 0.95); }
}
.brand-text { display: flex; flex-direction: column; line-height: 1.25; }
.brand-text strong { font-size: 14px; font-weight: 650; letter-spacing: 0.04em; }
.brand-text span { font-size: 9.5px; letter-spacing: 0.16em; color: rgba(190, 214, 236, 0.5); text-transform: uppercase; }

.icon-btn {
  display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px;
  border: 1px solid rgba(160, 205, 255, 0.14); background: rgba(255, 255, 255, 0.04);
  color: rgba(215, 232, 246, 0.75); cursor: pointer; transition: 0.2s;
}
.icon-btn:hover { background: rgba(255, 255, 255, 0.1); color: #fff; }
.icon-btn svg { transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
#panel.is-collapsed .icon-btn svg { transform: rotate(180deg); }

.panel-body {
  max-height: 62vh; overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: rgba(160, 205, 255, 0.18) transparent;
  transition: max-height 0.42s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.28s ease;
}
.panel-body::-webkit-scrollbar { width: 6px; }
.panel-body::-webkit-scrollbar-thumb {
  background: rgba(160, 205, 255, 0.18); border-radius: 3px;
}
.panel-body::-webkit-scrollbar-thumb:hover { background: rgba(160, 205, 255, 0.3); }
#panel.is-collapsed .panel-body { max-height: 0; opacity: 0; }

.sec { padding: 0 14px 14px; }
.sec + .sec { border-top: 1px solid rgba(160, 205, 255, 0.08); padding-top: 14px; }
.sec-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 9px; }
.sec-title span { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; color: rgba(214, 232, 246, 0.9); }
.sec-title em { font-style: normal; font-size: 9px; letter-spacing: 0.2em; color: rgba(150, 180, 205, 0.42); }

/* ---------------- 机位列表 ---------------- */
.cam-list { list-style: none; display: flex; flex-direction: column; gap: 4px; }
.cam-group {
  padding: 9px 12px 3px;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: rgba(150, 175, 200, 0.45);
  user-select: none;
}
.cam-item {
  position: relative; display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border-radius: 10px; cursor: pointer;
  border: 1px solid transparent;
  transition: background 0.2s, border-color 0.2s;
}
.cam-item:hover { background: rgba(255, 255, 255, 0.06); border-color: rgba(160, 205, 255, 0.1); }
.cam-item.is-active {
  background: linear-gradient(90deg, rgba(79, 214, 227, 0.2), rgba(79, 214, 227, 0.04));
  border-color: rgba(79, 214, 227, 0.32);
}
.cam-item.is-active::before {
  content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  width: 2px; height: 18px; border-radius: 2px; background: #4fd6e3; box-shadow: 0 0 8px #4fd6e3;
}
.cam-icon {
  display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px;
  background: rgba(255, 255, 255, 0.05); color: rgba(180, 210, 232, 0.8); flex: 0 0 auto;
  transition: 0.2s;
}
.cam-item.is-active .cam-icon { background: rgba(79, 214, 227, 0.15); color: #9ef4ff; }
.cam-body { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.cam-name { font-size: 12.5px; font-weight: 550; letter-spacing: 0.02em; }
.cam-desc { font-size: 10px; color: rgba(168, 192, 214, 0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cam-key {
  margin-left: auto; font-size: 9.5px; padding: 2px 5px; border-radius: 4px;
  border: 1px solid rgba(160, 205, 255, 0.16); color: rgba(170, 196, 220, 0.55);
  font-variant-numeric: tabular-nums; flex: 0 0 auto;
}
.cam-item.is-active .cam-key { border-color: rgba(79, 214, 227, 0.35); color: rgba(158, 244, 255, 0.85); }

/* 机位 hover 时把描述换成操作提示（不改变行高） */
.cam-body { position: relative; }
.cam-hint {
  position: absolute; left: 0; right: 0; top: 14px;
  font-size: 10px; color: rgba(158, 244, 255, 0.82);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; transform: translateY(2px); pointer-events: none;
  transition: opacity 0.16s ease, transform 0.16s ease;
}
.cam-item:hover .cam-hint { opacity: 1; transform: translateY(0); }
.cam-item:hover .cam-desc { opacity: 0; }
.cam-desc { transition: opacity 0.16s ease; }

/* 重置本视角按钮 */
.rig-reset {
  display: flex; align-items: center; justify-content: center; gap: 6px;
  width: 100%; margin-top: 8px; padding: 6px 8px; border-radius: 8px;
  border: 1px solid rgba(160, 205, 255, 0.14); background: rgba(255, 255, 255, 0.04);
  color: rgba(206, 228, 244, 0.78); font: inherit; font-size: 11px; cursor: pointer;
  transition: background 0.18s, border-color 0.18s, color 0.18s;
}
.rig-reset:hover {
  background: rgba(79, 214, 227, 0.14);
  border-color: rgba(79, 214, 227, 0.34);
  color: #c8f7ff;
}
.rig-reset:active { transform: translateY(1px); }

/* ---------------- 通用行 ---------------- */
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 5px 2px; }
.row + .row { margin-top: 2px; }
.row-label { font-size: 12px; color: rgba(214, 232, 246, 0.82); }
.row-hint { font-size: 10.5px; color: rgba(150, 175, 196, 0.4); }
.row-disabled { opacity: 0.5; }

/* 分段控件 */
.seg {
  display: flex; padding: 2px; gap: 2px; border-radius: 9px;
  background: rgba(8, 14, 22, 0.55); border: 1px solid rgba(160, 205, 255, 0.1);
}
.seg-btn {
  appearance: none; border: 0; background: transparent; color: rgba(190, 214, 236, 0.6);
  font: inherit; font-size: 11px; padding: 5px 9px; border-radius: 7px; cursor: pointer;
  transition: 0.2s; white-space: nowrap;
}
.seg-btn:hover { color: #fff; background: rgba(255, 255, 255, 0.06); }
.seg-btn.is-on { background: rgba(79, 214, 227, 0.18); color: #b9f6ff; box-shadow: inset 0 0 0 1px rgba(79, 214, 227, 0.32); }

.panel-foot {
  display: flex; justify-content: space-between; padding: 9px 16px 11px;
  font-size: 10px; letter-spacing: 0.06em; color: rgba(150, 178, 200, 0.45);
  border-top: 1px solid rgba(160, 205, 255, 0.08); font-variant-numeric: tabular-nums;
}

/* ---------------- 左下角操作提示 ---------------- */
#tips {
  position: absolute; left: 24px; bottom: 20px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; max-width: 540px;
  font-size: 11.5px; color: rgba(210, 228, 244, 0.55);
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}
#tips .tip { display: inline-flex; align-items: center; gap: 6px; }
kbd {
  display: inline-block; min-width: 17px; padding: 1px 5px; border-radius: 4px;
  border: 1px solid rgba(190, 214, 236, 0.22); background: rgba(255, 255, 255, 0.06);
  font: 10px/1.5 ui-monospace, "SFMono-Regular", Consolas, monospace;
  color: rgba(220, 236, 248, 0.8); text-align: center;
}

/* ---------------- 漫游准星 ---------------- */
#crosshair {
  position: absolute; left: 50%; top: 50%; width: 20px; height: 20px;
  transform: translate(-50%, -50%) scale(0.9); opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
}
#crosshair::before, #crosshair::after {
  content: ""; position: absolute; left: 50%; top: 50%;
  background: rgba(255, 255, 255, 0.55); box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
}
#crosshair::before { width: 1px; height: 10px; transform: translate(-50%, -50%); }
#crosshair::after { width: 10px; height: 1px; transform: translate(-50%, -50%); }
#crosshair.is-on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

/* ---------------- 开场遮罩 ---------------- */
#boot {
  position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
  background: radial-gradient(120% 120% at 50% 40%, #14202c 0%, #080d12 70%);
  transition: opacity 0.75s ease, visibility 0.75s;
}
#boot.is-done { opacity: 0; visibility: hidden; }
.boot-inner { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.boot-ring {
  width: 34px; height: 34px; border-radius: 50%;
  border: 2px solid rgba(120, 200, 220, 0.18); border-top-color: #58d7e4;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.boot-text { font-size: 12px; letter-spacing: 0.28em; color: rgba(190, 214, 236, 0.7); }
#boot.is-error .boot-ring { display: none; }
#boot.is-error .boot-text {
  color: #ffb4b4; letter-spacing: 0.1em; max-width: 480px; text-align: center; line-height: 1.9;
}

@media (max-width: 1280px) {
  #panel { width: 272px; top: 18px; right: 18px; }
  #tips { font-size: 10.5px; left: 18px; }
}
</style>
<link rel="stylesheet" href="../../assets/fonts/serif.css">
</head>
<body>

<div id="app"></div>
<div id="vignette"></div>

<div id="boot">
  <div class="boot-inner">
    <div class="boot-ring"></div>
    <div class="boot-text" id="boot-text">正在生成地形与海岸线</div>
  </div>
</div>

<div id="hud">
  <aside id="panel">
    <header class="panel-head">
      <div class="brand">
        <span class="brand-dot"></span>
        <div class="brand-text">
          <strong>海岸防线</strong>
          <span>Coastal Defense · v1.0</span>
        </div>
      </div>
      <button id="panel-toggle" class="icon-btn" title="折叠面板" aria-label="折叠面板">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15l-6-6-6 6"/></svg>
      </button>
    </header>

    <div class="panel-body">
      <section class="sec">
        <div class="sec-title"><span>机位</span><em>CAMERA</em></div>
        <ul class="cam-list" id="cam-list"></ul>
        <button class="rig-reset" id="rig-reset" title="回到当前机位的起始位姿（R）">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
          </svg>
          <span>重置本视角</span>
        </button>
      </section>

      <section class="sec">
        <div class="sec-title"><span>环境</span><em>ENVIRONMENT</em></div>
        <div class="row">
          <span class="row-label">昼夜</span>
          <div class="seg" id="tod-seg">
            <button class="seg-btn is-on" data-tod="0">白天</button>
            <button class="seg-btn" data-tod="1">夜晚</button>
          </div>
        </div>
        <div class="row">
          <span class="row-label">地台边界</span>
          <div class="seg" id="bounds-seg">
            <button class="seg-btn" data-bounds="1">显示</button>
            <button class="seg-btn is-on" data-bounds="0">隐藏</button>
          </div>
        </div>
      </section>

      <section class="sec">
        <div class="sec-title"><span>画质</span><em>QUALITY</em></div>
        <div class="row row-disabled"><span class="row-label">阴影精度</span><span class="row-hint">下一轮开放</span></div>
        <div class="row row-disabled"><span class="row-label">水面细分</span><span class="row-hint">下一轮开放</span></div>
      </section>
    </div>

    <footer class="panel-foot">
      <span id="fps">-- FPS</span>
      <span id="tris">-- TRI</span>
    </footer>
  </aside>

  <!-- 左下操作提示：按当前模式（orbit / fly）由 renderTips() 生成 -->
  <div id="tips"></div>

  <div id="crosshair"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js"
  }
}
</script>

<script type="module">
/* =========================================================================
 *  海岸防线 · Coastal Defense  ——  v1.0
 *  单文件 three.js 场景：地台 / 地形 / 海水 / 天空 / 相机 / 昼夜框架
 *
 *  坐标规划（实测范围，单位：米）
 *  ┌──────────────────────────────────────────────────────────────┐
 *  │  X: -120 ──────────────────────────────── +120   （宽 240）  │
 *  │  Z:  -90 ──────────────────────────────── +90    （深 180）  │
 *  │                                                              │
 *  │   Z = +90 ▍海（深水，向地平线延伸）                          │
 *  │   Z = +40 ▍海水区界                                          │
 *  │   Z = +10 ▍潮间带 / 湿沙滩                                   │
 *  │   Z = -50 ▍干沙滩 → 草坡（内陆阵地前沿）                     │
 *  │   Z = -90 ▍后方内陆阵地（本轮为空，下一轮放装备）             │
 *  │                                                              │
 *  │   原点 (0,0,0) = 地台中心，Y 轴向上，+Z = 海的方向           │
 *  └──────────────────────────────────────────────────────────────┘
 *
 *  模块结构（按函数拆分，便于后续轮次追加内容）
 *    createSky()            天空球 + 程序化薄云 + 星空
 *    createTerrain()        细分平面 + 顶点位移 + 程序化沙/草纹理 + 植被
 *    createOcean()          自定义网格 + 波浪/泡沫/雾 shader
 *    createCameraSystem()   预设机位 + 平滑切换 + 自由漫游
 *    createUI()             右上毛玻璃面板 / 提示 / 折叠
 *    setTimeOfDay(t)        昼夜过渡（只改目标值，主循环平滑逼近）
 *
 *  扩展锚点（下一轮直接用）
 *    state.groups.equipment  空 Group，军事装备统一挂到这里
 *    state.updaters[]        每帧回调数组，装备动画/逻辑往这里 push
 *    state.terrainHeightAt() 任意 (x,z) 的地面高度，用来把道具放在地上
 *    state.materials / textures  共享材质与纹理
 * ========================================================================= */

/* -------------------------------------------------------------------------
 * 1. 引入 three.js
 *    站内自托管：three r160 已放在 ./vendor/three/three.module.js，
 *    importmap（见 <head> 上方）把裸名 "three" 指到本地文件。
 *    全站约定：不连任何 CDN，所以这里只 import 一次，失败就报错，
 *    不再回退到 unpkg / jsDelivr。
 * ---------------------------------------------------------------------- */
let THREE = null;
try {
  THREE = await import('three');
} catch (err) {
  console.error('[three] 本地 three.js 加载失败：', err);
}

/** 启动失败时在遮罩上显示中文错误（而不是白屏） */
function showBootError(message) {
  const boot = document.getElementById('boot');
  const text = document.getElementById('boot-text');
  if (boot) boot.classList.add('is-error');
  if (text) text.textContent = message;
}

if (!THREE) {
  showBootError('three.js 加载失败：本地文件 vendor/three/three.module.js 没读到。如果是从本地 double-click 打开的 .html，浏览器会拦掉 ES module（CORS）——请用本地服务器打开，或直接访问线上页面。');
  throw new Error('three.js 加载失败');
}

/* -------------------------------------------------------------------------
 * 2. 全局配置
 * ---------------------------------------------------------------------- */

/** 地台边界（米）。X 宽 240，Z 深 180，原点在地台中心 */
const BOUNDS = {
  minX: -120, maxX: 120,
  minZ: -90,  maxZ: 90
};

/**
 * 地台边界开关（本轮默认关闭）。
 * 调试时可把它 / UI 里的「地台边界」按钮打开，会画出边界线框与分区色带，
 * 方便检查地形、海水、植被有没有溢出台面。
 */
const PLATFORM_BOUNDS = {
  enabled: false,          // 默认关闭边界 debug
  zone: {
    sea: 40,               // Z > 40          纯海水区
    intertidal: 10,        // Z 10 ~ 40       潮间带 / 湿沙滩
    inland: -50            // Z -50 ~ 10      干沙滩与草坡
  },
  colors: {
    sea: 0x2f9fd8,
    intertidal: 0xe0c27a,
    beach: 0xd8c79a,
    inland: 0x9a8f63
  }
};

/** 地形沿 Z 的高度剖面关键点 [z, y]，Hermite 插值（岸线在 z≈16 处 y≈0） */
const PROFILE = [
  [-90,  9.0],
  [-80, 11.2],
  [-70, 10.0],
  [-60,  7.8],
  [-50,  6.2],
  [-42,  5.0],
  [-30,  3.2],
  [-16,  1.6],
  [  0,  0.8],
  [  6,  0.55],
  [ 12,  0.22],
  [ 16,  0.02],
  [ 22, -0.45],
  [ 30, -1.05],
  [ 40, -1.90],
  [ 52, -3.20],
  [ 70, -4.80],
  [ 90, -6.40],
  [120, -8.40],
  [200, -11.0]
];

/** 沙滩上的水洼（潮池）：[x, z, 半径, 深度] */
const TIDE_POOLS = [
  [-66,  -1.0, 3.2, 0.55],
  [-22,   3.0, 2.8, 0.45],
  [ 18,  -2.0, 3.4, 0.58],
  [ 58,   2.5, 3.0, 0.48],
  [ 92,  -3.0, 2.8, 0.45]
];

/** 昼夜两套配色/光照参数（数值都是「主循环插值」的目标端） */
const PALETTE = {
  day: {
    sunDir: new THREE.Vector3(0.52, 0.36, 0.62).normalize(), // 太阳方向（指向太阳）
    sunColor: 0xfff2d2, sunIntensity: 2.9,
    hemiSky: 0xcfe6ff, hemiGround: 0x6b6047, hemiIntensity: 1.75,
    ambient: 0.15,
    fog: 0xb8d2e4, fogDensity: 0.0042,
    zenith: 0x1d5c9e, horizon: 0xb8d2e4,
    cloud: 0xf6fbff, cloudCover: 0.52,
    waterDeep: 0x0a2f4a, waterShallow: 0x2a8f96, foam: 0xffffff,
    sunGlow: 0xffd9a0,
    exposure: 0.98
  },
  night: {
    sunDir: new THREE.Vector3(0.44, 0.26, 0.86).normalize(), // 月亮方向（压低，海面上能看见）
    sunColor: 0xa9c3ff, sunIntensity: 0.9,
    hemiSky: 0x1e2b44, hemiGround: 0x0a0f16, hemiIntensity: 0.72,
    ambient: 0.11,
    fog: 0x101a26, fogDensity: 0.0058,
    zenith: 0x04070f, horizon: 0x101a26,
    cloud: 0x243244, cloudCover: 0.18,
    waterDeep: 0x03080f, waterShallow: 0x0a2233, foam: 0x3d5470,
    sunGlow: 0x8fb3ff,
    exposure: 0.95
  }
};

/* -------------------------------------------------------------------------
 * 3. 数学 / 噪声工具
 * ---------------------------------------------------------------------- */
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
};
/** 帧率无关的指数平滑：把 a 拉向 b */
const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);

/** 确定性随机数（纹理生成用，保证每次打开纹理一致） */
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function hash2(x, y) {
  const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return h - Math.floor(h);
}

/** 二维值噪声 */
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy);
  const b = hash2(ix + 1, iy);
  const c = hash2(ix, iy + 1);
  const d = hash2(ix + 1, iy + 1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}

/** 分形噪声 */
function fbm2(x, y, oct = 4) {
  let v = 0, amp = 0.5, fx = x, fy = y, norm = 0;
  for (let i = 0; i < oct; i++) {
    v += amp * noise2(fx, fy);
    norm += amp;
    fx = fx * 2.03 + 17.3;
    fy = fy * 2.03 + 9.1;
    amp *= 0.5;
  }
  return v / norm;
}

/** 可平铺的二维值噪声（period 为格点周期） */
function noise2p(x, y, period) {
  const ix = Math.floor(x), iy = Math.floor(y);
  const fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx);
  const uy = fy * fy * (3 - 2 * fy);
  const x0 = ((ix % period) + period) % period;
  const y0 = ((iy % period) + period) % period;
  const x1 = (x0 + 1) % period;
  const y1 = (y0 + 1) % period;
  const a = hash2(x0, y0);
  const b = hash2(x1, y0);
  const c = hash2(x0, y1);
  const d = hash2(x1, y1);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}

/** 可平铺分形噪声（保证贴图无缝） */
function fbm2p(x, y, period, oct = 4) {
  let v = 0, amp = 0.5, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) {
    v += amp * noise2p(x * f, y * f, period * f);
    norm += amp;
    f *= 2;
    amp *= 0.5;
  }
  return v / norm;
}

/* =========================================================================
 * 5. 地形高度场
 *    所有地面高度/植被撒点/水洼水位都走这两个函数，保证一致。
 * ========================================================================= */

/** 沿 Z 的剖面高度：Catmull-Rom（Hermite）插值，保证坡面平滑 */
function profileHeight(z) {
  const P = PROFILE;
  if (z <= P[0][0]) return P[0][1];
  if (z >= P[P.length - 1][0]) return P[P.length - 1][1];

  let i = 0;
  while (i < P.length - 2 && z > P[i + 1][0]) i++;

  const p0 = P[Math.max(0, i - 1)];
  const p1 = P[i];
  const p2 = P[i + 1];
  const p3 = P[Math.min(P.length - 1, i + 2)];

  const span = p2[0] - p1[0];
  const t = (z - p1[0]) / span;
  const t2 = t * t;
  const t3 = t2 * t;

  const h00 = 2 * t3 - 3 * t2 + 1;
  const h10 = t3 - 2 * t2 + t;
  const h01 = -2 * t3 + 3 * t2;
  const h11 = t3 - t2;

  // 非均匀 Catmull-Rom 切线
  const m1 = ((p2[1] - p0[1]) / (p2[0] - p0[0])) * span;
  const m2 = ((p3[1] - p1[1]) / (p3[0] - p1[0])) * span;

  return h00 * p1[1] + h10 * m1 + h01 * p2[1] + h11 * m2;
}

/**
 * 地形基准高度（纯自然地形，不含工事）。
 * 结构：基准剖面 → 内陆丘陵 → 后缘/侧缘抬升 → 沙滩冲刷沟壑/沙纹
 *      → 水洼碗形凹陷 → 海床下压
 */
function terrainBase(x, z) {
  // ---- 基准剖面 ----
  let h = profileHeight(z);

  // ---- 内陆丘陵（-20 之后逐渐出现，后缘更强） ----
  const inlandFade = smoothstep(-16, -52, z);          // z=-16 → 0，z=-52 → 1
  const dune = fbm2(x * 0.013, z * 0.011, 4);          // 大尺度起伏
  h += inlandFade * (dune - 0.5) * 9.5;
  // 一条条横向沙丘脊
  h += inlandFade * Math.sin(x * 0.043 + fbm2(x * 0.02, z * 0.02, 2) * 5.0) * 0.85;

  // ---- 边界扰动：四边轮廓不再是一条直线 ----
  // wob 同时作用于"沙丘屏障位置"和"边缘下坠起点"，让轮廓呈现
  // 沙丘嘴 / 水湾 / 草坡那种自然凸凹（±15m 量级，波长约 60m）
  const wob = (fbm2(x * 0.016 + 11.3, z * 0.016 - 4.7, 3) - 0.5) * 30.0;

  // ---- 后缘：一排 6~10m 高的沙丘屏障（挡住内陆边界），带噪声起伏 ----
  // 沙丘脊线后移到 z≈-62~-86：把 z -62 以南留给后方营地，坡才够缓
  const backRim = smoothstep(-62, -86, z + wob * 0.55);
  h += backRim * backRim * (5.2 + 4.0 * fbm2(x * 0.021 + 5.5, z * 0.021, 2));

  // ---- 边缘下坠：最后 20m 缓慢沉下去，不做垂直切断 ----
  // 左右：向两侧沉入水下，海岸线自然收窄（内陆侧强度减半，避免出现深沟）
  const dSide = (BOUNDS.maxX - Math.abs(x)) - wob * 0.45;
  const sideAmp = 6.4 * (1 - smoothstep(-52, -18, z) * 0.55);
  h -= (1 - smoothstep(0, 22, dSide)) * sideAmp;
  // 内陆后缘：最后 9m 掉下去，断面交给裙边 + 雾
  const dBack = (z - BOUNDS.minZ) - wob * 0.55;
  h -= (1 - smoothstep(0, 9, dBack)) * 4.8;
  // 海侧远端：再压深一点，让海面完整盖住地形
  const dSea = (BOUNDS.maxZ - z);
  h -= (1 - smoothstep(0, 26, dSea)) * 3.0;

  // ---- 沙滩细节：冲刷沟壑、沙纹、沿岸沟槽、泄水沟 ----
  const beach = smoothstep(-34, -8, z) * (1 - smoothstep(20, 34, z));
  if (beach > 0.001) {
    // 冲刷沟壑（低频噪声拉扯，形成深浅不一的湿痕）
    h += beach * (fbm2(x * 0.135, z * 0.26, 3) - 0.5) * 0.72;
    // 平行岸线的细沙纹
    h += beach * Math.sin(z * 2.6 + fbm2(x * 0.05, z * 0.05, 2) * 3.4) * 0.042;
    // 沿岸浅沟槽（潮水退去留下的那条低洼带）
    h -= beach * Math.exp(-Math.pow((z - 12.5) / 2.4, 2)) * 0.30;
    // 垂直于岸线的泄水沟（每 ~24m 一条）
    const groove = Math.sin(x * 0.26 + fbm2(x * 0.03, 0, 2) * 6.0);
    h -= beach * Math.pow(Math.max(0, groove), 6) * 0.5;
  }

  // ---- 潮池：碗形凹陷 ----
  for (let i = 0; i < TIDE_POOLS.length; i++) {
    const p = TIDE_POOLS[i];
    const dx = (x - p[0]) / p[2];
    const dz = (z - p[1]) / p[2];
    const dd = Math.sqrt(dx * dx + dz * dz);
    if (dd < 1.2) {
      const bowl = Math.max(0, 1 - dd * dd);
      h -= p[3] * bowl * bowl;
    }
  }

  // ---- 海床：确保水下足够深，避免露出地形 ----
  h -= smoothstep(18, 46, z) * 2.2;

  // ---- 极细颗粒感（很轻微，只影响近景） ----
  h += (fbm2(x * 0.5, z * 0.5, 2) - 0.5) * 0.05;

  return h;
}

/**
 * 地形遮罩：grass = 草地覆盖度，wet = 湿度（湿沙/水线）
 * 顶点色与植被撒点共用，保证视觉一致。
 */
function terrainMasks(x, z, h) {
  // --- 草地：干沙→草坡这一段，成片分布 ---
  const band = smoothstep(-2, -20, z) * (1 - smoothstep(-46, -68, z));
  const patchBig = fbm2(x * 0.042, z * 0.042, 3);
  const patchSmall = fbm2(x * 0.155, z * 0.155, 2);
  const patch = patchBig * 0.72 + patchSmall * 0.28;
  let grass = band * smoothstep(0.40, 0.68, patch);
  // 太陡/太高的地方草少一点
  grass *= 1 - smoothstep(6.0, 9.5, h) * 0.5;
  grass = clamp(grass, 0, 1);

  // --- 湿度：越低越湿，近岸更湿，水洼周围一圈 ---
  // 湿沙：只在紧贴水线的低处出现（高度 + 离岸距离双重收敛），
  // 否则整片低滩都会被判成湿沙，远看是一块块棕色泥斑
  let wet = smoothstep(0.55, 0.02, h);
  wet = clamp(wet + smoothstep(9, 24, z) * 0.20, 0, 1);
  for (let i = 0; i < TIDE_POOLS.length; i++) {
    const p = TIDE_POOLS[i];
    const dx = (x - p[0]) / p[2];
    const dz = (z - p[1]) / p[2];
    const dd = Math.sqrt(dx * dx + dz * dz);
    if (dd < 1.8) wet = Math.max(wet, 1 - smoothstep(1.0, 1.8, dd) * 0.85);
  }
  wet *= 1 - grass;   // 草地不显示湿沙

  return { grass, wet };
}

/* =========================================================================
 * 6. createOcean —— 海面
 *    自定义非均匀网格（近处密、远处疏），顶点波浪 + 片元泡沫/雾
 * ========================================================================= */

/** 生成一维坐标：核心区均匀细分，向两侧按 growth 指数发散到地平线 */
function makeAxis(coreMin, coreMax, coreStep, farMax, growth) {
  const arr = [];
  const n = Math.round((coreMax - coreMin) / coreStep);
  for (let i = 0; i <= n; i++) arr.push(coreMin + i * coreStep);

  let step = coreStep;
  let v = coreMin;
  while (v > -farMax && arr.length < 2000) {
    step *= growth;
    v -= step;
    arr.unshift(v);
  }
  step = coreStep;
  v = coreMax;
  while (v < farMax && arr.length < 2000) {
    step *= growth;
    v += step;
    arr.push(v);
  }
  return arr;
}

/** 海面网格：X 覆盖 ±150 核心区，Z 覆盖 -45 ~ 170，再向远方发散 */
function createWaterGeometry() {
  const xs = makeAxis(-150, 150, 3.0, 2800, 1.19);
  const zs = makeAxis(-45, 170, 3.0, 2600, 1.15);

  const nx = xs.length;
  const nz = zs.length;
  const positions = new Float32Array(nx * nz * 3);
  let p = 0;
  for (let j = 0; j < nz; j++) {
    for (let i = 0; i < nx; i++) {
      positions[p++] = xs[i];
      positions[p++] = 0;
      positions[p++] = zs[j];
    }
  }

  const index = [];
  for (let j = 0; j < nz - 1; j++) {
    for (let i = 0; i < nx - 1; i++) {
      const a = j * nx + i;
      const b = a + 1;
      const c = a + nx;
      const d = c + 1;
      index.push(a, c, b, b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setIndex(index);
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(0, 0, 0), 4000);
  return geo;
}

/** 地形最终高度 = 自然地形 + 防御工事开挖（碉堡基座 / 楼梯井 / 战壕） */
function terrainHeight(x, z) {
  return applyExcavation(x, z, terrainBase(x, z));
}

function createOcean() {
  const day = PALETTE.day;

  const uniforms = {
    uTime: { value: 0 },
    uShallow: { value: new THREE.Color(day.waterShallow) },
    uDeep: { value: new THREE.Color(day.waterDeep) },
    uFoamColor: { value: new THREE.Color(day.foam) },
    uSkyColor: { value: new THREE.Color(day.horizon) },
    uSunColor: { value: new THREE.Color(day.sunColor) },
    uSunDir: { value: day.sunDir.clone().normalize() },
    uFogColor: { value: new THREE.Color(day.fog) },
    uFogDensity: { value: day.fogDensity },
    uFoamStrength: { value: 0.72 },
    uNight: { value: 0 }
  };

  const vertexShader = /* glsl */`
    uniform float uTime;
    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vViewDepth;

    void main() {
      vec3 p = position;

      // 近岸抑制：靠岸浪高衰减，避免浪穿进沙滩
      float shoreFade = mix(0.05, 1.0, smoothstep(10.0, 90.0, p.z));

      // 四层方向波叠加
      vec2 dirs[4];
      dirs[0] = normalize(vec2(0.82, 0.57));
      dirs[1] = normalize(vec2(0.55, -0.83));
      dirs[2] = normalize(vec2(0.97, 0.24));
      dirs[3] = normalize(vec2(0.38, 0.92));

      float amps[4];
      amps[0] = 0.34; amps[1] = 0.22; amps[2] = 0.13; amps[3] = 0.07;

      float freqs[4];
      freqs[0] = 0.055; freqs[1] = 0.081; freqs[2] = 0.142; freqs[3] = 0.235;

      float speeds[4];
      speeds[0] = 1.05; speeds[1] = 1.32; speeds[2] = 1.90; speeds[3] = 2.50;

      float h = 0.0;
      vec2 grad = vec2(0.0);
      for (int i = 0; i < 4; i++) {
        float k = freqs[i];
        float phase = dot(dirs[i], p.xz) * k - uTime * speeds[i];
        h += amps[i] * sin(phase);
        // 解析法线：对 h 求方向导数
        grad += amps[i] * k * cos(phase) * dirs[i];
      }

      h *= shoreFade;
      grad *= shoreFade;
      p.y += h - 0.07;   // 整体略低于 0，避免水面与沙滩互相穿插

      vec3 n = normalize(vec3(-grad.x, 1.0, -grad.y));
      vNormalW = n;

      vec4 world = modelMatrix * vec4(p, 1.0);
      vWorldPos = world.xyz;

      vec4 mv = viewMatrix * world;
      vViewDepth = -mv.z;

      gl_Position = projectionMatrix * mv;
    }
  `;

  const fragmentShader = /* glsl */`
    uniform float uTime;
    uniform vec3 uShallow;
    uniform vec3 uDeep;
    uniform vec3 uFoamColor;
    uniform vec3 uSkyColor;
    uniform vec3 uSunColor;
    uniform vec3 uSunDir;
    uniform vec3 uFogColor;
    uniform float uFogDensity;
    uniform float uFoamStrength;
    uniform float uNight;

    varying vec3 vWorldPos;
    varying vec3 vNormalW;
    varying float vViewDepth;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fbm2(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 4; i++) {
        v += a * vnoise(p);
        p = p * 2.03 + vec2(13.7, 7.1);
        a *= 0.5;
      }
      return v;
    }

    // 岸线：与地形岸线形状对齐的水线（z 越大越靠海）
    float shoreLine(float x) {
      return 15.5 + sin(x * 0.042) * 1.9 + sin(x * 0.107 + 1.7) * 0.8 + sin(x * 0.019 + 4.0) * 2.3;
    }

    void main() {
      // 水面是铺满全图的一个大平面，地台下面是空的（坑道、碉堡内部），
      // 所以陆地投影范围内的水面要丢掉，否则会像一层水膜切进地下室。
      if (abs(vWorldPos.x) < 118.0 && vWorldPos.z < 3.0) discard;

      vec3 V = normalize(cameraPosition - vWorldPos);
      vec3 N = normalize(vNormalW);
      float d = vWorldPos.z - shoreLine(vWorldPos.x);   // 到岸线的距离（>0 = 海里）

      // ---- 基础水色：近岸浅青 → 远海深蓝 ----
      float shallow = 1.0 - smoothstep(-2.0, 48.0, d);
      vec3 col = mix(uDeep, uShallow, pow(shallow, 1.15));

      // ---- 天空反射（菲涅尔）----
      float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 5.0);
      col = mix(col, uSkyColor * vec3(0.92, 0.98, 1.04), clamp(fres * 0.40, 0.0, 1.0));

      // ---- 太阳/月亮高光 ----
      vec3 H = normalize(uSunDir + V);
      float spec = pow(max(dot(N, H), 0.0), 220.0);
      col += uSunColor * spec * mix(3.0, 0.85, uNight);

      // ---- 细碎波纹反光 ----
      float ripple = fbm2(vWorldPos.xz * 0.7 + vec2(uTime * 0.09, -uTime * 0.06));
      float glint = pow(max(ripple - 0.55, 0.0) * 2.6, 3.0);
      col += uSunColor * glint * 0.14;

      // ---- 泡沫：近岸冲刷带 + 水线细条 + 外海浪峰 ----
      float bigNoise = fbm2(vWorldPos.xz * 0.18 + vec2(uTime * 0.05, 0.0));   // 大块明暗，决定泡沫断在哪
      float bandMask = smoothstep(-5.0, -1.0, d) * (1.0 - smoothstep(3.0, 7.5, d));
      float pulse    = 0.5 + 0.5 * sin(d * 0.55 - uTime * 1.5 + bigNoise * 8.0);
      float surfFoam = bandMask * smoothstep(0.35, 0.95, pulse * 0.75 + bigNoise * 0.45);

      float detail    = fbm2(vWorldPos.xz * 1.35 + vec2(uTime * 0.16, uTime * 0.07));
      float waterline = smoothstep(-1.1, 0.2, d) * (1.0 - smoothstep(0.2, 1.8, d));  // 水线那一细条
      // 高频噪声把泡沫打碎成蕾丝状，避免糊成一整片白
      float lace = smoothstep(0.24, 0.66, detail);
      surfFoam = clamp(surfFoam * lace * 1.15 + waterline * 0.32, 0.0, 1.0);

      float crest     = smoothstep(0.66, 0.94, fbm2(vWorldPos.xz * 0.30 - vec2(0.0, uTime * 0.04)));
      float crestFoam = crest * 0.12 * smoothstep(30.0, 80.0, d);

      float foam = clamp((surfFoam * 0.62 + crestFoam) * uFoamStrength, 0.0, 1.0);
      col = mix(col, uFoamColor, foam);

      // ---- 透明度：近岸透一点，远处不透明 ----
      float alpha = mix(0.80, 1.0, smoothstep(-2.0, 40.0, d));
      alpha = max(alpha, foam);

      // ---- 与场景 FogExp2 保持一致的手写雾 ----
      float fogFactor = 1.0 - exp(-pow(uFogDensity * vViewDepth, 2.0));
      col = mix(col, uFogColor, clamp(fogFactor, 0.0, 1.0));

      gl_FragColor = vec4(col, alpha);

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `;

  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader,
    transparent: true,
    depthWrite: true,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(createWaterGeometry(), mat);
  mesh.name = 'ocean';
  mesh.frustumCulled = false;   // 网格很大，跳过视锥剔除
  mesh.receiveShadow = false;
  mesh.renderOrder = 2;

  state.uniforms.ocean = uniforms;
  state.materials.ocean = mat;
  state.oceanMesh = mesh;

  state.groups.ocean = mesh;
  return mesh;
}

/* =========================================================================
 * 7. createSky —— 渐变天空球 + 程序化薄云 + 星空
 * ========================================================================= */
function createSky() {
  const day = PALETTE.day;
  const group = new THREE.Group();
  group.name = 'sky';

  const uniforms = {
    uZenith: { value: new THREE.Color(day.zenith) },
    uHorizon: { value: new THREE.Color(day.horizon) },
    uSunDir: { value: day.sunDir.clone().normalize() },
    uSunColor: { value: new THREE.Color(day.sunColor) },
    uCloudColor: { value: new THREE.Color(day.cloud) },
    uCloudCover: { value: day.cloudCover },
    uNight: { value: 0 },
    uSunDisc: { value: 1 },
    uMoonDisc: { value: 0 },
    uTime: { value: 0 }
  };

  const vertexShader = /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `;

  const fragmentShader = /* glsl */`
    uniform vec3 uZenith;
    uniform vec3 uHorizon;
    uniform vec3 uSunDir;
    uniform vec3 uSunColor;
    uniform vec3 uCloudColor;
    uniform float uCloudCover;
    uniform float uNight;
    uniform float uSunDisc;
    uniform float uMoonDisc;
    uniform float uTime;

    varying vec3 vDir;

    float hash21(vec2 p) {
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p) {
      vec2 i = floor(p);
      vec2 f = fract(p);
      vec2 u = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
    }
    float fbm2(vec2 p) {
      float v = 0.0;
      float a = 0.5;
      for (int i = 0; i < 5; i++) {
        v += a * vnoise(p);
        p = p * 2.03 + vec2(11.3, 5.7);
        a *= 0.5;
      }
      return v;
    }

    void main() {
      vec3 dir = normalize(vDir);
      float h = dir.y;

      // ---- 天空渐变：地平线 → 天顶 ----
      float t = pow(clamp(h, 0.0, 1.0), 0.45);
      vec3 col = mix(uHorizon, uZenith, t);
      // 地平线以下稍微压暗，和海平线自然衔接
      col = mix(col, uHorizon * 0.92, smoothstep(0.0, -0.10, h) * 0.85);

      // ---- 太阳盘 + 光晕 ----
      float sd = max(dot(dir, uSunDir), 0.0);
      float sunDisc = pow(sd, 900.0) * 14.0 * uSunDisc;
      float sunGlow = (pow(sd, 40.0) * 0.50 + pow(sd, 6.0) * 0.028) * uSunDisc;
      col += uSunColor * (sunDisc + sunGlow);

      // ---- 月亮盘（夜里在反方向）----
      float md = max(dot(dir, -uSunDir), 0.0);
      float moonDisc = pow(md, 900.0) * 9.0 * uMoonDisc;
      float moonGlow = pow(md, 48.0) * 0.16 * uMoonDisc;
      col += vec3(0.72, 0.80, 1.0) * (moonDisc + moonGlow);

      // ---- 薄云：视线方向投影到高空平面 ----
      // 注意：投影坐标必须钳制，否则贴近地平线时 uv 会爆掉，整片天空糊成灰白
      float upFactor = smoothstep(0.10, 0.44, h);
      vec2 cp = clamp(dir.xz / max(h, 0.15), vec2(-64.0), vec2(64.0));
      float cloudNoise = fbm2(cp * 0.85 + vec2(uTime * 0.004, uTime * 0.002));
      float cover = smoothstep(uCloudCover, uCloudCover + 0.30, cloudNoise) * upFactor;
      // 细节层：云体内部亮、边缘压暗，靠近太阳的一侧再提亮
      float cloudDetail = fbm2(cp * 2.6 - vec2(uTime * 0.006, 0.0));
      float lit = clamp(0.52 + cloudDetail * 0.78 + sd * 0.45, 0.0, 1.35);
      col = mix(col, uCloudColor * lit, cover * 0.68);

      // ---- 地平线收口：贴近海平线时与雾色完全对齐，保证海天无缝 ----
      float hz = smoothstep(0.09, 0.0, abs(h));
      col = mix(col, uHorizon, hz * 0.9);

      gl_FragColor = vec4(col, 1.0);

      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `;

  const mat = new THREE.ShaderMaterial({
    uniforms,
    vertexShader,
    fragmentShader,
    side: THREE.BackSide,
    depthWrite: false,
    depthTest: false,
    fog: false
  });

  const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(5200, 32, 24), mat);
  skyMesh.name = 'sky-dome';
  skyMesh.frustumCulled = false;
  skyMesh.renderOrder = -2;
  group.add(skyMesh);

  state.uniforms.sky = uniforms;
  state.skyMesh = skyMesh;

  // ---- 星空 ----
  group.add(createStarField());

  state.groups.sky = group;
  return group;
}

/** 星空：球面随机撒点，只保留上半球 */
/** 星星用的圆形柔光贴图（不然 PointsMaterial 画出来是方块） */
function makeStarSprite(size = 32) {
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const grd = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grd.addColorStop(0.0, 'rgba(255,255,255,1)');
  grd.addColorStop(0.35, 'rgba(255,255,255,0.85)');
  grd.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, size, size);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function createStarField() {
  const count = 1800;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const rand = mulberry32(773311);
  const col = new THREE.Color();

  let n = 0;
  while (n < count) {
    // 均匀球面采样后只要上半球
    const u = rand() * 2 - 1;
    const theta = rand() * Math.PI * 2;
    const y = Math.abs(u);
    const r = Math.sqrt(Math.max(0, 1 - y * y));
    const x = Math.cos(theta) * r;
    const z = Math.sin(theta) * r;
    if (y < 0.03) continue;

    const R = 4600;
    positions[n * 3] = x * R;
    positions[n * 3 + 1] = y * R;
    positions[n * 3 + 2] = z * R;

    // 星星颜色：偏蓝白，少量偏暖
    const warm = rand();
    col.setHSL(warm < 0.15 ? 0.08 : 0.58, 0.25 + rand() * 0.35, 0.72 + rand() * 0.25);
    const bright = 0.5 + rand() * 0.5;
    colors[n * 3] = col.r * bright;
    colors[n * 3 + 1] = col.g * bright;
    colors[n * 3 + 2] = col.b * bright;
    n++;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

  const mat = new THREE.PointsMaterial({
    size: 2.6,
    map: makeStarSprite(),
    alphaTest: 0.02,
    sizeAttenuation: false,
    vertexColors: true,
    transparent: true,
    opacity: 0,
    depthWrite: false,
    depthTest: false,
    fog: false
  });

  const points = new THREE.Points(geo, mat);
  points.name = 'star-field';
  points.frustumCulled = false;
  points.renderOrder = -1;

  state.starField = points;
  state.materials.stars = mat;
  return points;
}

/* =========================================================================
 * 8. 程序化纹理
 *    全部用 Canvas 生成，不依赖任何外部图片。
 * ========================================================================= */

/**
 * 沙滩细节纹理。
 * 关键：这只是一张"明暗调制图"（均值≈1 的灰白图），颜色全部由顶点色提供。
 * 这样贴图重复时不会出现色块拼贴，也不会把沙滩压成泥。
 */
function makeSandTexture(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;
  const rand = mulberry32(20240517);

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;

      const patch = fbm2p(u * 6, v * 6, 6, 3);            // 大尺度风蚀斑
      const mid = fbm2p(u * 24, v * 24, 24, 2);           // 中尺度沙粒团
      const grain = noise2p(u * 128, v * 128, 128);       // 细颗粒（沙粒）

      // 亮度围绕 1.0 小幅波动 → 只有质感，没有色偏
      const lum = 0.94 + (patch - 0.5) * 0.10 + (mid - 0.5) * 0.08 + (grain - 0.5) * 0.12;
      const c = Math.round(clamp(lum, 0.70, 1.04) * 250);

      const i = (y * size + x) * 4;
      data[i] = c;
      data[i + 1] = Math.round(c * 0.985);
      data[i + 2] = Math.round(c * 0.96);
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // 贝壳碎屑：细小亮点
  for (let i = 0; i < 420; i++) {
    const x = rand() * size, y = rand() * size;
    const rr = 0.5 + rand() * 1.2;
    ctx.beginPath();
    ctx.arc(x, y, rr, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 253, 248, ${(0.35 + rand() * 0.5).toFixed(2)})`;
    ctx.fill();
  }
  // 深色碎石/暗沙粒
  for (let i = 0; i < 900; i++) {
    const x = rand() * size, y = rand() * size;
    ctx.beginPath();
    ctx.arc(x, y, 0.4 + rand(), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(122, 110, 94, ${(0.10 + rand() * 0.22).toFixed(2)})`;
    ctx.fill();
  }

  return finishTexture(canvas);
}

/**
 * 草地细节纹理：同样是明暗调制图，纵向拉长的条纹模拟草叶走向。
 */
function makeGrassTexture(size = 512) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  const data = img.data;

  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;

      // 纵向拉长：u 频率高、v 频率低 → 竖向条纹
      const streak = fbm2p(u * 26, v * 4, 26, 3);
      const clump = fbm2p(u * 7, v * 7, 7, 2);
      const grain = noise2p(u * 110, v * 110, 110);

      const lum = 0.90 + (streak - 0.5) * 0.30 + (clump - 0.5) * 0.10 + (grain - 0.5) * 0.12;
      const c = Math.round(clamp(lum, 0.55, 1.06) * 250);

      const i = (y * size + x) * 4;
      data[i] = c;
      data[i + 1] = c;
      data[i + 2] = Math.round(c * 0.97);
      data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  return finishTexture(canvas);
}

/** 统一纹理收尾：重复包裹 + sRGB + 各向异性 */
function finishTexture(canvas) {
  const tex = new THREE.CanvasTexture(canvas);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = state.maxAniso || 4;
  tex.needsUpdate = true;
  return tex;
}

/* =========================================================================
 * 9. createTerrain —— 地形本体 + 裙边
 * ========================================================================= */
function createTerrain() {
  const group = new THREE.Group();
  group.name = 'terrain';

  const width = BOUNDS.maxX - BOUNDS.minX;   // 240
  const depth = BOUNDS.maxZ - BOUNDS.minZ;   // 180
  // 400 × 300 段 → 约 12 万顶点，0.6m 网格，足够表现沙滩细节
  const segX = 400;
  const segZ = 300;
  const geo = new THREE.PlaneGeometry(width, depth, segX, segZ);
  geo.rotateX(-Math.PI / 2);                 // 平面躺平，法线朝上

  const pos = geo.attributes.position;
  const count = pos.count;
  const colors = new Float32Array(count * 3);
  const aGrass = new Float32Array(count);
  const aWet = new Float32Array(count);

  // 顶点色板
  const cSandDry = new THREE.Color(0xe0c79c);   // 干沙
  const cSandWet = new THREE.Color(0x9c8a6e);   // 湿沙
  const cSandDeep = new THREE.Color(0x5f5b47);  // 海床/深水沙
  const cGrass = new THREE.Color(0x67763f);     // 草
  const cGrassDry = new THREE.Color(0x9a9663);  // 干草
  const cScrub = new THREE.Color(0x616b45);     // 灌木/苔痕

  const col = new THREE.Color();
  const grassCol = new THREE.Color();
  // 远端顶点色向"雾色中性值"插值：day 雾偏蓝、night 雾偏黑，取中避免夜里泛蓝
  const cHaze = new THREE.Color(0x647687);

  for (let i = 0; i < count; i++) {
    const x = pos.getX(i);
    const z = pos.getZ(i);
    const h = terrainHeight(x, z);
    pos.setY(i, h);

    const m = terrainMasks(x, z, h);
    aGrass[i] = m.grass;
    aWet[i] = m.wet;

    // --- 顶点色 ---
    // 1) 干沙 → 湿沙
    col.copy(cSandDry).lerp(cSandWet, m.wet * 0.62);
    // 2) 水下沙
    if (h < -0.4) col.lerp(cSandDeep, smoothstep(-0.4, -3.6, h) * 0.9);
    // 3) 草地（带干枯斑块）
    if (m.grass > 0.01) {
      grassCol.copy(cGrass).lerp(cGrassDry, fbm2(x * 0.09, z * 0.09, 2) * 0.85);
      col.lerp(grassCol, smoothstep(0.05, 0.9, m.grass) * 0.92);
    }
    // 4) 高处偏干枯 / 苔痕
    col.lerp(cScrub, smoothstep(4.2, 7.6, h) * 0.35);
    // 4.5) 战壕/开挖处压暗：沟底是阴影里的湿土，给一点深度感
    const cutDepth = Math.max(0, terrainBase(x, z) - h);
    if (cutDepth > 0.02) {
      col.lerp(cSandWet, clamp(cutDepth / 2.2, 0, 1) * 0.55);
      col.multiplyScalar(1 - clamp(cutDepth / 2.2, 0, 1) * 0.42);
    }
    // 5) 细噪声明暗，打散大面积纯色
    const shade = 0.93 + fbm2(x * 0.55, z * 0.55, 2) * 0.14;
    col.multiplyScalar(shade);
    // 6) 远端向雾色插值（配合 FogExp2，消除地平线色带）
    const rPlan = Math.sqrt(x * x + z * z);
    col.lerp(cHaze, smoothstep(92, 158, rPlan) * 0.5);

    colors[i * 3] = col.r;
    colors[i * 3 + 1] = col.g;
    colors[i * 3 + 2] = col.b;
  }

  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  geo.setAttribute('aGrass', new THREE.BufferAttribute(aGrass, 1));
  geo.setAttribute('aWet', new THREE.BufferAttribute(aWet, 1));
  geo.computeVertexNormals();

  // --- 材质：顶点色 × 双程序化纹理（沙 / 草），按 aGrass 混合 ---
  const sandTex = (state.textures.sand = makeSandTexture(512));
  const grassTex = (state.textures.grass = makeGrassTexture(512));

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 0.95,
    metalness: 0.0,
    dithering: true
  });

  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uSandMap = { value: sandTex };
    shader.uniforms.uGrassMap = { value: grassTex };

    shader.vertexShader = shader.vertexShader
      .replace(
        '#include <common>',
        `#include <common>
        attribute float aGrass;
        attribute float aWet;
        varying float vGrass;
        varying float vWet;
        varying vec2 vUvSand;
        varying vec2 vUvGrass;`
      )
      .replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        vGrass = aGrass;
        vWet = aWet;
        // 用世界坐标（网格无变换）投影 UV，避免拉伸与接缝
        vUvSand  = transformed.xz * 0.19;
        vUvGrass = transformed.xz * 0.33;`
      );

    shader.fragmentShader = shader.fragmentShader
      .replace(
        '#include <common>',
        `#include <common>
        uniform sampler2D uSandMap;
        uniform sampler2D uGrassMap;
        varying float vGrass;
        varying float vWet;
        varying vec2 vUvSand;
        varying vec2 vUvGrass;`
      )
      .replace(
        '#include <map_fragment>',
        `#include <map_fragment>
        {
          vec3 sandCol  = texture2D(uSandMap, vUvSand).rgb;
          vec3 grassCol = texture2D(uGrassMap, vUvGrass).rgb;
          // 草区把它压到沙色亮度附近，避免两种纹理明暗差太大
          float blend = smoothstep(0.05, 0.85, vGrass);
          vec3 ground = mix(sandCol, grassCol, blend);
          // 再用同一张图取一次大尺度样本，打散 5m 左右的贴图重复感
          float macro = texture2D(uSandMap, vUvSand * 0.21 + vec2(0.37, 0.11)).r;
          ground *= mix(0.90, 1.10, macro);
          // 细节贴图均值 < 1，这里补偿一点，保持顶点色的明度
          diffuseColor.rgb *= ground * 1.08;
        }`
      )
      .replace(
        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
        // 湿沙的镜面感本轮先不做：没有环境贴图时，降低粗糙度会让太阳高光在
        // 掠射角下烧成一整片白（看着像雪）。湿润感只靠顶点色表达，下一轮接
        // envMap 后再把 roughness 压下来补湿润反光。
        roughnessFactor = roughnessFactor;`
      );
  };
  // 让 three 认为这是不同程序，避免与其它材质共用编译缓存
  mat.customProgramCacheKey = () => 'coastal-terrain-v1';

  state.materials.terrain = mat;

  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'terrain-ground';
  mesh.receiveShadow = true;
  mesh.castShadow = false;
  group.add(mesh);
  state.terrainMesh = mesh;

  // 把高度/遮罩函数挂到 state，供植被、装备放置使用
  state.terrainHeightAt = terrainHeight;
  state.terrainMasksAt = terrainMasks;

  // --- 地台裙边：沿四条边向下垂，避免露出"纸片断崖" ---
  group.add(createSkirt());

  state.groups.terrain = group;
  return group;
}

/** 地台裙边：四条边向下延伸成"土层侧壁" */
function createSkirt() {
  const topColor = new THREE.Color(0x9a8a6c);
  // 底部贴近雾色（不是纯黑）：从任何角度往下看都是"雾里的暗色侧壁"
  const bottomColor = new THREE.Color(0x8b7d63);
  const depth = 2.2;
  const positions = [];
  const colors = [];

  /** 生成一条边的侧壁 */
  function addStrip(a, b, steps) {
    for (let i = 0; i < steps; i++) {
      const t0 = i / steps;
      const t1 = (i + 1) / steps;

      const x0 = lerp(a.x, b.x, t0), z0 = lerp(a.z, b.z, t0);
      const x1 = lerp(a.x, b.x, t1), z1 = lerp(a.z, b.z, t1);
      const y0 = terrainHeight(x0, z0);
      const y1 = terrainHeight(x1, z1);

      // 两个三角形组成一个四边形
      const quad = [
        [x0, y0, z0, 1], [x1, y1, z1, 1], [x1, y1 - depth, z1, 0],
        [x0, y0, z0, 1], [x1, y1 - depth, z1, 0], [x0, y0 - depth, z0, 0]
      ];
      for (const q of quad) {
        positions.push(q[0], q[1], q[2]);
        const c = topColor.clone().lerp(bottomColor, 1 - q[3]);
        colors.push(c.r, c.g, c.b);
      }
    }
  }

  // 注意绕序：从地台外侧看要是正面
  addStrip({ x: BOUNDS.minX, z: BOUNDS.minZ }, { x: BOUNDS.minX, z: BOUNDS.maxZ }, 90); // 西
  addStrip({ x: BOUNDS.maxX, z: BOUNDS.maxZ }, { x: BOUNDS.maxX, z: BOUNDS.minZ }, 90); // 东
  addStrip({ x: BOUNDS.maxX, z: BOUNDS.minZ }, { x: BOUNDS.minX, z: BOUNDS.minZ }, 90); // 北(-Z)
  addStrip({ x: BOUNDS.minX, z: BOUNDS.maxZ }, { x: BOUNDS.maxX, z: BOUNDS.maxZ }, 90); // 南(+Z)

  // 底封口：裙边下垂 30m 后封一块地板，任何角度都看不到"下面是空的"
  const capColor = bottomColor.clone();
  // 底板放在 -24m（比边缘低很多），只用来堵住"地台下面是空的"这条缝
  const CY = -24.0;
  const cx0 = BOUNDS.minX - 6, cx1 = BOUNDS.maxX + 6;
  const cz0 = BOUNDS.minZ - 6, cz1 = BOUNDS.maxZ + 6;
  const cap = [
    [cx0, CY, cz0], [cx1, CY, cz0], [cx1, CY, cz1],
    [cx0, CY, cz0], [cx1, CY, cz1], [cx0, CY, cz1]
  ];
  for (const q of cap) {
    positions.push(q[0], q[1], q[2]);
    colors.push(capColor.r, capColor.g, capColor.b);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    vertexColors: true,
    roughness: 1.0,
    metalness: 0.0,
    side: THREE.DoubleSide
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'terrain-skirt';
  mesh.receiveShadow = true;
  return mesh;
}

/* =========================================================================
 * 10. 环境装饰：灌木 / 草丛 / 岩石 / 潮池水洼
 *     全部按地形遮罩撒点，装备可以放心放在空地（grass 低）上。
 * ========================================================================= */
// ---------------------------------------------------------------------------
// 9.5 外圈裙边地形（低多边形 apron）
//   让陆地越过地台边界继续向外缓降，再由 FogExp2 吃掉 —— 从任何角度都
//   看不到"沙盘切面"。地台内部的顶点压到真实地形以下 2m 隐藏，边界顶点
//   与地形完全接平，所以接缝不可见；三角面约 1.1 万，可忽略。
// ---------------------------------------------------------------------------
function apronHeightAt(x, z) {
  const ex = clamp(x, BOUNDS.minX, BOUNDS.maxX);
  const ez = clamp(z, BOUNDS.minZ, BOUNDS.maxZ);
  const dx = Math.abs(x) - BOUNDS.maxX;
  const dz = z > 0 ? z - BOUNDS.maxZ : (-BOUNDS.minZ) - z;
  const dOut = Math.max(dx, dz);              // 边界上为 0，向外为正
  if (dOut <= 0) return terrainHeight(x, z) - 2.0;   // 内部：藏到地形下面

  const edgeY = terrainHeight(ex, ez);        // 边界上的实际高度（已含边缘衰减）
  const t = clamp(dOut / 270, 0, 1);
  const k = Math.pow(t, 0.75);
  let y = edgeY * (1 - k) + (-27.0) * k;      // 从边界高度缓降到 -27
  // 外圈起伏：不要让坡面是一块斜板（靠边界时淡出，保证接缝连续）
  const nz = fbm2(x * 0.013 + 31.7, z * 0.013 - 12.3, 3) - 0.5;
  y += nz * 13.0 * smoothstep(0, 30, dOut) * (1 - t);
  return y;
}

function createApron() {
  const group = new THREE.Group();
  group.name = 'apron';

  const OUT = 380;      // 外扩范围（再远早就全白，看不到）
  const CELL = 10;      // 10m 一格：能整除 240 × 180，保证 ±120 / ±90 正好落在网格线上
  const xs = [], zs = [];
  for (let x = -OUT; x <= OUT + 0.01; x += CELL) xs.push(x);
  for (let z = -OUT; z <= OUT + 0.01; z += CELL) zs.push(z);

  const NX = xs.length, NZ = zs.length;
  const pos = new Float32Array(NX * NZ * 3);
  const colArr = new Float32Array(NX * NZ * 3);
  const cSand = new THREE.Color(0xd9c69e);
  // 外缘颜色直接过渡到"白天雾/地平线色"，让坡面和天空无缝；夜里靠光照自然变暗
  const cHaze = new THREE.Color(0xb8d2e4);
  const tmp = new THREE.Color();

  let p = 0;
  for (let iz = 0; iz < NZ; iz++) {
    for (let ix = 0; ix < NX; ix++) {
      const x = xs[ix], z = zs[iz];
      const y = apronHeightAt(x, z);
      pos[p] = x; pos[p + 1] = y; pos[p + 2] = z;

      const dx = Math.abs(x) - BOUNDS.maxX;
      const dz = z > 0 ? z - BOUNDS.maxZ : (-BOUNDS.minZ) - z;
      const dOut = Math.max(0, Math.max(dx, dz));
      const near = 1.0 - smoothstep(0, 26, dOut);      // 靠边界处稍亮一点，接地形色
      tmp.copy(cSand).lerp(cHaze, smoothstep(2, 70, dOut));
      tmp.multiplyScalar(0.94 + fbm2(x * 0.05, z * 0.05, 2) * 0.12 + near * 0.03);
      colArr[p] = tmp.r; colArr[p + 1] = tmp.g; colArr[p + 2] = tmp.b;
      p += 3;
    }
  }

  const idx = [];
  for (let iz = 0; iz < NZ - 1; iz++) {
    for (let ix = 0; ix < NX - 1; ix++) {
      const a = iz * NX + ix, b = a + 1, c = a + NX, d = c + 1;
      idx.push(a, c, b, b, c, d);
    }
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
  geo.setIndex(idx);
  geo.computeVertexNormals();

  const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 1.0, metalness: 0.0
  }));
  mesh.receiveShadow = false;
  mesh.castShadow = false;
  group.add(mesh);

  state.groups.apron = group;
  return group;
}

function createProps() {
  const group = new THREE.Group();
  group.name = 'props';
  const rand = mulberry32(314159);
  const dummy = new THREE.Object3D();

  /** 在陆地区域按条件随机取一个落点 */
  function sampleLand(filter, tries = 240) {
    for (let t = 0; t < tries; t++) {
      const x = lerp(BOUNDS.minX + 8, BOUNDS.maxX - 8, rand());
      const z = lerp(BOUNDS.minZ + 10, 16, rand());   // 只在陆地侧取点
      const h = terrainHeight(x, z);
      const m = terrainMasks(x, z, h);
      if (filter(m, h, x, z)) return { x, z, h, m };
    }
    return null;
  }

  // ---------------- 灌木：低矮的团块 ----------------
  const shrubGeo = new THREE.IcosahedronGeometry(1, 0);
  const shrubMat = new THREE.MeshStandardMaterial({
    color: 0x46532f, roughness: 0.94, metalness: 0.0, flatShading: true
  });
  const shrubs = new THREE.InstancedMesh(shrubGeo, shrubMat, 260);
  shrubs.castShadow = true;
  shrubs.receiveShadow = true;
  let shrubCount = 0;
  for (let i = 0; i < 260; i++) {
    const p = sampleLand((m, h) => m.grass > 0.42 && h > 0.5);
    if (!p) break;
    const s = 0.55 + rand() * 1.0;
    dummy.position.set(p.x, p.h + s * 0.32, p.z);
    dummy.rotation.set(0, rand() * Math.PI * 2, 0);
    dummy.scale.set(s * (0.9 + rand() * 0.6), s * (0.5 + rand() * 0.32), s * (0.9 + rand() * 0.6));
    dummy.updateMatrix();
    shrubs.setMatrixAt(shrubCount++, dummy.matrix);
  }
  shrubs.count = shrubCount;
  shrubs.instanceMatrix.needsUpdate = true;
  group.add(shrubs);

  // ---------------- 草丛：几片三角叶片 ----------------
  const grassGeo = makeTuftGeometry();
  const grassMat = new THREE.MeshStandardMaterial({
    color: 0x6b7a42, roughness: 0.95, metalness: 0.0, side: THREE.DoubleSide
  });
  const tufts = new THREE.InstancedMesh(grassGeo, grassMat, 700);
  tufts.receiveShadow = true;
  let tuftCount = 0;
  for (let i = 0; i < 700; i++) {
    const p = sampleLand((m) => m.grass > 0.3);
    if (!p) break;
    dummy.position.set(p.x, p.h, p.z);
    dummy.rotation.set(0, rand() * Math.PI * 2, 0);
    const s = 0.75 + rand() * 0.85;
    dummy.scale.set(s, s * (0.8 + rand() * 0.6), s);
    dummy.updateMatrix();
    tufts.setMatrixAt(tuftCount++, dummy.matrix);
  }
  tufts.count = tuftCount;
  tufts.instanceMatrix.needsUpdate = true;
  group.add(tufts);

  // ---------------- 岩石：岸线附近散落 ----------------
  const rockGeo = new THREE.IcosahedronGeometry(1, 0);
  const rockMat = new THREE.MeshStandardMaterial({
    color: 0xb2ab9c, roughness: 0.9, metalness: 0.0, flatShading: true
  });
  const rocks = new THREE.InstancedMesh(rockGeo, rockMat, 80);
  rocks.castShadow = true;
  rocks.receiveShadow = true;
  let rockCount = 0;
  for (let i = 0; i < 80; i++) {
    const p = sampleLand((m, h) => h > -0.6 && h < 2.6);
    if (!p) break;
    const s = 0.32 + rand() * 0.72;
    dummy.position.set(p.x, p.h + s * 0.08, p.z);
    dummy.rotation.set(rand() * Math.PI, rand() * Math.PI * 2, rand() * Math.PI);
    dummy.scale.set(s * (0.9 + rand() * 0.7), s * (0.55 + rand() * 0.4), s * (0.9 + rand() * 0.7));
    dummy.updateMatrix();
    rocks.setMatrixAt(rockCount++, dummy.matrix);
  }
  rocks.count = rockCount;
  rocks.instanceMatrix.needsUpdate = true;
  group.add(rocks);

  state.groups.props = group;
  return group;
}

/** 一丛草：5 片交叉三角形 */
function makeTuftGeometry() {
  const pos = [];
  for (let b = 0; b < 5; b++) {
    const a = (b / 5) * Math.PI * 2 + 0.35;
    const ox = Math.cos(a) * 0.07;
    const oz = Math.sin(a) * 0.07;
    const hgt = 0.24 + (b % 2) * 0.14;
    const w = 0.03;
    const px = Math.cos(a + Math.PI / 2) * w;
    const pz = Math.sin(a + Math.PI / 2) * w;
    const leanX = Math.cos(a + 0.5) * 0.13;
    const leanZ = Math.sin(a + 0.5) * 0.13;
    // 叶片 1
    pos.push(ox - px, 0, oz - pz, ox + px, 0, oz + pz, ox + leanX * 0.6, hgt, oz + leanZ * 0.6);
    // 叶片 2（更细更高，制造层次）
    pos.push(ox - px * 0.7, 0, oz - pz * 0.7, ox + px * 0.7, 0, oz + pz * 0.7,
      ox + leanX, hgt * 1.15, oz + leanZ);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.computeVertexNormals();
  return geo;
}

/** 潮池水洼：在碗形凹陷上方放一片水面 */
function createPuddles() {
  const group = new THREE.Group();
  group.name = 'puddles';

  // 潮池水面：用自定义 shader 做「菲涅尔反射天空 + 日/月高光 + 微涟漪」，
  // 比 Standard 材质（没有环境反射）像水得多
  const day = PALETTE.day;
  const uniforms = {
    uSky:        { value: new THREE.Color(day.horizon) },
    uDeep:       { value: new THREE.Color(day.waterDeep).lerp(new THREE.Color(day.waterShallow), 0.55) },
    uSunColor:   { value: new THREE.Color(day.sunColor) },
    uSunDir:     { value: day.sunDir.clone().normalize() },
    uFogColor:   { value: new THREE.Color(day.fog) },
    uFogDensity: { value: day.fogDensity },
    uTime:       { value: 0 },
    uNight:      { value: 0 }
  };
  state.uniforms.puddle = uniforms;

  const mat = new THREE.ShaderMaterial({
    uniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      varying vec3 vWorldPos;
      varying float vViewDepth;
      void main() {
        vec4 wp = modelMatrix * vec4(position, 1.0);
        vWorldPos  = wp.xyz;
        vec4 mv    = viewMatrix * wp;
        vViewDepth = -mv.z;
        gl_Position = projectionMatrix * mv;
      }
    `,
    fragmentShader: `
      uniform vec3 uSky;
      uniform vec3 uDeep;
      uniform vec3 uSunColor;
      uniform vec3 uSunDir;
      uniform vec3 uFogColor;
      uniform float uFogDensity;
      uniform float uTime;
      uniform float uNight;
      varying vec3 vWorldPos;
      varying float vViewDepth;

      void main() {
        vec3 V = normalize(cameraPosition - vWorldPos);
        // 两道交叉的正弦当涟漪，扰动法线
        float r1 = sin(vWorldPos.x * 2.9 + uTime * 1.5 + vWorldPos.z * 1.7);
        float r2 = sin(vWorldPos.z * 3.4 - uTime * 1.1 + vWorldPos.x * 1.2);
        vec3 N = normalize(vec3(r1 * 0.05, 1.0, r2 * 0.05));

        float fres = pow(1.0 - clamp(dot(N, V), 0.0, 1.0), 4.0);
        // 掠射角反射天空色要压住，否则平视时整片水洼会变成一块白板
        vec3 col = mix(uDeep, uSky * 0.72, 0.16 + fres * 0.24);

        vec3 H = normalize(uSunDir + V);
        col += uSunColor * pow(max(dot(N, H), 0.0), 300.0) * mix(0.6, 0.35, uNight);

        float fogF = 1.0 - exp(-pow(uFogDensity * vViewDepth, 2.0));
        col = mix(col, uFogColor, clamp(fogF, 0.0, 1.0));

        // 夜里整体压暗，水洼不该在黑沙滩上发光
        col *= mix(1.0, 0.42, uNight);
        gl_FragColor = vec4(col, 0.62);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }
    `
  });

  for (const p of TIDE_POOLS) {
    const [px, pz, pr] = p;

    // 取池沿最低点作为水位，保证水不会溢出
    let level = Infinity;
    for (let i = 0; i < 24; i++) {
      const a = (i / 24) * Math.PI * 2;
      level = Math.min(level, terrainHeight(px + Math.cos(a) * pr * 0.92, pz + Math.sin(a) * pr * 0.92));
    }

    const geo = new THREE.CircleGeometry(pr * 0.78, 32);
    geo.rotateX(-Math.PI / 2);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(px, level - 0.02, pz);
    mesh.receiveShadow = true;
    group.add(mesh);
  }

  state.groups.puddles = group;
  return group;
}

/* =========================================================================
 * 11. 光照与昼夜
 * ========================================================================= */
function createLights() {
  const day = PALETTE.day;
  const group = new THREE.Group();
  group.name = 'lights';

  // 半球光：天空色 → 地面反射色
  const hemi = new THREE.HemisphereLight(day.hemiSky, day.hemiGround, day.hemiIntensity);
  group.add(hemi);
  state.hemiLight = hemi;

  // 环境光：补一层，避免阴影死黑
  const ambient = new THREE.AmbientLight(0xffffff, day.ambient);
  group.add(ambient);
  state.ambientLight = ambient;

  // 主光：白天=太阳，夜里=月亮（同一个光源，只换方向与色温）
  const sun = new THREE.DirectionalLight(day.sunColor, day.sunIntensity);
  sun.castShadow = true;
  sun.shadow.mapSize.set(3072, 3072);
  sun.shadow.camera.left = -150;
  sun.shadow.camera.right = 150;
  sun.shadow.camera.top = 150;
  sun.shadow.camera.bottom = -150;
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 900;
  sun.shadow.bias = -0.0005;
  // normalBias 太大（0.6m）会把灌木/岩石这种小物件的投影整个推掉，这里收到 0.15m
  sun.shadow.normalBias = 0.15;
  sun.target.position.set(0, 0, -10);
  group.add(sun);
  group.add(sun.target);
  state.sunLight = sun;

  return group;
}

// 复用的临时对象，避免每帧 new
const _ca = new THREE.Color();
const _cb = new THREE.Color();
const _dir = new THREE.Vector3();

/** 把两个十六进制颜色按 t 插值写入 out */
function lerpHex(hexA, hexB, t, out) {
  _ca.setHex(hexA);
  _cb.setHex(hexB);
  return out.copy(_ca).lerp(_cb, t);
}

/**
 * 把「当前昼夜进度」应用到所有环境元素。
 * 注意：这里不保存进度，进度由主循环平滑逼近 state.time.target。
 * @param {number} t 0 = 白天，1 = 夜晚
 */
const _puddleA = new THREE.Color();
const _puddleB = new THREE.Color();

function applyTimeOfDay(t) {
  const A = PALETTE.day;
  const B = PALETTE.night;
  const k = clamp(t, 0, 1);
  const sun = state.sunLight;

  // ---- 光照方向：太阳/月亮位置插值 ----
  _dir.copy(A.sunDir).lerp(B.sunDir, k).normalize();
  sun.position.copy(_dir).multiplyScalar(360).add(sun.target.position);

  // ---- 主光强度与色温 ----
  lerpHex(A.sunColor, B.sunColor, k, sun.color);
  sun.intensity = lerp(A.sunIntensity, B.sunIntensity, k);

  // ---- 半球光 / 环境光 ----
  lerpHex(A.hemiSky, B.hemiSky, k, state.hemiLight.color);
  lerpHex(A.hemiGround, B.hemiGround, k, state.hemiLight.groundColor);
  state.hemiLight.intensity = lerp(A.hemiIntensity, B.hemiIntensity, k);
  state.ambientLight.intensity = lerp(A.ambient, B.ambient, k);

  // ---- 雾（雾色 = 天空地平线色，保证海天无缝）----
  lerpHex(A.fog, B.fog, k, state.scene.fog.color);
  state.scene.fog.density = lerp(A.fogDensity, B.fogDensity, k);
  state.renderer.setClearColor(state.scene.fog.color, 1);

  // 记录环境快照，供其它模块读取
  state.env.fogColor.copy(state.scene.fog.color);
  state.env.sunDir.copy(_dir);
  state.env.night = k;

  // ---- 天空 ----
  const su = state.uniforms.sky;
  if (su) {
    lerpHex(A.zenith, B.zenith, k, su.uZenith.value);
    lerpHex(A.horizon, B.horizon, k, su.uHorizon.value);
    lerpHex(A.cloud, B.cloud, k, su.uCloudColor.value);
    lerpHex(A.sunColor, B.sunColor, k, su.uSunColor.value);
    su.uSunDir.value.copy(_dir);
    su.uCloudCover.value = lerp(A.cloudCover, B.cloudCover, k);
    su.uNight.value = k;
    su.uSunDisc.value = 1 - smoothstep(0.12, 0.65, k);
    su.uMoonDisc.value = smoothstep(0.2, 0.8, k);
  }

  // ---- 星空 ----
  if (state.materials.stars) {
    state.materials.stars.opacity = smoothstep(0.3, 0.95, k) * 0.95;
  }

  // ---- 海水 ----
  const ou = state.uniforms.ocean;
  if (ou) {
    lerpHex(A.waterShallow, B.waterShallow, k, ou.uShallow.value);
    lerpHex(A.waterDeep, B.waterDeep, k, ou.uDeep.value);
    lerpHex(A.foam, B.foam, k, ou.uFoamColor.value);
    lerpHex(A.horizon, B.horizon, k, ou.uSkyColor.value);
    lerpHex(A.sunColor, B.sunColor, k, ou.uSunColor.value);
    ou.uSunDir.value.copy(_dir);
    lerpHex(A.fog, B.fog, k, ou.uFogColor.value);
    ou.uFogDensity.value = state.scene.fog.density;
    ou.uNight.value = k;
  }

  // ---- 潮池水面 ----
  const pu = state.uniforms.puddle;
  if (pu) {
    lerpHex(A.horizon, B.horizon, k, pu.uSky.value);
    lerpHex(A.sunColor, B.sunColor, k, pu.uSunColor.value);
    lerpHex(A.fog, B.fog, k, pu.uFogColor.value);
    // 水色也要随昼夜插值，否则夜里水洼还是白天那抹浅青
    pu.uDeep.value
      .copy(_puddleA.copy(A.waterDeep).lerp(A.waterShallow, 0.55))
      .lerp(_puddleB.copy(B.waterDeep).lerp(B.waterShallow, 0.55), k);
    pu.uSunDir.value.copy(_dir);
    pu.uFogDensity.value = state.scene.fog.density;
    pu.uNight.value = k;
  }

  // ---- 曝光 ----
  state.renderer.toneMappingExposure = lerp(A.exposure, B.exposure, k);

  // ---- 12.7 夜间自发光材质（帐篷透光 / 灯泡 / 灯面）----
  const nightK = state.env.night;
  if (state.nightGlowMats) {
    for (const m of state.nightGlowMats) {
      const target = (m.userData.nightEmissive || 0);
      m.emissiveIntensity = target * nightK;
    }
  }
  // 探照灯的可见光锥
  if (state.rear && state.rear.searchlight) {
    state.rear.searchlight.traverse((o) => {
      if (o.isMesh && o.material && o.material.uniforms && o.material.uniforms.uNight) {
        o.material.uniforms.uNight.value = nightK;
      }
    });
  }
  // 夜间开关阴影：白天开、夜里关（省一半 shadow pass）
  state.renderer.shadowMap.enabled = state.env.night < 0.5;
}

/**
 * 昼夜切换入口（对外暴露）
 * @param {number} t  0 = 白天，1 = 夜晚
 * @param {boolean} immediate 是否立即到位（初始化用）
 */
function setTimeOfDay(t, immediate = false) {
  state.time.target = clamp(t, 0, 1);
  if (immediate) {
    state.time.current = state.time.target;
    applyTimeOfDay(state.time.current);
  }
  syncTodUI();
}

/* =========================================================================
 * 12. 地台边界 / 分区调试线框（PLATFORM_BOUNDS.enabled 控制）
 * ========================================================================= */
function createBoundsDebug() {
  const group = new THREE.Group();
  group.name = 'bounds-debug';

  const { minX, maxX, minZ, maxZ } = BOUNDS;
  const positions = [];
  const colors = [];
  const push = (x1, y1, z1, x2, y2, z2, hex) => {
    positions.push(x1, y1, z1, x2, y2, z2);
    const c = new THREE.Color(hex);
    colors.push(c.r, c.g, c.b, c.r, c.g, c.b);
  };

  // 地面高度（线框贴着地形起伏，不然会浮在半空）
  const hAt = (x, z) => (state.terrainHeightAt ? state.terrainHeightAt(x, z) : 0) + 0.35;
  /** 沿一条地面线分段采样，让线跟着地形走 */
  const pushGround = (ax, az, bx, bz, hex, steps = 48) => {
    let px = ax, pz = az, py = hAt(ax, az);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const x = ax + (bx - ax) * t;
      const z = az + (bz - az) * t;
      const yy = hAt(x, z);
      push(px, py, pz, x, yy, z, hex);
      px = x; pz = z; py = yy;
    }
  };

  // 外框 + 四个角柱
  const corners = [
    [minX, minZ], [maxX, minZ], [maxX, maxZ], [minX, maxZ]
  ];
  for (let i = 0; i < 4; i++) {
    const [ax, az] = corners[i];
    const [bx, bz] = corners[(i + 1) % 4];
    pushGround(ax, az, bx, bz, 0x4fd6e3, 60);
    const ty = hAt(ax, az);
    push(ax, ty, az, ax, ty - 20, az, 0x4fd6e3);
  }

  // 分区界线（三条：+40 海 / +10 潮间带 / -50 内陆前沿）
  const zone = PLATFORM_BOUNDS.zone;
  pushGround(minX, zone.sea, maxX, zone.sea, PLATFORM_BOUNDS.colors.sea, 80);
  pushGround(minX, zone.intertidal, maxX, zone.intertidal, PLATFORM_BOUNDS.colors.intertidal, 80);
  pushGround(minX, zone.inland, maxX, zone.inland, PLATFORM_BOUNDS.colors.inland, 80);

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  const mat = new THREE.LineBasicMaterial({
    vertexColors: true,
    transparent: true,
    opacity: 0.6,
    depthTest: false,
    depthWrite: false
  });

  const lines = new THREE.LineSegments(geo, mat);
  lines.renderOrder = 20;
  lines.frustumCulled = false;
  group.add(lines);

  group.visible = PLATFORM_BOUNDS.enabled;
  state.groups.debug = group;
  state.boundsDebug = group;
  return group;
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  } else if (document.exitFullscreen) {
    document.exitFullscreen().catch(() => {});
  }
}

function toggleBounds(visible) {
  PLATFORM_BOUNDS.enabled = visible;
  if (state.boundsDebug) state.boundsDebug.visible = visible;
  const seg = document.getElementById('bounds-seg');
  if (seg) {
    for (const btn of seg.querySelectorAll('.seg-btn')) {
      const on = (btn.dataset.bounds === '1') === visible;
      btn.classList.toggle('is-on', on);
    }
  }
}

/* ---------------- 12.5.2 程序化纹理 ---------------- */
/** 混凝土：底色 + 骨料颗粒 + 大块污渍 + 浇筑分层缝 + 模板竖缝 + 水痕 + 细裂纹 */
function makeConcreteTexture(size = 512) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  const rnd = mulberry32(778899);
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      const blotch = fbm2p(u * 3, v * 3, 3, 4);
      const grain = fbm2p(u * 26, v * 26, 26, 3);
      const spec = noise2p(u * 150, v * 150, 150);
      let lum = 0.60 + (blotch - 0.5) * 0.20 + (grain - 0.5) * 0.13 + (spec - 0.5) * 0.07;
      // 浇筑分层：每 1/5 高度一条水平暗缝
      const pour = Math.abs(((v * 5) % 1) - 0.5);
      if (pour > 0.475) lum *= 0.80;
      // 模板竖缝：每 1/3 宽度一条
      const seam = Math.abs(((u * 3) % 1) - 0.5);
      if (seam > 0.487) lum *= 0.86;
      // 水渍：从顶部往下越来越淡的纵向暗带
      const streak = fbm2p(u * 10, v * 1.4, 10, 3);
      lum *= 1 - Math.max(0, streak - 0.52) * 0.55 * (1 - v * 0.55);
      const g = clamp(lum, 0, 1);
      const i4 = (y * size + x) * 4;
      d[i4] = (g * 232) | 0;
      d[i4 + 1] = (g * 228) | 0;
      d[i4 + 2] = (g * 216) | 0;
      d[i4 + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);

  // 细裂纹：随机游走折线
  ctx.lineWidth = 1;
  for (let k = 0; k < 26; k++) {
    let x = rnd() * size, y = rnd() * size;
    const seg = 6 + (rnd() * 10) | 0;
    ctx.strokeStyle = 'rgba(38,36,32,' + (0.18 + rnd() * 0.25).toFixed(2) + ')';
    ctx.beginPath();
    ctx.moveTo(x, y);
    for (let s = 0; s < seg; s++) {
      x += (rnd() - 0.5) * 26;
      y += (rnd() - 0.4) * 22;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // 锈/霉斑
  for (let k = 0; k < 14; k++) {
    const cx = rnd() * size, cy = size * 0.5 + rnd() * size * 0.5;
    const r = 8 + rnd() * 42;
    const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    grd.addColorStop(0, 'rgba(96,74,48,0.20)');
    grd.addColorStop(1, 'rgba(96,74,48,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }
  // 顶部流挂水痕
  for (let k = 0; k < 22; k++) {
    const x = rnd() * size;
    const w = 3 + rnd() * 16;
    const h = 40 + rnd() * 150;
    const grd = ctx.createLinearGradient(x, 0, x, h);
    grd.addColorStop(0, 'rgba(30,30,28,0.30)');
    grd.addColorStop(1, 'rgba(30,30,28,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(x, 0, w, h);
  }
  return finishTexture(c);
}

/** 伪装网：透明底 + 斜向网格 + 破洞 */
function makeCamoNetTexture(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, size, size);
  const rnd = mulberry32(4242);
  ctx.lineCap = 'round';
  // 两种情况都画：a) 斜网格线 b) 布条
  for (let i = -size; i < size * 2; i += 15) {
    ctx.strokeStyle = 'rgba(86,94,62,0.92)';
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i + size, size);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(68,74,48,0.92)';
    ctx.beginPath();
    ctx.moveTo(i, size);
    ctx.lineTo(i + size, 0);
    ctx.stroke();
  }
  // 布条斑块（打乱规律感）
  for (let k = 0; k < 90; k++) {
    const x = rnd() * size, y = rnd() * size;
    ctx.fillStyle = 'rgba(' + (52 + rnd() * 40 | 0) + ',' + (60 + rnd() * 40 | 0) + ',' + (38 + rnd() * 26 | 0) + ',0.85)';
    ctx.beginPath();
    ctx.ellipse(x, y, 3 + rnd() * 9, 2 + rnd() * 4, rnd() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  // 破洞（把网格擦掉一些）
  ctx.globalCompositeOperation = 'destination-out';
  for (let k = 0; k < 26; k++) {
    const x = rnd() * size, y = rnd() * size;
    ctx.beginPath();
    ctx.ellipse(x, y, 3 + rnd() * 12, 2 + rnd() * 7, rnd() * Math.PI, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = state.maxAniso || 4;
  return tex;
}

/** 木头：板条 + 木纹 */
function makeWoodTexture(size = 256) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(size, size);
  const d = img.data;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const u = x / size, v = y / size;
      // 木纹：沿 x 拉长的噪声
      const grain = fbm2p(u * 3, v * 34, 3, 4);
      const ring = 0.5 + 0.5 * Math.sin((v * 26 + grain * 5) * Math.PI);
      let lum = 0.42 + ring * 0.20 + (grain - 0.5) * 0.22;
      // 板缝
      const board = Math.abs(((v * 4) % 1) - 0.5);
      if (board > 0.465) lum *= 0.45;
      const g = clamp(lum, 0, 1);
      const i4 = (y * size + x) * 4;
      d[i4] = (g * 175) | 0;
      d[i4 + 1] = (g * 132) | 0;
      d[i4 + 2] = (g * 92) | 0;
      d[i4 + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return finishTexture(c);
}
